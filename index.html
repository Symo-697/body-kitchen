function mDef(key){for(const g of["body","other","custom"]){const d=measDefs(g).find(x=>x.key===key);if(d)return{...d,group:g}}return{key,name:key,unit:"",group:"body"}}
const fmtV=v=>Number.isInteger(v)?String(v):String(r1(v));
function mChange(ser){if(ser.length<2)return"";const d=ser[ser.length-1].v-ser[0].v;if(!d)return`<span class="muted">±0 since ${ser[0].date.slice(5)}</span>`;return`<span class="muted">${d>0?"+":"−"}${fmtV(Math.abs(r1(d)))} since ${ser[0].date.slice(5)}</span>`}
function measSection(title,group){const defs=measDefs(group);
 const cards=defs.map(d=>{const ser=mSeries(d.key);const last=ser[ser.length-1];
  return`<button class="mcard" onclick="meView={page:'detail',key:'${d.key}'};render();window.scrollTo(0,0)"><b>${esc(d.name)}</b><div style="flex:1;display:flex;align-items:center">${sparkMini(ser.slice(-12).map(x=>x.v))||`<span class="muted" style="font-size:.85rem">${ser.length?"":"No data yet"}</span>`}</div>
  <div style="border-top:1px solid var(--line);padding-top:.4rem">${last?`<b style="font-size:1.25rem">${fmtV(last.v)}</b> <span class="muted">${esc(d.unit)}</span>`:`<span style="color:var(--plum);font-weight:600">+ Add</span>`}</div></button>`}).join("");
 const addCard=group==="custom"?`<button class="mcard" style="align-items:center;justify-content:center;text-align:center" onclick="meView={page:'newcustom'};render();window.scrollTo(0,0)"><span style="font-size:1.8rem;line-height:1">+</span><b>Add measurement</b></button>`:"";
 const quick=group==="other"&&(S.core.prefs||{}).weigh!=="never"?`<div class="row" style="margin:.1rem 0 .6rem"><input id="qw" type="number" inputmode="decimal" step="0.1" placeholder="Today's weight (kg)" style="max-width:12rem"><button class="small" onclick="const v=+$('#qw').value;if(v)addMeas('weight',v,today())">Save</button></div>`:"";
 return`<div class="row" style="justify-content:space-between;margin-top:1.6rem"><h2 style="margin:0">${title}</h2>${defs.length?`<button class="ghost small" style="border:0" onclick="meView={page:'list',group:'${group}'};render();window.scrollTo(0,0)">See all</button>`:""}</div>
 ${quick}<div class="hscroll" style="margin-top:.6rem">${cards}${addCard}</div>`}
function setManual(k,v){S.core.profile.manual=S.core.profile.manual||{};S.core.profile.manual[k]=v===""?"":+v;if(!S.core.profile.manual.kcal)S.core.profile.manual=null;save("core");render()}
function saveApiKey(){const el=$("#apikey");const v=(el?el.value:"").replace(/\s+/g,"");if(!v){toast("Paste your key first.");return}
 if(!/^sk-ant-/.test(v)){toast("That doesn't look like an Anthropic API key: it should start with sk-ant-.");return}
 try{localStorage.setItem(KEYSTORE,v)}catch(e){toast("The key couldn't be saved on this phone.");return}render();toast("Key saved on this phone. Try ✨ Describe your meal in Today.")}
function aiKeyBoxHTML(){const k=apiKey();const inClaude=!!(window.claude&&window.claude.use);
 return`<p class="muted" style="margin:0 0 .5rem">"✨ Describe your meal" in Today uses ${inClaude?"your claude.ai account here. In the GitHub app it":"it"} uses your own Anthropic API key if you add one below, otherwise a free offline estimator (less clever, no internet needed).</p>
 ${k?`<p style="margin:0 0 .5rem">API key saved on this phone: <b>${esc(k.slice(0,10))}…${esc(k.slice(-4))}</b></p><button class="ghost small" onclick="try{localStorage.removeItem(KEYSTORE)}catch(e){};render()">Remove key</button>`:
 `<div class="row"><input id="apikey" type="password" class="grow" placeholder="sk-ant-…" autocomplete="off"><button class="small" onclick="saveApiKey()">Save</button></div>`}
 <details style="margin-top:.6rem"><summary>How to get a key (and cap the cost)</summary><ol style="margin:.4rem 0 0;padding-left:1.2rem;font-size:.9rem"><li>Go to <a href="https://platform.claude.com" target="_blank" rel="noopener">platform.claude.com</a> and create an account (separate from your Claude subscription).</li><li>Billing: add a small amount of credit (e.g. 5 €).</li><li>Limits: set a low monthly spend limit, so the key can never cost more.</li><li>API keys › Create key, copy it (it starts with sk-ant-) and paste it above.</li></ol>
 <p class="muted" style="font-size:.8rem;margin:.4rem 0 0">The key stays on this phone only: it's not in your backups, not synced and not in the GitHub code. Each estimate uses a small, fast model and costs a fraction of a cent. Don't lend your unlocked phone with the key saved; remove the key if you do.</p></details>`}
function measPage(){const v=meView;if(v.page==="plan")return planPage();if(v.page==="supps")return suppPage();const back=(to,label)=>`<button class="ghost small" onclick="meView=${to};render();window.scrollTo(0,0)">‹ ${label}</button>`;
 if(v.page==="list"){const defs=measDefs(v.group);const title={body:"Body measurements",other:"Other measurements",custom:"Custom measurements"}[v.group];
  return back("null","Me")+`<h2>${title}</h2><div class="box" style="padding:.2rem 1rem">${defs.map(d=>{const ser=mSeries(d.key);const last=ser[ser.length-1];
   return`<button onclick="meView={page:'detail',key:'${d.key}'};render();window.scrollTo(0,0)" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:.7rem;width:100%;box-sizing:border-box;padding:.8rem 0;border-bottom:1px solid var(--line)"><span style="flex:1"><b>${esc(d.name)}</b><br>${last?`<b>${fmtV(last.v)}</b> <span class="muted">${esc(d.unit)}</span> ${mChange(ser)}`:`<span class="muted">No data yet</span>`}</span>${sparkMini(ser.slice(-12).map(x=>x.v))}<span class="muted" aria-hidden="true">›</span></button>`}).join("")||`<p class="muted">Nothing here yet.</p>`}</div>
  ${v.group==="custom"?`<button onclick="meView={page:'newcustom'};render()">+ Add measurement</button>`:""}`}
 if(v.page==="newcustom"){return back("null","Me")+`<h2>New measurement</h2><div class="box"><label>Name</label><input id="cm-name" placeholder="e.g. Upper thigh, Wrist, Resting heart rate">
  <label style="margin-top:.7rem">Unit</label><select id="cm-unit" onchange="document.getElementById('cm-other').style.display=this.value==='other'?'block':'none'"><option value="cm">Length (cm)</option><option value="kg">Weight (kg)</option><option value="%">Percentage (%)</option><option value="kcal">Calories (kcal)</option><option value="other">Other (custom)</option></select>
  <input id="cm-other" placeholder="Your unit, e.g. bpm" style="display:none;margin-top:.5rem">
  <button style="margin-top:.9rem" onclick="addCustomMeas()">Create</button></div>`}
 const d=mDef(v.key);const ser=mSeries(d.key);const last=ser[ser.length-1];
 const days={"3m":92,"6m":183,"1y":366,"all":1e5}[mRange];const cut=daysAgo(Math.min(days,20000));const pts=ser.filter(x=>mRange==="all"||x.date>=cut);
 return back(`{page:'list',group:'${d.group}'}`,{body:"Body measurements",other:"Other measurements",custom:"Custom measurements"}[d.group])+`
 <h2>${esc(d.name)}</h2><div class="box">${last?`<div class="left-num" style="font-size:2.8rem">${fmtV(last.v)}<span style="font-size:1rem;font-weight:600"> ${esc(d.unit)}</span></div><div class="muted">${new Date(last.date+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})} ${mChange(ser)}</div>`:`<p class="muted" style="margin:0">No data yet. Add your first measurement below.</p>`}
 ${ser.length?`<div style="margin-top:.6rem">${pts.length>=2?lineChart(pts,d.unit):pts.length?`<p class="muted">One measurement in this period. The chart starts after the second.</p>`:`<p class="muted">No measurements in this period.</p>`}</div>
 <div class="chips" style="margin-top:.5rem">${[["3m","3M"],["6m","6M"],["1y","1Y"],["all","All"]].map(([k,l])=>`<button class="chip ${mRange===k?"on":""}" onclick="mRange='${k}';render()">${l}</button>`).join("")}</div>`:""}</div>
 <div class="box"><h3>Add a measurement</h3><div class="row"><input id="mv" type="number" inputmode="decimal" step="0.1" placeholder="${esc(d.unit||"value")}" style="max-width:9rem"><input id="md" type="date" value="${today()}" style="max-width:11rem"><button onclick="const x=$('#mv').value;if(x!=='')addMeas('${d.key}',+x,$('#md').value||today())">Add</button></div>
 ${d.key==="weight"?`<p class="muted" style="margin:.5rem 0 0">Weigh in the morning, after the toilet, before eating. The weekly check-in uses the average.</p>`:d.unit==="cm"?`<p class="muted" style="margin:.5rem 0 0">Measure every 2 weeks, same time of day, tape snug but not tight.</p>`:""}</div>
 ${ser.length?`<details class="box"><summary>View all data (${ser.length})</summary><table style="margin-top:.4rem">${ser.slice().reverse().map(x=>`<tr><td>${x.date}</td><td class="n">${fmtV(x.v)} ${esc(d.unit)}</td><td style="width:2rem"><button class="x" aria-label="Delete" onclick="delMeasVal('${x.id}','${d.key}')">×</button></td></tr>`).join("")}</table></details>`:""}
 ${d.custom?`<button class="ghost small" onclick="delCustomMeas('${d.key}')">Delete this measurement type</button>`:""}`}
function addMeas(key,v,date){S.body.entries.push({id:uidGen(),date,[key]:v});
 if(key==="waist"&&!S.core.phase.startWaist){S.core.phase.startWaist=v;save("core")}
 if(key==="height"){S.core.profile.height=v;save("core")}
 if(key==="weight"&&!S.core.profile.weight){S.core.profile.weight=v;save("core")}
 save("body");status="Saved";render()}
function delMeasVal(id,key){const e=S.body.entries.find(x=>x.id===id);if(!e)return;delete e[key];if(!Object.keys(e).some(k=>k!=="id"&&k!=="date"))S.body.entries=S.body.entries.filter(x=>x.id!==id);save("body");render()}
function addCustomMeas(){const n=$("#cm-name").value.trim();if(!n){toast("Give it a name.");return}let u=$("#cm-unit").value;if(u==="other")u=$("#cm-other").value.trim()||"";
 S.body.customM=S.body.customM||[];const key="c_"+uidGen();S.body.customM.push({key,name:n,unit:u});save("body");meView={page:"detail",key};render()}
async function delCustomMeas(key){if(!await ask("Delete this measurement and all its values?"))return;S.body.customM=(S.body.customM||[]).filter(c=>c.key!==key);S.body.entries.forEach(e=>delete e[key]);S.body.entries=S.body.entries.filter(e=>Object.keys(e).some(k=>k!=="id"&&k!=="date"));save("body");meView=null;render()}
function spark(E){const pts=E.slice(-60);const ws=pts.map(e=>+e.weight);const lo=Math.min(...ws)-.5,hi=Math.max(...ws)+.5;const W=600,H=120;
 const xy=pts.map((e,i)=>[i/(pts.length-1)*W,H-(+e.weight-lo)/(hi-lo)*H]);
 return`<div class="muted" style="margin-bottom:.3rem">Weight trend (${r1(lo+.5)}–${r1(hi-.5)} kg)</div><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Weight trend"><polyline fill="none" stroke="var(--plum)" stroke-width="3" vector-effect="non-scaling-stroke" points="${xy.map(p=>p.join(",")).join(" ")}"/></svg>`}
function setProf(k,v){S.core.profile[k]=k==="sex"||k==="injuries"||k==="diet"?v:(v===""?"":+v);save("core");render()}
async function setPhase(k){if(k===S.core.phase.name)return;const pp=S.core.phasePlan;
 if(k==="cut"||k==="minicut"){const T=targets();if(T&&(T.under||S.core.profile.noDeficit)){toast("A calorie deficit isn't available with your current BMI or health answers.");return}}
 if(!await ask(`Switch to ${PHASES[k].label}? Your calories and training volume will change.${pp&&!pp.paused?"\n\nThis pauses your phase plan (you can resume it later).":""}`))return;
 if(pp)pp.paused=true;switchPhase(k,S.core.phase.pace);save("core");render()}
function switchPhase(k,pace){S.core.phase={name:k,start:today(),startWaist:latestOf("waist")||null,startWeight:avgWeight(7,0)||latestWeight()||null,kcalAdjust:0,miniCut:false,pace:pace||"standard"};
 S.core.phaseLog=(S.core.phaseLog||[]).concat([{date:today(),name:k}]).slice(-200)}
function phaseAt(d){const L=S.core.phaseLog||[];let r=null;for(const x of L)if(x.date<=d)r=x.name;return r||(d>=S.core.phase.start?S.core.phase.name:null)}
function adj(v){S.core.phase.kcalAdjust=(+S.core.phase.kcalAdjust||0)+v;save("core");render()}
function addMeasure(){const e={id:uidGen(),date:$("#m-date").value||today()};let any=false;["weight","waist","hips","glutes","thigh","arm","bf"].forEach(k=>{const v=$("#m-"+k).value;if(v!==""){e[k]=+v;any=true}});
 if(!any)return;S.body.entries.push(e);if(!S.core.phase.startWaist&&e.waist){S.core.phase.startWaist=e.waist;save("core")}save("body");render()}
function rmMeasure(id){S.body.entries=S.body.entries.filter(e=>e.id!==id);save("body");render()}
/* photos in IndexedDB (too big for localStorage) */
const photoCache={};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("body-kitchen",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(id,data){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("photos","readwrite");t.objectStore("photos").put(data,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbDel(id){const d=await idb();return new Promise(res=>{const t=d.transaction("photos","readwrite");t.objectStore("photos").delete(id);t.oncomplete=res})}
async function idbAll(){const d=await idb();return new Promise(res=>{const out={};const t=d.transaction("photos");const c=t.objectStore("photos").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)}})}
async function loadPhotos(){try{Object.assign(photoCache,await idbAll());if(tab==="me")render()}catch(e){}}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=URL.createObjectURL(file)})}
async function uploadPhoto(inp){const file=inp.files[0];if(!file)return;status="Saving photo…";paintStatus();
 try{const data=await shrink(file);const id="p"+uidGen();await idbPut(id,data);photoCache[id]=data;S.body.photos.push({id,date:today()});save("body");status="Photo saved";render()}catch(e){status="Photo couldn't be saved";paintStatus()}}
async function delPhoto(id){if(!await ask("Delete this photo?"))return;await idbDel(id);delete photoCache[id];S.body.photos=S.body.photos.filter(p=>p.id!==id);save("body");render()}

let autoSetup=false;localLoad();seedRecipes();if(!S.core.setup&&!S.core.profile.age){autoSetup=true;startSetup()}render();connect();loadPhotos();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
</script>

<div id="gate" style="position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1.5rem">
 <form onsubmit="event.preventDefault();checkGate()" style="width:100%;max-width:320px;text-align:center">
  <div style="font-size:2.4rem">🍑</div><h1 style="margin:.3rem 0">Body &amp; Kitchen</h1><p class="muted" style="margin:0 0 1rem">Private beta. Enter the passcode.</p>
  <input id="gatecode" type="password" inputmode="numeric" autocomplete="off" placeholder="Passcode" style="text-align:center;font-size:1.3rem;letter-spacing:.3em">
  <p id="gatemsg" class="muted" style="min-height:1.2em;margin:.5rem 0"></p>
  <button type="submit" style="width:100%">Enter</button>
 </form>
</div>
<script>
(function(){const OK="bk-gate-cefc03e28481";let ok=false;try{ok=localStorage.getItem(OK)==="1"}catch(e){}
 if(ok){document.getElementById("gate").remove();return}
 document.getElementById("tabs").style.visibility="hidden";
 window.checkGate=async function(){const v=document.getElementById("gatecode").value.trim();
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("bk-beta-2026"+v));
  const hex=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  if(hex==="cefc03e2848100338cd35a889a840d2f821f3805ec70599dda254a991ad659eb"){try{localStorage.setItem(OK,"1")}catch(e){}document.getElementById("gate").remove();document.getElementById("tabs").style.visibility=""}
  else{document.getElementById("gatemsg").textContent="Wrong passcode.";document.getElementById("gatecode").value=""}};
 setTimeout(()=>{const i=document.getElementById("gatecode");i&&i.focus()},50)})();
</script>
