ight. Steps: Perform a standard push-up: 1.a Bend arms until chest almost touches the ground, making sure the…"], ["Bulgarian split squats", "gluteus_maximus quads", "hamstrings adductors", "r", "10-15", 0, "", "CC-BY-SA 4", "Stand tall in front of a chair and take a large step. Put the upper part of one of your feet on the chair. Bend the front knee, balancing with arms until the back knee almost touches the ground. Push back to the starting position and repeat."], ["Kneeling kickbacks", "gluteus_maximus", "hamstrings", "r", "10-15", 0, "", "CC-BY-SA 4", "Starting position: Get down on all fours. Steps: Push one foot back until fully extended, concentrating on the gluteus muscles. Stay for one second, then return to the initial position. Repeat, alternating feet."], ["Split squats", "gluteus_maximus quads", "hamstrings adductors", "r", "10-15", 0, "", "CC-BY-SA 4", "Starting position: Stand with your back straight. Take a large step forward with your left leg. Steps: Bring your pelvis down until you almost touch the floor with your right knee. Bring your pelvis back up. Repeat."], ["Jump rope: basic jumps", "", "", "c", "20-30", 0, "", "CC-BY-SA 4", "Starting position: Put your feet close together, bend the knees a bit, keep your head and body straight, keep elbows in, open your arms. Steps: Spin only your wrists with enough force to make the rope spin. Jump just high enough to pass the rope below your feet. Repeat. Notes: This exercise requires a jump rope. Make sure the rope length is adjusted to your height. One way to check is to grab…"], ["Reverse lunges", "gluteus_maximus quads", "hamstrings adductors", "r", "10-15", 0, "", "CC-BY-SA 4", "Starting position: Stand straight, feet hip-width apart. Steps: Step backward with one leg so it can bend comfortably to a 90 degree angle. Slowly bend both knees to form 90 degree angles. Return to the starting position. Repeat, alternating legs."], ["Floor dips", "triceps_brachii", "deltoid_anterior pectoralis_major", "r", "10-15", 0, "", "CC-BY-SA 4", "Starting position: Sit with your arms behind you, supporting your back.Your fingers should point forward.Your knees should be bent, feet together. Steps: Raise your hips off the ground, straightening your arms. Bend your elbows, bringing your hips down. Straighten your arms, returning to the previous position. Repeat steps 2 and 3. Notes: The exercise's difficulty depends on how high you bring your hips."], ["High plank", "rectus_abdominis", "deltoid_anterior obliques triceps_brachii", "t", "30-60", 0, "", "CC-BY-SA 4", "Starting position: Get into the high plank position:your hands and toes should be touching the ground, your back, arms and legs should be straight.To get to this position, you can lie down on your stomach, place your hands facing down next to your head, and lifting your arms up until they are straight. Steps: Maintain the starting position for the entire duration of the exercise."], ["Kettlebell deadlifts", "hamstrings gluteus_maximus", "quads trapezius erector_spinae", "w", "8-12", 0, "", "CC-BY-SA 4", "Starting position: Stand hip-width apart, with your kettlebell centered between your ankles. Your back should be straight, your head facing forward. Steps: Hinge at the hips and slightly bend at the knees to put your hands on the kettlebell handles. Your back should be straight as you perform the movement. Grab the kettlebell handles, with your hands pushing in opposite directions as if to pull…"], ["Alternating bicep curls", "biceps_brachii", "brachialis", "w", "8-12", 0, "", "CC-BY-SA 4", "Starting position: Start standing up with dumbbells in each hand, your back straight and feet hip-width apart. Your arms should be relaxed, pointing down. Your knees should be slightly bent, your abs contracted, and your shoulders down. Steps: Bend one arm at the elbow, bringing the dumbbell up to your shoulder. Your upper arm should remain motionless during this movement. Bring the dumbbell back…"], ["Pistol squats", "gluteus_maximus quads", "hamstrings gastrocnemius rectus_abdominis adductors", "r", "10-15", 0, "", "CC-BY-SA 4", "Stand on one leg, with your other leg straight and slightly forward. Bend one knee slowly, descending into a squat and keeping your back and your other leg straight. Slowly raise yourself from the squat, straightening the bent knee and keeping the other leg straight. Repeat."], ["Calf raises, right leg", "gastrocnemius", "soleus", "r", "10-15", 0, "", "CC-BY-SA 4", "Stand on the floor or on the edge of a step to increase the range of movement. Raise one foot. Lift your heel until you're standing on your toes. (variable) Stay in this position for three seconds Slowly lower your foot until you almost touch the ground with your heel - don't slam your foot!"], ["Single Arm Plank to Row", "deltoid_anterior biceps_brachii brachialis latissimus_dorsi obliques rectus_abdominis serratus_anterior", "rhomboids teres_major", "t", "30-60", 1, "", "CC-BY-SA 4", "Start position as row, extend to plank and back. Finish with row and repeat"], ["Hindu Pushups", "deltoid_anterior pectoralis_major", "triceps_brachii", "r", "10-15", 0, "Imobard", "CC-BY-SA 4", "Exercise to strengthen the shoulders and pectorals. Its name is due to the fact that it begins in the Yoga position \"Dog Facing Down\", passing to \"Cobra\" but without resting the legs or torso on the ground to finally end with a normal flexion. The exercise can also be performed backwards (back to the starting position). As a variation, after doing the push-up, the hip can be raised to return to downward facing dog."], ["Dumbbell Floor Press", "pectoralis_major", "deltoid_anterior biceps_brachii triceps_brachii", "w", "8-12", 0, "admin", "CC-BY-SA 4", "Grab your dumbbells and lay flat on your back with your knees bent and your feet flat on the ground (use a bench if you have one). Press the weights up, locking out your elbows (A). Lower them slowly until your upper arms are resting on the floor (B) close to your body. Pause here before explosively pressing back up. Squeeze your chest hard and repeat."], ["Close-grip Press-ups", "brachialis latissimus_dorsi pectoralis_major trapezius forearm_flexors", "deltoid_anterior biceps_brachii triceps_brachii", "r", "10-15", 0, "philip", "CC-BY-SA 4", "Drop into a strong plank position, bringing your hands close together until they're almost touching. (picture 1)Bend your elbows to slowly bring your chest to the floor (picture 2). Keep your elbows close to your body as you push back up explosively. Repeat. Ensure you take your time lowering on each rep, keeping your form sharp."], ["Dumbbell Hang Power Cleans", "hamstrings gluteus_maximus", "gastrocnemius quads trapezius", "t", "30-60", 0, "philip", "CC-BY-SA 4", "On your feet, stand tall with your dumbbells, holding them at your sides. Hinge at the hips to lower them to your knees (picture 1). Stand back up with a slight jump, using the momentum to pull the dumbbells up on to your shoulders (picture 2). Stand up straight, then lower under control to your sides and repeat. Keep this fast and explosive; if your heart rate doesn’t hit the roof, you’re doing them wrong."], ["Dumbbell sumo deadlift", "hamstrings gluteus_maximus", "quads trapezius erector_spinae", "w", "8-12", 0, "philip", "CC-BY-SA 4", "Lower your dumbbell to the ground between your legs. Assume a wide stance and with a straight back squat down. With the dumbbell standing upright, grip it by the top of the ‘head’ (picture 1).Keeping your chest up and core braced, push the floor away, driving back upwards to a standing position (picture 2). Repeat. If you can easily achieve 20-30 reps, use two dumbbells."], ["Medicine ball twist", "obliques rectus_abdominis", "", "w", "8-12", 0, "clafal", "CC-BY-SA 4", "In a seated position, the torso is rotated from side to side without forcing, approaching the knees and making the ball touch the ground from time to time"], ["Vpushup", "pectoralis_major quads rectus_abdominis triceps_brachii", "", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "Lift your body off the ground by pushing your arms upwards"], ["Plank Shoulder Taps", "deltoid_anterior gluteus_maximus rectus_abdominis", "latissimus_dorsi", "t", "30-60", 0, "clafal", "CC-BY-SA 4", "In the correct plank position, place your feet slightly wider than shoulder-width apart. alternately lift and touch the opposite shoulder with one hand."], ["Bag training", "deltoid_anterior pectoralis_major trapezius", "biceps_brachii hamstrings gastrocnemius latissimus_dorsi obliques rectus_abdominis", "c", "20-30", 0, "clafal", "CC-BY-SA 4", "Bag training improves muscle definition of: deltoids; rear deltoids; triceps; biceps, as well as being a great cardio exercise"], ["Rowing Machine", "deltoid_anterior biceps_brachii hamstrings brachialis gastrocnemius gluteus_maximus latissimus_dorsi obliques quads rectus_abdominis serratus_anterior soleus trapezius", "", "c", "20-30", 0, "Boertie", "CC-BY-SA 4", "Sit on a rowing machine with your back straight."], ["Seated Bench Press", "pectoralis_major", "", "r", "10-15", 0, "colundrum", "CC-BY-SA 4", "Set up the chest press machine so that the grips are aligned with your lower chest when you sit down. Make sure you're sitting with your back flat against the seat. Grab a handle in each hand, stick your chest out, and keep your head against the headrest. Breathe deeply and slowly push the handles forward until your arms are almost fully extended. Pause just before the lockout, then slowly return…"], ["Abduction while standing", "gluteus_medius gluteus_minimus", "tfl gluteus_maximus", "r", "10-15", 0, "tregga", "CC-BY-SA 4", "Training a stable stance, predominantly on one leg, is crucial for both sides. On the one hand, it prevents discomfort and, on the other, it establishes a stable foundation. The practitioner assumes the usual standing position and, with a stable upper body, attempts to repeatedly lift the unloaded leg, bend it at the hip and knee, and then lower it again. The movement is also repeated on the…"], ["Seated rear delt rise", "deltoid_posterior latissimus_dorsi", "rhomboids trapezius", "w", "8-12", 0, "philip", "CC-BY-SA 4", "Seated, bent 45 deg forward. Arms fully stretched out, raise arms up to shoulder height and back down"], ["Dynamic side hold", "obliques", "rectus_abdominis", "t", "30-60", 0, "philip", "CC-BY-SA 4", "Sling a rubber band on a kettlebell and lift the kettlebell by the rubber band. Let it hang by your side and stand on one leg, switch leg while continuing hold. Repeat with other hand"], ["Wall balls", "deltoid_anterior gluteus_maximus quads", "biceps_brachii pectoralis_major rectus_abdominis trapezius", "w", "8-12", 0, "philip", "CC-BY-SA 4", "Get a medicine ball, shoulder width stance, squat, thrust the ball as high as possible against the wall and catch"], ["Horizontal traction isometry", "latissimus_dorsi pectoralis_major", "deltoid_anterior biceps_brachii", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "Perform a timed isometric pull-up on the bar"], ["Alternate back lunges", "gluteus_maximus quads", "adductors", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "The posterior muscles of the buttocks, hamstrings, soleus and gastrocnemius are trained more"], ["walking bridge", "rectus_abdominis", "deltoid_anterior biceps_brachii gluteus_maximus latissimus_dorsi", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "from a standing position with knees slightly bent and hands resting on the floor. From here, proceed forward with your hands keeping your buttocks contracted and without losing control of your lower back."], ["Walking", "hamstrings gastrocnemius gluteus_maximus latissimus_dorsi obliques quads rectus_abdominis", "", "c", "20-30", 0, "", "CC-BY-SA 4", "Walking outdoor or indoor, try keeping a pace of at list 100 steps per minute."], ["Seated Knee Tuck", "rectus_abdominis", "obliques", "r", "10-15", 0, "utkb", "CC-BY-SA 4", "Sit on floor or mat. Place arms slightly behind you. Raise legs. Now extend your legs and pull them back."], ["Cable Concentration Curl", "biceps_brachii brachialis", "", "w", "8-12", 0, "cshep442", "CC-BY-SA 4", "The concentration curl is a classic exercise for building the biceps one arm at a time. It can be performed bent over or kneeling, but is more often performed seated on a bench. It's great for emphasizing the biceps peak and is often used to finish a biceps workout"], ["Push-Ups | Incline", "pectoralis_major", "triceps_brachii", "r", "10-15", 0, "anon1337", "CC-BY-SA 4", "Inclined push-ups primarily target the chest muscles (pectoralis major and minor), but also work the triceps, shoulders, and core to a lesser extent. Because the upper body is elevated, the incline push-up places less emphasis on the triceps compared to regular push-ups, which may be beneficial for individuals looking to specifically target their chest muscles."], ["Push-Ups | Decline", "pectoralis_major", "deltoid_anterior triceps_brachii", "r", "10-15", 0, "anon1337", "CC-BY-SA 4", "Decline push-ups are another modified version of the traditional push-up that target the upper body muscles in a different way. To perform a decline push-up, elevate your feet on an elevated surface, such as a bench, chair, or step, while placing your hands on the ground in a push-up position. Lower your body towards the ground while maintaining a straight line from your shoulders to your ankles,…"], ["Push-Ups | Parallettes", "pectoralis_major", "deltoid_anterior triceps_brachii", "r", "10-15", 0, "anon1337", "CC-BY-SA 4", "Parallettes push-ups are a variation of the traditional push-up that are performed with the hands on parallel bars, known as parallettes. To perform a parallettes push-up, assume a push-up position with your hands on the parallettes and your feet on the ground. Lower your body towards the ground while keeping your elbows close to your sides, and then push back up to the starting position.…"], ["Dumbbell farmer's carry", "forearm_flexors", "", "w", "8-12", 0, "philip", "CC-BY-SA 4", "Grab half your body weight in each hand and walk."], ["Seated Cable Row", "latissimus_dorsi", "biceps_brachii trapezius rhomboids teres_major", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "Take a seat on the machine with your feet planted, a little wider than shoulder width. Drive the heels, and squeeze the glutes. Grab onto the cable handle. Sit up tall with a slight bend through the knees. Tighten up the abs and low back to maintain a perpendicular angle to the floor with your torso. Roll the shoulders back and down. Squeeze them together as you row, thinking about pinching a…"], ["Remo maquina agarre estrecho", "latissimus_dorsi", "biceps_brachii trapezius", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "Remo en máquina con barra en agarre estrecho"], ["Remo maquina agarre estrecho supino", "latissimus_dorsi", "biceps_brachii trapezius", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "Remo en máquina o polea con agarre cerrado supino"], ["Wide-grip supinated lat pulldown", "latissimus_dorsi forearm_flexors", "rhomboids teres_major", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "Downward movement • Pull the bar down so that it passes close to your chin and touches the upper part of your chest. • Keep the rest of your body still."], ["Close-grip supinated lat pulldown", "latissimus_dorsi forearm_flexors", "rhomboids teres_major", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "Downward movement • Pull the bar down so that it passes close to your chin and touches the upper part of your chest. • Keep the rest of your body still."], ["Cable glute extension", "gluteus_maximus", "", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "This exercise lets you work the upper, or larger, part of the glutes. For that reason, it should never be missing from your routine of isolated exercises for training the glutes. Stand in front of a cable machine and locate the low pulley. Then attach the ankle strap to work on the low pulley. As for your posture, you should stay upright at all times. Pay special attention to your back to keep it…"], ["Machine glute extension", "gluteus_maximus", "", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "A GHD hip extension is one of the best exercises for the glutes. While the exercise mainly targets the glutes, it is also excellent for the lower back, the calves and the hamstrings."], ["Neutral-grip chest pulldown", "biceps_brachii latissimus_dorsi serratus_anterior forearm_flexors", "rhomboids teres_major", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "The lat pulldown is an important exercise for strengthening the back and improving posture, which can contribute to a healthier life. To perform this exercise correctly and avoid injury, it is important to follow a few key steps: Position yourself in front of the cable machine with your knees slightly bent and your feet on the floor. Grip the cable handle with your palms facing each other and…"], ["High-pulley pullover", "latissimus_dorsi serratus_anterior", "", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "Stand facing the machine, feet slightly apart, gripping the bar with an overhand grip, arms extended, hands shoulder-width apart. Keeping your back fixed and your abdominal muscles contracted, inhale and bring the bar down to your thighs while keeping your arms extended (or your elbows slightly bent). Exhale at the end of the movement."], ["Incline bench pulldown", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "Lying face down on the incline bench facing the cable machine, perform the pulldown."], ["Arabesque", "hamstrings gluteus_maximus", "", "r", "10-15", 0, "cleen", "CC-BY-SA 4", "Take all your weight onto one leg and you're going to maintain that position, keeping your hips and pelvis level the whole time. With your back in a neutral position you want to tilt yourself forward kicking your leg back up and then slowly with your glutes bring yourself back up to neutral."], ["Back extensión", "latissimus_dorsi serratus_anterior", "", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "Espalda en maquina de extensión con peso"], ["Triceps Pushdown", "triceps_brachii", "", "w", "8-12", 0, "anto.kreegyr", "CC-BY-SA 4", "Triceps pushdown on cable using lat bar."], ["One Arm Bent Row", "latissimus_dorsi", "biceps_brachii trapezius rhomboids teres_major", "w", "8-12", 1, "anto.kreegyr", "CC-BY-SA 4", "One arm bent over row on cable with a machine"], ["Side bend", "obliques", "rectus_abdominis", "w", "8-12", 0, "", "CC-BY-SA 4", "With a weight in one hand, extend that arm down and bend the other arm, resting your hand on your head. Now move the hand holding the weight by rotating your torso up and down."], ["Alternating Biceps Curls With Dumbbell", "biceps_brachii", "", "w", "8-12", 0, "Franpol", "CC-BY-SA 4", "Hold two dumbbells, the arms are streched, the hands are on your side, the palms face inwards. Bend one arm at a time and bring the weight with a fast movement up. At the same time, rotate your arms by 90 degrees at the very beginning of the movement. At the highest point, rotate a little the weights further outwards. Without a pause, bring the arm back down, slowly, and do the same with the…"], ["Russian Twist", "latissimus_dorsi obliques rectus_abdominis", "", "w", "8-12", 0, "lion", "CC-BY-SA 4", "Hold a dumbbell, barbell weight or something else that is heavy with both hands, but make sure it is not too heavy and you are able to keep in form. Lean back to a 45-degree angle from the floor. For an extra challenge, lift your feet off the floor. Rotate your arms to one side to the same level as your chest, touch the floor for a little extra challenge, and then do the same to the other side.…"], ["Pallof Press", "deltoid_anterior gluteus_maximus obliques rectus_abdominis serratus_anterior trapezius", "pectoralis_major triceps_brachii", "w", "8-12", 0, "prevail90", "CC-BY-SA 4", "The Pallof press is an anti-rotation exercise that trains the larger and smaller muscles around the spine to resist rotation. Stand parallel to the cable machine or to the anchor point to the resistance band and clasp with the handle or band with both hands. Make sure your torso is front on and bring your hands to the center of your chest and slowly press out. Slowly return your hands to the chest and repeat."], ["Side Slides + Squats", "quads", "gastrocnemius gluteus_maximus adductors", "r", "10-15", 0, "Insight", "CC-BY-SA 4", "With feet a little wider than shoulder-width apart and staying low to mimic a defensive position, you should step with their lead leg and push off with their plant leg. After three slides, rotate your body for 180 degree on the guiding (/outer) leg and do a squat. Continue."], ["Wall Drills", "quads", "gastrocnemius", "r", "10-15", 0, "Insight", "CC-BY-SA 4", "Exercises for strengthening knee and leg musculature. Lateral Wall Drills March - https://youtu.be/9RiTlJ6Mmek Lateral Wall Drills OPEN - https://youtu.be/ADRlN8-Wfdg Lateral Wall Drills CROSS - https://youtu.be/hGH2sj0Tzu4"], ["Inverted Rows", "biceps_brachii latissimus_dorsi", "pectoralis_major rectus_abdominis trapezius", "r", "10-15", 0, "Gavru", "CC-BY-SA 4", "Maintain a straight body, retract your shoulder blades, and pull your chest to the bar for an effective back and upper body workout."], ["Dragon squat", "quads", "hamstrings gastrocnemius gluteus_maximus adductors", "r", "10-15", 0, "cynomops", "CC-BY-SA 4", "Start standing with your feet hip-width apart. Cross your right foot behind you to the left corner and back of the room while bending both knees. Return and repeat, alternating sides. Keep your hips and shoulders forward as you cross your feet and bend your knees."], ["Side Lying Hip Abduction", "gluteus_medius gluteus_minimus", "tfl gluteus_maximus", "r", "10-15", 0, "wakanda90", "CC-BY-SA 4", "Begin by lying down on your side with your top leg straight and your bottom leg bent for support. Lift your top leg off the ground (optional) - Hold position at the top Resources: 40 seconds YouTube video: https://www.youtube.com/watch?v=g9FtnmsIYgI"], ["Calf raises, left leg", "gastrocnemius", "", "r", "10-15", 0, "wakanda90", "CC-BY-SA 4", "Stand on the floor or on the edge of a step to increase the range of movement. Raise one foot. Lift your heel until you're standing on your toes. (variable) Stay in this position for three seconds Slowly lower your foot until you almost touch the ground with your heel - don't slam your foot!"], ["Cycling cardio session", "", "", "c", "20-30", 0, "", "CC-BY-SA 4", "Cardio session on a Technogym Bike Excite 1000 stationary bike."], ["Wrist curl, dumbbells", "forearm_flexors", "", "w", "8-12", 0, "wakanda90", "CC-BY-SA 4", "Sitting on a bench, grab the dumbbell with your palms facing up and your hands shoulder-width apart. Rest your forearms on your thighs and allow your wrists to hang over your knees. Perform the movement by curling your palms and wrists towards your face. (optional/variable) Pause at the top. Slowly return to the starting position."], ["Prisoner Squat", "gluteus_maximus quads", "hamstrings adductors", "r", "10-15", 0, "lxmx", "CC-BY-SA 4", "Stand upright with your chest slightly raised, your feet hip-width apart and your toes pointing straight ahead. Bring your hands to the back of your head with your fingers slightly interlaced and your elbows pointing to the side. Push your hips back and bend your knees, keeping your upper body as upright as possible. Push your knees outwards, they must never point towards each other. If your…"], ["Shoulder width three-point push-up", "pectoralis_major", "deltoid_anterior rectus_abdominis triceps_brachii", "r", "10-15", 0, "lxmx", "CC-BY-SA 4", "Get into a push-up position with your shoulders directly above your hands and your feet hip-width apart. Draw your belly button in towards your spine and tighten your abdominal muscles. Lift your left foot about five centimetres off the floor. Point your toes straight down. Do not move your hips. Your body forms a straight line from your head to your heels throughout the exercise. Now bend your…"], ["Front lever tuck", "deltoid_anterior biceps_brachii latissimus_dorsi", "triceps_brachii", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "The muscles involved in the Front Lever, most subjected to stress, are mainly the extensors such as: the latissimus dorsi, the teres major, the posterior deltoid and the long head of the biceps."], ["Reverse Snow Angel", "trapezius", "deltoid_anterior hamstrings gluteus_maximus obliques rectus_abdominis", "r", "10-15", 0, "mike6426", "CC-BY-SA 4", "Lay flat on your stomach with your arms extended in front of you on the ground as your legs are lying flat. Lift both your arms and move them to your side slowly. Then, move them back."], ["Finger Pushup", "pectoralis_major", "deltoid_anterior rectus_abdominis triceps_brachii", "r", "10-15", 0, "", "CC-BY-SA 4", "Hand Positioning: Start in a plank position with your hands directly beneath your shoulders. Spread your fingers wide apart, placing them firmly on the ground. Finger Placement: Gradually lift your palms off the ground, shifting the weight onto your fingers. Focus on distributing the load evenly across your fingertips and thumbs. Body Alignment: Maintain a straight line from head to heels to…"], ["knee push-ups", "deltoid_anterior pectoralis_major", "serratus_anterior triceps_brachii", "r", "10-15", 0, "PaukOne", "CC-BY-SA 4", "Start by kneeling on the floor, keeping your knees together. Place your hands on the floor in front of you, slightly wider than shoulder-width apart. Make sure your body forms a straight line from head to knees. Hands should be positioned below shoulders. Lower your torso towards the ground, bending your elbows while keeping your trunk stable. Keep your knees in contact with the floor. Push…"], ["Australian pull-ups", "deltoid_anterior biceps_brachii latissimus_dorsi", "trapezius rhomboids teres_major", "r", "10-15", 0, "PaukOne", "CC-BY-SA 4", "Lie down under a high bar or suspension bar, positioned at an appropriate height. Position yourself on your back under the bar, gripping the bar with a supinated grip (palms facing you). Adjust your position so that your body is aligned straight from head to toe. Arms should be fully extended, shoulders stabilized, and legs aligned with the rest of the body. Bend your elbows and pull your chest…"], ["Claps over the head", "deltoid_anterior", "", "r", "10-15", 0, "Lynn_McIntyre", "CC-BY-SA 4", "Stand with your feet shoulder width apart. Raise your arms and clap over your head"], ["Dumbbell drag curls", "biceps_brachii", "", "w", "8-12", 0, "Lynn_McIntyre", "CC-BY-SA 4", "Hold a dumbbell in each hand with your palms facing forward. Pull your elbows back and lift the dumbbells to your chest height. Slowly lower the dumbbell and repeat the exercise."], ["Dumbbell wide bicep curls", "biceps_brachii", "", "w", "8-12", 0, "Lynn_McIntyre", "CC-BY-SA 4", "Hold a dumbbell in each hand with your hands slightly wider than shoulder-width apart and palms facing forward. Bend your elbows and lift the dumbbells to your shoulders. Slowly return and repeat."], ["Dumbbell bicep curl to press", "biceps_brachii", "", "w", "8-12", 0, "Lynn_McIntyre", "CC-BY-SA 4", "Bend your elbows and lift the dumbbells to your shoulders. Push the dumbbells over your head while rotating your arms to make your palms face forward. Reverse it to lower down. Repeat the exercise."], ["Dumbbell rear delt row", "deltoid_posterior brachialis trapezius", "rhomboids teres_major", "w", "8-12", 0, "Lynn_McIntyre", "CC-BY-SA 4", "Hold a dumbbell in each hand. Bend at your hips to make your back almost parallel to the floor. Let your arms hang down. Keep your arms in line with your shoulders. bend and lift your elbows out to the sides until your upper arms are parallel to the floor. Slowly return and repeat"], ["Dumbbell close grip bench press", "pectoralis_major triceps_brachii forearm_flexors", "", "w", "8-12", 0, "Lynn_McIntyre", "CC-BY-SA 4", "Lie down with your back on a flat bench. Hold a dumbbell in each hand. Raise your arms towards the ceiling with your palms facing each other and dumbbells pressed together. Slowly lower the dumbbells to your chest, then slowly push them back. Repeat the exercise."], ["Dumbbell Single-leg Hip Thrust", "gluteus_maximus", "hamstrings quads gluteus_medius", "w", "8-12", 1, "carlos3c", "CC-BY-SA 4", "The single-leg hip thrust is performed by placing your upper back on a weight bench, raising one leg, and extending the hip of the other leg to achieve an isolated contraction of the glute. By working each side separately, you can fully isolate your glutes unilaterally, providing maximal training stimulus."], ["Frog stand", "deltoid_anterior biceps_brachii brachialis rectus_abdominis", "", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "Starting position: Stand with your feet shoulder-width apart and your toes pointing forward, facing a wall or bench for support if needed. Bend your knees into a squat position. Place your hands on the ground in front of you, shoulder-width apart, with your fingers spread wide. Make sure your elbows are under your shoulders and your body forms a straight line from your head to your heels. Upward…"], ["Exercise Band Dorsiflexion", "soleus", "", "w", "8-12", 0, "erikocobra", "CC-BY-SA 4", "This exercise uses an exercise band. It targets the Soleus and Tibialis anterior."], ["Exercise Band Plantarflexion", "gastrocnemius", "soleus", "w", "8-12", 0, "erikocobra", "CC-BY-SA 4", "Banded plantarflexion is a great way to bridge the gap between plantarflexion range of motion and the more strenuous calf raises in weight bearing. This can help strengthen the calf muscles, load the Achilles tendon, and improve plantarflexion range of motion."], ["Double Leg Calf Raise", "gastrocnemius soleus", "", "r", "10-15", 0, "erikocobra", "CC-BY-SA 4", "The double leg heel raise is important to strengthen and create control and stability around the ankle and knee, and provide balance and control for the hip and pelvis."], ["Front Lever", "latissimus_dorsi rectus_abdominis", "", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "The front lever is a figure where the body is kept in a horizontal position parallel to the floor."], ["TRX roll out", "rectus_abdominis", "obliques serratus_anterior", "r", "10-15", 0, "cynomops", "CC-BY-SA 4", "Hold the handles in your hands, extend your arms and keep them parallel at chest height. The movement you need to perform is to open your arms in line with your shoulders while leaning your body forward. Try not to extend your shoulders beyond 90°, and keep your abdominal muscles and glutes contracted. Muscles involved: transverse abdominis, rectus abdominis and spinal erectors."], ["Ice cream maker", "latissimus_dorsi", "rectus_abdominis", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "From the final phase of a pull-up, we push ourselves back with our shoulders until we reach the front lever position. From there, we pull ourselves back up to the starting position."], ["Front lever pull-up", "biceps_brachii latissimus_dorsi rectus_abdominis", "deltoid_anterior rhomboids teres_major", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "in the front lever position, with legs extended or easier if collected, pull by bringing the chest closer to the bar."], ["TRX Obliques", "obliques rectus_abdominis serratus_anterior", "deltoid_anterior pectoralis_major", "w", "8-12", 0, "cynomops", "CC-BY-SA 4", "Place your feet in the stirrups and assume a high plank with your hands directly beneath your shoulders. Pull your knees to your right elbow, then push them back out and to the centre."], ["TRX hammer curl", "biceps_brachii forearm_extensors", "", "w", "8-12", 0, "cynomops", "CC-BY-SA 4", "Place the grips as if they were a continuation of the straps. We will position our arms stretched forward and our body leaning back, completely straight. The biceps muscles will activate as you bend your elbows to bring your body towards the straps. The contraction movement will end with a slight outward movement of the hands, due to the grip we are using."], ["TRX gorilla biceps curl", "brachialis", "biceps_brachii", "w", "8-12", 0, "cynomops", "CC-BY-SA 4", "We'll stand facing the TRX straps and grab them with our fists facing each other, facing forward, with our arms fully extended at about shoulder-width apart. We'll keep our body straight, backward, as in the previous exercises, since we'll be lifting our body toward the TRX straps by activating our biceps. Our body will be straight, with our feet flat on the floor. This time, we'll place our arms…"], ["Trx Single Arm Bicep Curl", "biceps_brachii brachialis", "deltoid_anterior trapezius", "w", "8-12", 1, "cynomops", "CC-BY-SA 4", "Step 1: Stand comfortably and grasp the handles of the suspension system. Step 2: Lean back resting your weight on one arm, keepng the spine neutral. Step 3: Slowly curl to pull your body weight to the up position. Supinate the arm and squeeze as you approach the end position. Step 4: Lower yourself back down and repeat."], ["TRX Tricep Extension", "triceps_brachii", "", "w", "8-12", 0, "cynomops", "CC-BY-SA 4", "Attach the TRX or other suspension system overhead, having the handles hanging at chest level or slightly lower. Experiment to see what height allows you to set up in the best way. Stand in front of the handles and grab them with your palms facing down. Engage your abs, squeeze your glutes, take a breath and lean forward, lifting your heels off the floor. Keep your elbows straight. Take another…"], ["TRX dips", "triceps_brachii", "pectoralis_major", "r", "10-15", 0, "cynomops", "CC-BY-SA 4", "Start with the hands on the suspension trainer and feet on the ground. Your hands should be under your shoulders with the feet slightly in front. Lower yourself by bringing the hips between the handles and flexing the elbows. Extend the elbows to come back to the starting position and repeat."], ["Low Pulley Cable Fly", "pectoralis_major", "deltoid_anterior", "w", "8-12", 0, "FEFFO", "CC-BY-SA 4", "Adjust the cable machine: Set the pulley to the lowest setting possible. Choose your handles: You can use neutral grip handles (palms facing each other) or straight handles depending on your preference. Neutral grip might be easier on your wrists. Stand with proper form: Stand with your feet shoulder-width apart, knees slightly bent, and core engaged. Maintain a slight arch in your lower back…"], ["Pullover", "pectoralis_major", "latissimus_dorsi", "w", "8-12", 0, "3leh", "CC-BY-SA 4", "Doubling as a back and chest exercise, the Dumbbell Pullover can train both your pecs and lats."], ["Biceps Close Grip Pull Down", "biceps_brachii forearm_flexors", "deltoid_anterior latissimus_dorsi rhomboids teres_major", "w", "8-12", 0, "daniel.escada", "CC-BY-SA 4", "On a lat pull down machine, hold the bar keeping your hands relatively close. Use an underhand grip (I.E.: the back of your hand must be facing the machine). Then pull down the bar in a straight line towards the ground. Make sure your biceps are the main drivers of the motion. You will probably feel your shoulders and lats working, but make sure your biceps are working more."], ["Isometria trazioni impugnatura inversa", "latissimus_dorsi", "biceps_brachii trapezius", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "Trazioni in isometria con impugnatura inversa"], ["Incline Chest-Supported Dumbbell Row", "biceps_brachii latissimus_dorsi trapezius", "rhomboids teres_major", "w", "8-12", 0, "carlos3c", "CC-BY-SA 4", "Set up an adjustable bench at a 45-degree angle. Lay on your stomach with your head hanging just above the edge of the bench. Grab a dumbbell in each hand and set up with a good posture – core and lats engaged and shoulders neutral. Row the dumbbells toward the top of the stomach and squeeze the back at the top of the rep. Finally, lower the dumbbells back to the starting position and repeat…"], ["Pseudo Planche Push-up", "deltoid_anterior", "pectoralis_major", "r", "10-15", 0, "vdrb", "CC-BY-SA 4", "You should have the shoulder line in front of your wrists an perform a push-up, maintaining the shoulder in the same position"], ["Talons fesses", "gastrocnemius", "hamstrings", "c", "20-30", 0, "painDpice", "CC-BY-SA 4", "Touch your heels to your buttocks, while remaining static or moving"], ["Dynamic Planche", "rectus_abdominis", "obliques", "r", "10-15", 0, "painDpice", "CC-BY-SA 4", "Start in a plank position, with your hands directly under your shoulders and your feet hip-width apart. Engage your core to keep your body in a straight line from head to toe. From this position, bend your knees slightly and jump with both feet inward, bringing them as close to your core as possible As soon as your feet touch the ground, push off forcefully to jump again and return to the…"], ["Reach ups", "obliques", "rectus_abdominis", "r", "10-15", 0, "painDpice", "CC-BY-SA 4", "To perform this exercise, lie on your back with your arms extended overhead. Then, contract your abdominals and lift your torso off the floor while reaching your arms toward the ceiling to \"reach\" as high as possible. Slowly return to the starting position, controlling the movement. Reach ups strengthen the abdominal muscles and improve the flexibility of the spine. They can be incorporated into…"], ["Dynamic side plank", "obliques", "rectus_abdominis", "t", "30-60", 0, "painDpice", "CC-BY-SA 4", "The dynamic side plank involves positioning yourself on your side, supported on one elbow and the side of your foot, then dipping your hips up and down while keeping your body in a straight line."], ["Seated Dumbbell Curls", "biceps_brachii", "brachialis", "w", "8-12", 0, "sTiKyt", "CC-BY-SA 4", "Seated Dumbbell Curls are an effective bicep workout that isolates the muscles by stabilizing the upper body, reducing momentum that can detract from the exercise’s effectiveness. This exercise is performed sitting down with a dumbbell in each hand, focusing on controlled movement to maximize engagement of the bicep muscles."], ["Reverse Grip Barbell Curls", "biceps_brachii forearm_extensors forearm_flexors", "brachialis", "w", "8-12", 0, "sTiKyt", "CC-BY-SA 4", "Hold the barbell with an overhand grip (palms facing down) approximately shoulder-width apart. Ensure your back is straight, shoulders slightly pulled back, and arms fully extended. Curl the barbell upwards towards your chest in a controlled motion, keeping your elbows close to your body. The motion should be smooth without any swinging or momentum use. Once the barbell is at chest level, pause…"], ["Reverse-grip pull-ups", "biceps_brachii latissimus_dorsi forearm_flexors", "rectus_abdominis rhomboids teres_major", "r", "10-15", 0, "clafal", "CC-BY-SA 4", "Pull-ups on the bar with your thumbs pointing outward."], ["One armed push-ups", "pectoralis_major triceps_brachii", "deltoid_anterior rectus_abdominis", "r", "10-15", 1, "clafal", "CC-BY-SA 4", "Perform push-ups with one hand, alternating the sides"], ["Single-leg hamstring curl", "hamstrings", "gluteus_maximus", "r", "10-15", 1, "clafal", "CC-BY-SA 4", "Specifically, the muscles involved are: biceps femoris, semimembranosus and semitendinosus."], ["Low-Cable Cross-Over - NB", "pectoralis_major", "deltoid_anterior", "w", "8-12", 0, "JackSparrow", "CC-BY-SA 4", "The low-cable cross-over is an isolation movement that uses a cable stack to target the upper portion of the pectoral muscles. It is common in upper-body and chest-focused muscle-building workouts, often in combination with presses or flyes from other angles to target all portions of the chest."], ["High-Cable Cross Tricep Extention - NB", "triceps_brachii", "", "w", "8-12", 0, "JackSparrow", "CC-BY-SA 4", "The high-cable cross tricep extension is an isolation exercise for targeting the triceps, particularly the long head. It utilizes cables and handles grasped with opposite hands, allowing for a unique pressing motion that can be effective for building tricep strength. Unlike exercises that use a straight bar or rope, this variation can be more comfortable on your wrists and elbows"], ["JM Press", "triceps_brachii", "biceps_brachii pectoralis_major", "w", "8-12", 0, "Epiphany8424", "CC-BY-SA 4", "The JM press keeps your shoulders stationary, relying on the elbow flexion and extension to move the weight using your triceps strength. That means you get all the benefits of the best triceps-strengthening exercises without overtaxing that delicate shoulder joint. Classic win-win!"], ["Helms Row", "latissimus_dorsi", "trapezius rhomboids teres_major", "w", "8-12", 0, "carlos3c", "CC-BY-SA 4", "Setup: Place your chest on the end of a bench, using a towel or anything soft to keep your chest protected. You want your chest to be in contact with the bench around the nipple line. Your back should be almost parallel to the floor Execution: When you’re starting the exercise, focus on pulling your elbows back until you feel maximum tightness in the lats. If you want to get some trap activation…"], ["Meadows Row", "latissimus_dorsi trapezius", "biceps_brachii rectus_abdominis rhomboids teres_major", "w", "8-12", 0, "carlos3c", "CC-BY-SA 4", "The Meadows row is a unilateral row performed with a landmine setup, overhand grip, and staggered stance. Lean your torso forward and grip the barbell. Rest the other forearm on the forward leg. Start this movement by driving the elbow behind you while retracting the shoulder-blade. Keep the working shoulder down. Pull toward your back hip until the elbow is level with your torso."], ["Front Plank", "rectus_abdominis", "obliques pectoralis_major quads serratus_anterior", "t", "30-60", 0, "hektkaso", "CC-BY-SA 4", "The plank is a bodyweight exercise. As a multi-functional movement, the plank not only targets your abdominal muscles but also the spine and hip. Plank strengthens and tightens your entire body, improves your posture and balance, reduces body fat, and can help boost your metabolism. Exercises such as the “plank pose” help streng -15", 0, "captive0592", "CC-BY-SA 4", "Stand with your feet closer together. Hinge at your hips and lower your upper body towards your toes. Reach your hands towards your feet, try to touch your toes, the ground, or as far down your legs as you can comfortably go."], ["Elephant Walks", "hamstrings", "gastrocnemius", "r", "10-15", 0, "captive0592", "CC-BY-SA 4", "Hinge at your hips until you feel a stretch behind your knees. Bend one leg while the other is straight then fluidly bend the other knee while straightening the first knee."], ["Good Morning", "hamstrings erector_spinae", "", "r", "10-15", 0, "captive0592", "CC-BY-SA 4", "Stand with your feet more than shoulder-width apart (wider stance) and place your hands on your hips. Hinge at your hips and lower your upper body towards the ground while keeping your back straight then come back up."], ["Sit & Reach", "hamstrings", "", "r", "10-15", 0, "captive0592", "CC-BY-SA 4", "Sit on the ground with your legs extended straight in front of you. Reach both hands forward, trying to reach past your toes or as far as you can go. Return to the starting position and repeat."], ["Crossbody Leg Swings", "hamstrings", "", "r", "10-15", 0, "captive0592", "CC-BY-SA 4", "Hold onto a wall or something near you for support. Swing one leg across the front of your body, then back and out to the side. Repeat while slowly increasing your range of motion."], ["Standing Pancake", "hamstrings", "", "r", "10-15", 0, "captive0592", "CC-BY-SA 4", "Stand and open your legs as wide as possible into a straddle position. Then bend at the hips, pushing them back while keeping your back straight."], ["Standing Pancake Good Morning", "hamstrings erector_spinae", "", "r", "10-15", 0, "captive0592", "CC-BY-SA 4", "Stand with your feet wider than shoulder-width apart and toes pointed slightly outward. Place your hands on the back of your head. Hinge at your hips and lower your upper body towards the ground, keeping your back straight and chest open."]  keeping your feet flat on the floor and hip-width apart. Place your arms along your sides, palms facing inward, just off the floor. Engage Core: Lift your head, shoulders, and upper back slightly off the ground. Keep your neck neutral and chin slightly tucked. Perform the Movement: Side-bend to the right, reaching your right…"], ["bicycle crunches", "rectus_abdominis", "obliques", "r", "10-15", 0, "hpmbala@gmail.com", "CC-BY-SA 4", "Bicycle crunches are a core exercise performed on the floor. Lie on your back with your hands behind your head and legs extended. Lift your shoulders off the ground, bring one knee toward your chest, and twist your torso so your opposite elbow meets the knee. Alternate sides in a pedaling motion, ensuring controlled movements and engaging your core throughout the exercise."], ["Hack Squats", "quads", "hamstrings gastrocnemius gluteus_maximus adductors", "w", "8-12", 0, "hpmbala@gmail.com", "CC-BY-SA 4", "Hack squats target the lower body and are performed on a hack squat machine or with a barbell. For the machine variation, position yourself on the platform with your shoulders under the pads and feet slightly forward. Push through your heels to lift the weight, then bend your knees to lower the platform in a controlled motion until your thighs are parallel to the ground. Push back up to the…"], ["Dumbbell Crunches", "rectus_abdominis", "obliques", "w", "8-12", 0, "hpmbala@gmail.com", "CC-BY-SA 4", "Dumbbell crunches are a weighted variation of traditional crunches designed to target the abdominal muscles more intensely. Lie flat on your back with your knees bent and feet flat on the floor. Hold a dumbbell with both hands close to your chest or above your head. Lift your shoulders and upper back off the ground in a crunching motion, engaging your core. Slowly lower yourself back to the…"], ["Biceps Curl Machine", "biceps_brachii", "brachialis", "w", "8-12", 0, "hpmbala@gmail.com", "CC-BY-SA 4", "The biceps curl machine is designed to isolate the biceps muscles and provide a controlled range of motion. Sit on the machine with your back against the pad and adjust the seat so your arms are aligned with the machine's handles or pads. Grip the handles firmly, keeping your elbows fixed in place, and curl the handles upward by contracting your biceps. Slowly lower the handles to the starting…"], ["Toe Taps", "rectus_abdominis", "", "r", "10-15", 0, "hpmbala@gmail.com", "CC-BY-SA 4", "Toe taps are a core-focused exercise performed lying on your back. Lie flat with your arms by your sides and your legs raised to a tabletop position (knees bent at 90 degrees). Slowly lower one foot to gently tap the floor, keeping your core engaged and your lower back pressed into the ground. Return to the starting position and alternate legs. This exercise strengthens the core while minimizing…"], ["Standing Side Crunches", "obliques", "rectus_abdominis", "r", "10-15", 0, "hpmbala@gmail.com", "CC-BY-SA 4", "Standing side crunches are a dynamic exercise that targets the obliques while improving balance and stability. Stand upright with your feet shoulder-width apart and hands behind your head or holding a dumbbell in one hand. Lean your torso to one side, contracting your obliques, while bringing your elbow toward your hip (or crunching toward the weight if using a dumbbell). Return to the starting…"], ["Dumbbell Shoulder Rotations", "deltoid_anterior", "", "w", "8-12", 0, "hpmbala@gmail.com", "CC-BY-SA 4", "Dumbbell shoulder rotations are designed to strengthen the rotator cuff muscles and improve shoulder stability and mobility. External Rotation : Hold a dumbbell in one hand, keeping your elbow bent at 90 degrees and close to your body. Rotate your forearm outward, away from your body, keeping your elbow stationary. Slowly return to the starting position. Internal Rotation : Hold a dumbbell in one…"], ["Plate Pinch Hold", "deltoid_anterior", "", "t", "30-60", 0, "hpmbala@gmail.com", "CC-BY-SA 4", "The plate pinch hold is  the handle with a neutral grip and hold it next to your chest with your elbow fully flexed and tight to your side. Turn away from the pulley so your torso is at 45 degrees. Hold the other side of the functional trainer with your corresponding hand. Assume a staggered stance for better balance. While keeping your chest proud,…"], ["Cross-Body Cable Y-Raise", "deltoid_anterior latissimus_dorsi trapezius", "", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Attach a D-Bar to the cable machine. Perform a motion akin to drawing a sword from across your body."], ["No Leg Drive Dumbbell Chest Press", "pectoralis_major", "deltoid_anterior triceps_brachii", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Set up for a normal Dumbbell chest press but lift your leg ups straight or put them on another bench to remove the leg drive."], ["punches", "deltoid_anterior triceps_brachii", "", "r", "10-15", 0, "lh1701", "CC-BY-SA 4", "stand stable and throw normal straight punches"], ["Dumbbell Underhand Dead Row", "biceps_brachii", "latissimus_dorsi rhomboids teres_major", "w", "8-12", 0, "Moffi", "CC-BY-SA 4", "The Dumbbell Underhand Dead Row will involve the back, which means you can try a bit heavier weight. The catch is that you need to be able to control the weight for all the reps. Start by holding a pair of dumbbells with your feet shoulder-wide apart and your knees slightly bent. Hinge at your hips to lower your torse forward until it's almost parallel to the floor, keeping your back flat and…"], ["Pause Hack Squats", "quads", "hamstrings gastrocnemius gluteus_maximus adductors", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Hack Squats but with a 1-2s pause at the bottom of the movement. This makes sure that there is no more elastic energy stored in the muscles."], ["Spider Curl", "biceps_brachii", "", "r", "10-15", 0, "Moffi", "CC-BY-SA 4", "To get the most out of DB Spider Curls, you need an adjustable weight bench set at a 45-degree incline. This inclined position allows your arms to hang freely, putting them in an extended start position with elbows slightly in front of your torso, which is the key to maintaining low-level isometric tension throughout the movement pattern. Lie face-down on an adjustable weight bench with your…"], ["Calf Raise using Hack Squat Machine", "gastrocnemius soleus", "adductors", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Ideally using a trapeze addon, Lift the weight up using your calves by getting on your toes."], ["Incline Close Grip Barbell Bench Press", "triceps_brachii forearm_flexors", "deltoid_anterior pectoralis_major", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Narrower grip than regular bench press, just outside shoulder width."], ["Floor Skull Crusher", "triceps_brachii", "", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Allowing you to safely load more weight than a regular skull crusher, lie on the floor and rest the weight on the floor in between each repetition."], ["Bent over Cable Flye", "pectoralis_major", "", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Holding your upper body at an approximate 105° angle."], ["1-Arm Half-Kneeling Lat Pulldown", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Attach a D-Handle to a high pully. And use your lat muscles to pull the weight single handedly."], ["Kroc Row", "latissimus_dorsi trapezius", "rhomboids teres_major", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Dumbbell rows with looser technique but heavier weight."], ["Cable Shrug-In", "trapezius", "", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Attach two D-Handles to two low cables and shrug in using your upper traps."], ["Reverse Cable Flye", "deltoid_anterior", "trapezius", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Attach D-Handles to two cable pulleys in the upper position. Grab the left on with your right hand and vice-versa."], ["W-Raise", "obliques rectus_abdominis", "", "r", "10-15", 0, "Moffi", "CC-BY-SA 4", "This challengi re trying to move the upper torso without moving the lower torso. Start lying on the ground with feet flat on the floor and crossed arms above your head with hands behind head. Lift upper body up and clear your shoulder blades off the ground and then hold and pause at the top for a one or two count. Try to make the upper abs work and hold that contraction for 10 good quality reps."], ["Sit Up Elbow Thrust", "obliques rectus_abdominis", "", "r", "10-15", 0, "Moffi", "CC-BY-SA 4", "This is a top down rotation movement, and it’s a bit more explosive, too. Lying with knees bent and feet on the floor, sit up and then drive your left elbow across your entire body toward the right, then come back to center and then finally lower yourself down. Then hit the other side."], ["Lying Triceps Extensions", "triceps_brachii", "", "w", "8-12", 0, "Moffi", "CC-BY-SA 4", "Starting position for this practical triceps exercise is lying on a standard bench holding a barbell or two dumbbells in both hands with an overhand grip, hands at shoulder width apart. Begin with arms over your upper chest and elbows bent back at about a 45-degree angle. First bend at the elbows and then allow the upper arm to drop back, bringing the barbell/dumbbells behind your head and down…"], ["Drag Pushdown", "triceps_brachii", "", "w", "8-12", 0, "Moffi", "CC-BY-SA 4", "Starting position for this rope pushdown is standing facing a cable machine with the handles of a rope attachment in both hands and feet shoulder width apart. Hinge forward slightly at the hips maintaining an upright chest and bring the shoulders and elbows behind the body so that when you push down on the cable attachments, you can get a fully contracted triceps long head. Drag the cable machine…"], ["Dumbbell Cheat Curl", "biceps_brachii", "", "w", "8-12", 0, "Moffi", "CC-BY-SA 4", "Starting position is standing with feet shoulder width apart. Hands should take an underhand or supinated grip on the dumbbells holding them with hands shoulder s using cables. Can be seated or standing"], ["Pull-up Isometric Hold", "biceps_brachii latissimus_dorsi trapezius", "rhomboids teres_major", "t", "30-60", 0, "DiscoCop", "CC-BY-SA 4", "Hold the pull-up movement in any position"], ["Archer Pull Up", "latissimus_dorsi", "biceps_brachii trapezius rhomboids teres_major", "r", "10-15", 0, "Antsy6277", "CC-BY-SA 4", "An archer pull-up is an advanced bodyweight exercise that strengthens your back and biceps, serving as a progression towards a one-arm pull-up. It gets its name from the \"bow-drawing\" position your body takes at the top.Here's how to do it: Grip: Grasp a pull-up bar with a wider-than-shoulder-width overhand grip. Starting Position: Hang with arms fully extended, engaging your core and keeping…"], ["Larsen Press", "pectoralis_major", "triceps_brachii", "w", "8-12", 0, "Expenses7000", "CC-BY-SA 4", "Put your legs up on a separate Bench and press with no leg drive"], ["Stair Master", "hamstrings gastrocnemius gluteus_maximus quads", "", "c", "20-30", 0, "MisterPinnacle", "CC-BY-SA 4", "cardio and lower-body strength machine designed to simulate climbing stairs. It provides a low-impact, high-intensity workout that targets the legs, glutes, and core while improving cardiovascular endurance."], ["Push-Up", "pectoralis_major", "deltoid_anterior rectus_abdominis triceps_brachii", "r", "10-15", 0, "Settebello", "CC-BY-SA 4", "The push-up is a fundamental bodyweight exercise that targets the chest, arms, and shoulders while engaging the core for stability. It requires no equipment and is excellent for building upper body strength. Instructions: Start in a plank position with hands placed slightly wider than shoulder-width, feet together, and body in a straight line from head to heels. Engage your core and lower your…"], ["Clap Push-UP", "pectoralis_major", "deltoid_anterior rectus_abdominis triceps_brachii", "r", "10-15", 0, "Settebello", "CC-BY-SA 4", "The clap push-up is an explosive upper body movement that builds power and fast-twitch muscle strength. It adds a plyometric challenge to the traditional push-up by requiring the hands to leave the ground mid-rep. Start in a strong push-up position with your hands slightly wider than shoulder-width and core engaged Lower your body explosively and push off the ground with enough force to lift your…"], ["Devil’s Press", "deltoid_anterior gluteus_maximus pectoralis_major", "hamstrings latissimus_dorsi obliques triceps_brachii", "w", "8-12", 0, "Settebello", "CC-BY-SA 4", "The Devil’s Press is a hybrid movement combining a dumbbell burpee and a double dumbbell snatch. It’s a full-body, high-intensity exercise that develops strength, power, and metabolic conditioning. Start with a dumbbell in each hand and perform a burpee, letting your chest touch the ground while holding the dumbbells. Explosively jump your feet forward and swing the dumbbells between your legs.…"], ["Alternating dumbbell hammer curl", "biceps_brachii forearm_extensors", "", "w", "8-12", 0, "Mariano_O", "CC-BY-SA 4", "Stand with your knees slightly bent and your back straight. Hold a dumbbell in each hand, using a neutral grip at your sides."], ["Bird Dog", "rectus_abdominis", "deltoid_anterior gluteus_maximus", "r", "10-15", 0, "Settebello", "CC-BY-SA 4", "The Bird Dog is a core stability exercise that enhances balance, coordination, and spinal alignment. It’s a low-impact movement ideal for strengthening the posterior chain and improving overall functional control. Begin on all fours with hands under shoulders and knees under hips, keeping your spine neutral. Extend your right arm forward and left leg backward simultaneously, keeping hips square.…"], ["Ab wheel", "rectus_abdominis", "obliques serratus_anterior", "r", "10-15", 0, "lhegedus", "CC-BY-SA 4", "Starting Position : Kneel on the floor with the ab wheel in front of you. Grip the Wheel : Hold the handles firmly. Roll Out : Slowly roll the wheel forward, extending your body while keeping your core tight.
