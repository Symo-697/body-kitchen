erformed on a treadmill to improve endurance, burn calories, and promote heart health. It offers multiple benefits, such as the ability to easily adjust speed and incline, allowing for a variety of workouts, from hill walking to high-intensity interval training (HIIT) and tempo runs. To optimize results, it's important to vary your workouts. Benefits of Treadmill…"], ["Dumbbell donkey kick", "hamstrings gluteus_maximus", "", "w", "8-12", 0, "Tierrasverdes", "CC-BY-SA 4", "The dumbbell donkey kick is an effective exercise for working the glute and hamstring muscles. This exercise is usually performed on all fours, using a dumbbell to add resistance. The steps for performing it correctly are described below. Starting position: Get on all fours on a mat, with your hands aligned under your shoulders and your knees aligned under your hips. Placing the dumbbell: Take a…"], ["Stationary bike cardio", "", "", "c", "20-30", 0, "Tierrasverdes", "CC-BY-SA 4", "Benefits of Stationary Bike Cardio Stationary bike cardio is an excellent form of exercise that offers multiple benefits for health and well-being. Here are some of the most notable ones: Improved Cardiovascular Health Strengthens the heart: Regular exercise helps improve the heart's efficiency and reduce the risk of cardiovascular disease. Increases circulation: It improves blood flow, which can…"], ["Seated Dumbbell Calf Raise", "gastrocnemius", "", "w", "8-12", 0, "AlucardEvil40", "CC-BY-SA 4", "The seated dumbbell calf raise is a targeted exercise for strengthening the lower leg muscles. It follows the same movement pattern as the machine version: you place the weight on your knees, and by extending and flexing your ankles, you move the weight."], ["Unilateral Cable row", "latissimus_dorsi serratus_anterior", "rhomboids teres_major", "w", "8-12", 1, "Rottekongen", "CC-BY-SA 4", "Put a vertical seated bench in front of the cable row machine.position it so that you can focus on one side, and then do slow pulls focusing on the lateral muscles and ensuring tention in those muscles when in a stretched position."], ["Blaze", "deltoid_anterior gluteus_maximus pectoralis_major quads", "biceps_brachii hamstrings latissimus_dorsi rectus_abdominis", "c", "20-30", 0, "ricwheatley", "CC-BY-SA 4", "BLAZE is a full-body HIIT workout. Designed to supercharge your cardio fitness and strength. Delivered in its own purpose-built studio, BLAZE is a unique mix of martial arts, intense cardio and strength training."], ["Rope Pullover/row", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "Rottekongen", "CC-BY-SA 4", "Set up bench in front of cable row machine. Lean over bench to do a row/pullover with rope that targets lats. See picture."], ["Modified pulldown", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "Rottekongen", "CC-BY-SA 4", "With an inclined bench in front of the pulldown machine, use a close-grip to do latfocused pulldowns."], ["Single arm row", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 1, "Rottekongen", "CC-BY-SA 4", "Sitting on the ground, use a high cable in a single grip, to do lat pulldowns with a focus on a long stretch in the lats."], ["Barbell Clean and press", "deltoid_anterior pectoralis_major", "", "w", "8-12", 0, "Rottekongen", "CC-BY-SA 4", "This exercise involves lifting a barbell from the ground to the shoulders, then pressing it overhead. It is a compound movement that targets multiple muscle groups, including the legs, back, shoulders, and arms. It is often used in strength and conditioning programs to improve overall power and athleticism."], ["Dumbbell Bent Over Face Pull", "deltoid_posterior latissimus_dorsi", "trapezius rhomboids", "w", "8-12", 0, "AlucardEvil40", "CC-BY-SA 4", "This exercise involves using dumbbells to perform a bent over face pull, which targets the upper back and shoulders. The movement involves pulling the weights towards the face while keeping the elbows high and squeezing the shoulder blades together."], ["Dumbbell Front Squat", "gluteus_maximus quads", "deltoid_anterior rectus_abdominis adductors", "w", "8-12", 0, "AlucardEvil40", "CC-BY-SA 4", "This exercise involves holding a dumbbell in each hand at shoulder height and performing a squat. It targets the lower body muscles, including the quads, hamstrings, and glutes, while also engaging the core and upper body."], ["Kettlebell One Legged Deadlift", "gluteus_maximus", "erector_spinae", "w", "8-12", 1, "AlucardEvil40", "CC-BY-SA 4", "This exercise involves holding a kettlebell in one hand and standing on one leg while bending forward to touch the kettlebell to the ground. It targets the hamstrings, glutes, and lower back while also improving balance and stability."], ["Dumbbell Hip Thrust", "gluteus_maximus quads", "gluteus_medius", "w", "8-12", 0, "AlucardEvil40", "CC-BY-SA 4", "This exercise involves sitting on the ground with a dumbbell resting on the hips, then thrusting the hips upward while squeezing the glutes. It is a great exercise for strengthening the glutes and improving hip mobility."], ["Weighted Crunch", "obliques", "", "w", "8-12", 0, "AlucardEvil40", "CC-BY-SA 4", "The Weighted Crunch is a variation of the classic crunch exercise that involves adding resistance (a weight) to increase the intensity of the abdominal work. Lay down (Optional) Bend your knees to add difficulty (Optional) Bend your knees and let your feet rest on a bench or a box or something (90 degree angle on knees) Lift your head and torso while bending your back forward (if you don't it's a…"], ["Dumbbell Side Bend", "obliques", "", "w", "8-12", 0, "AlucardEvil40", "CC-BY-SA 4", "This exercise involves holding a dumbbell in one hand and bending sideways to work the oblique muscles on the side of the body. It can be done standing or seated and is often used as a core strengthening exercise."], ["Dumbbell Rear Lunge", "gluteus_maximus quads", "soleus adductors", "w", "8-12", 0, "AlucardEvil40", "CC-BY-SA 4", "This exercise involves holding a dumbbell in each hand and stepping back into a lunge position, then returning to standing. It primarily targets the glutes, hamstrings, and quadriceps."], ["Dumbbell Romanian Deadlift", "hamstrings gluteus_maximus", "erector_spinae", "w", "8-12", 0, "AlucardEvil40", "CC-BY-SA 4", "This exercise involves holding a dumbbell in each hand and bending forward at the hips while keeping the back straight, then returning to a standing position. It primarily targets the hamstrings and glutes."], ["Dumbbell Side Squat", "gluteus_maximus quads", "hamstrings adductors", "w", "8-12", 0, "AlucardEvil40", "CC-BY-SA 4", "This exercise involves holding a dumbbell in one hand and performing a squat while stepping to the side. It targets the legs, glutes, and core muscles."], ["Machine Lateral Raise", "deltoid_lateral", "deltoid_anterior", "w", "8-12", 0, "roneydya", "CC-BY-SA 4", "The machine lateral raise is an isolation exercise that targets the medial (side) deltoid muscle to build wider, more defined shoulders. The machine's fixed path of motion provides greater stability than dumbbells, making it ideal for beginners or those who want to focus solely on muscle activation."], ["Cable Chest Press - Decline", "pectoralis_major", "triceps_brachii", "w", "8-12", 0, "Shiladree", "CC-BY-SA 4", "Single arm chest press done with the cable machine. Use the other arm to brace bodyweight to focus on strength of the press, rather than balancing of the body. Start with the hand as close to the chest as possible, and then press against the cable at a slight decline and aiming towards the center of your chest."], ["Preacher Curl - Internally Rotated", "biceps_brachii", "", "w", "8-12", 0, "Shiladree", "CC-BY-SA 4", "Single arm curl that can be done using a dumbbell and a preacher bench, or a preacher curl machine. Turn body towards the weight"], ["Preacher Curl - Externally Rotated", "biceps_brachii", "", "w", "8-12", 0, "Shiladree", "CC-BY-SA 4", "Single arm curl that can be done using a dumbbell and a preacher bench, or a preacher curl machine. Turn body away from the weight"], ["Lat Pulldown - Cross Body Single Arm", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 1, "Shiladree", "CC-BY-SA 4", "Sit at lat pulldown machine with body at a diagonal angle so that only one leg is under the pad. Pull the cable down with the opposite arm. this will force the cable to across your body while pulling down. Emphasises the stretch of the lat."], ["Cable Chest Press - Incline", "pectoralis_major", "triceps_brachii", "w", "8-12", 0, "Shiladree", "CC-BY-SA 4", "Single arm chest press done with the cable machine. Use the other arm to brace bodyweight to focus on strength of the press, rather than balancing of the body. Start with the hand as close to the chest as possible, and then press against the cable at a slight incline and aiming towards the center of your chest."], ["Cable Triceps Press", "triceps_brachii", "", "w", "8-12", 0, "Shiladree", "CC-BY-SA 4", "A single arm exercise that starts with the hand close to the chest with with the elbows bent, and the elbow flared out. Press forward and down against the cable straightening the elbow."], ["Cable Tri Extension - Internal Rotation", "triceps_brachii", "", "w", "8-12", 0, "Shiladree", "CC-BY-SA 4", "single arm exercise with cable held at opposite shoulder with elbow bent. Turn towards the cable, and the straighten the elbow across the body."], ["Curl - With Shoulder Elevated", "biceps_brachii", "", "w", "8-12", 0, "Shiladree", "CC-BY-SA 4", "Place elbow so that it is about level with the shoulder. Curl the wieght to your shoulder. Focus on the stretch in the eccentric part of the curl"], ["One Arm Overhead Cable Tricep Extension", "triceps_brachii", "", "w", "8-12", 1, "AlucardEvil40", "CC-BY-SA 4", "Set the pulley at the bottom of the cable machine and grab onto it without using any attachments. Extend the cable directly overhead. While keeping your back straight and upper arm stationary, lower the cable behind your head until you feel a good stretch in your triceps, and then extend it back upward until your elbow is locked out."], ["Leg Swings (Front–Back)", "hamstrings", "gluteus_maximus quads", "r", "10-15", 0, "Jhonatan", "CC-BY-SA 4", "Stand tall next to a wall or stable support. Swing one leg forward and backward in a controlled motion, keeping the torso upright and the core engaged. Alternate legs after completing the repetitions."], ["Seated Hip Abduction", "gluteus_medius gluteus_minimus", "tfl gluteus_maximus", "r", "10-15", 0, "Iko", "CC-BY-SA 4", "Starting Position: Adjust the seat height so that your knees are aligned with the pivot point of the machine. Sit with your back flat against the backrest, maintaining good posture. Place the outside of your thighs against the machine's padded levers. Position your feet flat on the footrests or platform of the machine. Grasp the handles or sides of the seat for stability. Ensure your spine is…"], ["Wall Angels", "trapezius", "deltoid_anterior", "w", "8-12", 0, "bbayuwega", "CC-BY-SA 4", "The Wall Angels exercise primarily targets the upper back and shoulder muscles , helping improve posture , shoulder mobility , and scapular control ."], ["seated figure four", "gluteus_maximus", "", "r", "10-15", 0, "ricardodavidrd", "CC-BY-SA 4", "Seat on a bench. Feet flat on the ground. Place your left ankle over your right knee. Your right knee stays flat. Keep your back straight. Gently push your left knee down."], ["Zottman curl", "biceps_brachii brachialis", "", "w", "8-12", 0, "meldun", "CC-BY-SA 4", "With your palms facing forward, curl the weights up to your shoulders. Turn your hands so that that your palms downwards and slowly return the weights back down. Finally face your palms back forward."], ["Dumbbell Thruster", "hamstrings gluteus_maximus quads", "deltoid_anterior", "w", "8-12", 0, "meldun", "CC-BY-SA 4", "Start with the dumbbells resting on your shoulders and squat down. Push into standing and raise the dumbbells into an overhead position. Bring the dumbbells back to your shoulders and repeat."], ["Glute Bridge Single-Arm Press", "pectoralis_major", "deltoid_anterior biceps_brachii hamstrings gluteus_maximus triceps_brachii", "w", "8-12", 1, "meldun", "CC-BY-SA 4", "With one dumbbell in hand, perform a glute bridge. Now hold the dumbbell above your chest, this is the rep starting position. Lower the dumbbell so that your elbow touches the floor or is roughly 45 degrees below your shoulder if using a bench. Push the dumbbell back into the starting position."], ["Bear crawl pull through", "deltoid_anterior gluteus_maximus quads rectus_abdominis", "hamstrings gastrocnemius trapezius", "w", "8-12", 0, "meldun", "CC-BY-SA 4", "Place a dumbbell at around hip level and assume a bear crawl position. Push the knees off the floor and hold. With the opposite hand reach for the dumbbell and pull it to the other side. Place your hand back on the floor and repeat with your other hand."], ["Kickstand RDL", "hamstrings", "", "w", "8-12", 0, "eriktrinkle", "CC-BY-SA 4", "use non-working leg's toes to help with balance and perform an RDL."], ["Cable Fly Middle Chest", "pectoralis_major", "", "w", "8-12", 0, "daiben", "CC-BY-SA 4", "Execution Start position: Arms extended out to your sides (a big “T” shape), feeling a stretch in your chest. Movement: Bring your hands together in front of your chest in a wide hugging motion . Focus on squeezing your chest at the center. Do not lock your elbows or turn it into a press. Return: Slowly open your arms back to the start, maintaining tension on the chest."], ["Cable Fly Upper Chest", "pectoralis_major", "", "w", "8-12", 0, "daiben", "CC-BY-SA 4", "Execution Start position: Arms down and slightly behind your body, elbows slightly bent. Feel a light stretch across your chest. Movement: Bring your hands upward and together in front of your upper chest — roughly at chin to collarbone level . Use a smooth, controlled motion (avoid jerking). Squeeze your chest at the top for 1–2 seconds. Return: Slowly let your arms move back down and out to the…"], ["Cable Fly Lower Chest", "pectoralis_major", "", "w", "8-12", 0, "daiben", "CC-BY-SA 4", "Execution Start position: Arms extended out to your sides in a “Y” shape. Feel a stretch in your chest (slight bend in elbows — don’t lock them). Movement: Bring your hands downward and together in front of your lower chest or upper abs , in a smooth arc motion. Squeeze your chest hard at the bottom for 1–2 seconds. Return: Slowly raise your arms back up along the same path until you feel a good…"], ["Incline Static Hold", "pectoralis_major", "", "t", "30-60", 0, "daiben", "CC-BY-SA 4", "Execution Hold Position: Lower the dumbbells a few inches above your chest — about the midpoint of a normal incline press. This is where your upper chest is under maximum tension. Static Hold: Hold the position for 20–45 seconds while keeping the chest tight. Breathe slowly but stay tense — do not relax your chest or shoulders . End the set: After the hold, carefully bring the dumbbells down and rest."], ["Flat Machine Press", "pectoralis_major", "", "w", "8-12", 0, "daiben", "CC-BY-SA 4", "Execution Start position: Elbows bent at roughly 90°, hands just outside your chest. Keep wrists straight and aligned with your forearms. Pressing phase (concentric): Push the handles forward until your arms are almost fully extended — don’t lock out. Focus on squeezing your chest at the end of the movement. Returning phase (eccentric): Slowly bring the handles back toward your chest, feeling the…"], ["Pull-Ups (Wide Grip)", "latissimus_dorsi forearm_flexors", "rhomboids teres_major", "r", "10-15", 0, "daiben", "CC-BY-SA 4", "Execution Pulling phase (concentric): Drive your elbows down and slightly back , pulling your chest toward the bar . Focus on leading with your chest , not your chin. Keep your shoulders depressed (avoid shrugging). Top position: Chin should clear the bar (or at least reach bar level). Pause for a brief squeeze in your lats ."], ["Pull-Ups (Neutral Grip)", "latissimus_dorsi forearm_flexors", "rhomboids teres_major", "r", "10-15", 0, "daiben", "CC-BY-SA 4", "Execution Pulling phase (concentric): Drive your elbows down and back , pulling your chest toward your hands . Keep your shoulders depressed and retracted (avoid shrugging). Focus on squeezing your lats and upper back at the top. Top position: Chin should clear or reach the level of your hands. Pause briefly and contract your lats hard."], ["Barbell Row (Overhand)", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "daiben", "CC-BY-SA 4", "Execution Starting position: Hold the barbell with arms fully extended toward the floor. Maintain tension in your lats and back muscles."], ["Barbell Row (Underhand)", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "daiben", "CC-BY-SA 4", "Execution Starting position: Hold the barbell with arms fully extended toward the floor. Maintain tension in your lats and back muscles."], ["Barbell Romanian Deadlift (RDL)", "hamstrings gluteus_maximus", "erector_spinae", "w", "8-12", 0, "daiben", "CC-BY-SA 4", "Execution Hinge at the hips: Push your hips backward , keeping a slight bend in the knees (soft knees). Lower the barbell along the front of your thighs/shins while maintaining a neutral spine . Keep the bar close to your body ."], ["One-Arm Heavy Row", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 1, "daiben", "CC-BY-SA 4", "Execution Rowing phase (concentric): Pull the dumbbell toward your lower chest or waist , leading with your elbow . Keep your torso stable — avoid twisting or rotating your shoulders. Pause at the top and squeeze your lats ."], ["Jalón al pecho con agarre ancho", "latissimus_dorsi trapezius", "biceps_brachii brachialis", "w", "8-12", 0, "Mariano_O", "CC-BY-SA 4", "The lat pulldown is a pulling exercise that primarily targets the latissimus dorsi muscles (commonly known as “lats”) in your back. It involves pulling a cable bar or handle down towards your chest while seated on a machine specifically designed for this exercise. The lat pulldown is typically performed with a wide grip, but can also be done with a narrow grip or underhand grip to target…"], ["Patadas traseras", "triceps_brachii", "", "w", "8-12", 0, "Mariano_O", "CC-BY-SA 4", "The dumbbell kickback is a popular strength training exercise that targets the triceps muscles in the back of your upper arms. It helps strengthen and tone the triceps, contributing to overall arm strength and aesthetics. Among the exercises that work the arm muscles, kickback and its variations are very effective. You can easily apply these exercises with dumbbells, cables or resistance bands."], ["Tuck L-sit", "rectus_abdominis", "brachialis pectoralis_major quads trapezius triceps_brachii", "t", "30-60", 0, "clafal", "CC-BY-SA 4", "The tuck L-sit is a bodyweight hold where you support yourself on parallel bars, parallettes, or the floor with straight arms while pulling your knees toward your chest. Your hips stay lifted, your spine stays tall, and your feet hover off the ground. The goal is to keep your core tight, shoulders depressed, and arms locked out while maintaining the tucked position. It’s a core-intensive,…"], ["Bulgarian Squat with Dumbbells", "gluteus_maximus quads", "hamstrings adductors", "w", "8-12", 0, "AlucardEvil40", "CC-BY-SA 4", "The Bulgarian split squat consists of performing a squat on one leg with the rear foot resting on a raised platform. Elevating your back leg on a bench creates instability and increases the range of motion of the exercise."], ["Elevación lateral polea", "deltoid_anterior", "", "r", "10-15", 0, "polloperro", "CC-BY-SA 4", "Lateral elevation unilateral using a polea"], ["Reverse Fly Standing", "deltoid_posterior trapezius", "rhomboids", "w", "8-12", 0, "Croak6728", "CC-BY-SA 4", "Stand with a good posture holding a cable in each hand opposite the machine Starting with the hands in front of your chest pull the arms out to your side into the shape of a T with the elbows nearly straight Slowly release the arms forward to the start Repeat with the arms moving into the shape of a Y Repeat with the arms in the shape of a W Repeat with the arms in the shape of an L by your side"], ["Shoulder Dumbbell Pendular Exercise", "deltoid_anterior latissimus_dorsi pectoralis_major trapezius", "", "w", "8-12", 0, "Croak6728", "CC-BY-SA 4", "Lean forward to rest your hand on a chair or other object, holding a dumbbell in the other hand Gently swing the dumbbell in a circular motion"], ["Shoulder External Rotation with Dumbbell", "deltoid_anterior brachialis", "trapezius", "w", "8-12", 0, "Croak6728", "CC-BY-SA 4", "Lie on your side holding a dumbbell in your upper hand Tuck your elbow into your side and rest the hand in front of you Rotate the shoulder so the hand raises up Lower the hand down"], ["Incline Shoulder Press Up", "deltoid_anterior pectoralis_major", "", "r", "10-15", 0, "Croak6728", "CC-BY-SA 4", "Place your hands on the bench in a press up position Push your chest away from the bench to separate your shoulder blades Keeping your elbows straight , lower your chest towards the bench so your shoulder blades move closer together Push your chest away from the bench again"], ["Neck extension", "biceps_brachii", "", "w", "8-12", 0, "polloperro", "CC-BY-SA 4", "Unilateral triceps exercise with your back to the pulley, with the pulley at the top"], ["Remo alto polea alta", "obliques serratus_anterior triceps_brachii", "", "w", "8-12", 0, "polloperro", "CC-BY-SA 4", "High pulley row with support using a single grip"], ["Jalon caballero unialteral", "brachialis obliques", "", "w", "8-12", 0, "polloperro", "CC-BY-SA 4", "Pull performed in knight's stance"], ["Glute Kickback (Machine)", "gluteus_maximus", "", "w", "8-12", 0, "barry", "CC-BY-SA 4", "Drive through your heel, not your toes, to hit the glute. Don’t hyperextend your lower back at the top."], ["Standing Adduction (Cable)", "adductors", "", "w", "8-12", 0, "barry", "CC-BY-SA 4", "Keep your hips square and still, pulling the cable across your opposing leg using only your inner thigh. Don’t let your torso lean or twist — no side bending to help the rep."], ["Seated Row (Machine)", "latissimus_dorsi", "deltoid_anterior trapezius rhomboids teres_major", "w", "8-12", 0, "barry", "CC-BY-SA 4", "Keep your chest up and squeeze your shoulder blades at the end. Don’t hunch forward or round your back during the pull."], ["Straight-Arm Pulldown (Cable)", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "barry", "CC-BY-SA 4", "Keep arms straight but not locked, pulling with your lats, not your shoulders. Don’t let your shoulders shrug up during the movement."], ["Side Straight-Arm Pulldown (Cable)", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "barry", "CC-BY-SA 4", "Keep your torso still, pulling the handle down along your side using the outer lat. Don’t twist your body or rotate your torso to cheat the rep."], ["Shoulder Internal Rotation (Cable)", "deltoid_anterior", "", "w", "8-12", 0, "barry", "CC-BY-SA 4", "Keep your elbow tucked to your side like it's superglued there. Don’t rotate your torso — only your forearm should move."], ["Shoulder External Rotation (Cable)", "deltoid_anterior", "", "w", "8-12", 0, "barry", "CC-BY-SA 4", "Keep elbow fixed at your side and rotate forearm outward smoothly. Don’t let your wrist or elbow drift upward — stay in one plane."], ["Side Lateral Raise (Cable)", "deltoid_lateral", "deltoid_anterior", "w", "8-12", 0, "barry", "CC-BY-SA 4", "Lift with your elbows leading, not your hands. Don’t shrug your shoulders; keep traps quiet."], ["Front Raise (Cable)", "deltoid_anterior", "", "w", "8-12", 0, "barry", "CC-BY-SA 4", "Raise the handle in a slight arc with controlled movement. Don’t swing your torso to start the rep."], ["Face pulls with yellow/green band", "deltoid_posterior latissimus_dorsi", "trapezius rhomboids", "w", "8-12", 0, "54str", "CC-BY-SA 4", "Face pulls with band – standing horizontal pull. Grab the band at face height, pull elbows high and wide towards your face while squeezing shoulder blades together. Trains upper back, rear shoulders and improves posture."], ["Isometric Squat to Failure", "gluteus_maximus quads", "adductors", "t", "30-60", 0, "Tierrasverdes", "CC-BY-SA 4", "sometric Squat to Failure: A Strength Training Technique Definition The isometric squat to failure is a variation of the squat exercise where you hold a static squat position at a specific angle, maintaining the position until your muscles can no longer sustain the contraction."], ["Single-Leg Lunge with Kettlebell", "gastrocnemius gluteus_maximus quads", "adductors", "w", "8-12", 1, "Tierrasverdes", "CC-BY-SA 4", "How to do a single-leg kettlebell lunge Preparation: Stand with your feet together. Hold the kettlebell with both hands by the handle, keeping it close to your chest, or hold it with one hand (on the same side as the working leg). Step and Lower: Take a large step forward (or backward, which is safer for your knees) with one leg, lowering your hips until both knees form a 90-degree angle. Focus:…"], ["Single-leg side glute press", "gastrocnemius gluteus_maximus quads", "", "r", "10-15", 1, "Tierrasverdes", "CC-BY-SA 4", "The Single-Leg Side Glute Press is a leg press machine variation where you angle your body sideways on the pad, placing one foot high and slightly angled to press the weight, powerfully targeting the outer glute (gluteus medius/minimus) and hamstrings for balanced leg development and stability, requiring focus on pushing through the heel and maintaining control without locking out. How to…"], ["Single-Leg Deadlift with Dumbbell", "hamstrings gluteus_maximus", "erector_spinae", "w", "8-12", 1, "Tierrasverdes", "CC-BY-SA 4", "Starting Position: Stand upright with a slight bend in your knees, holding a dumbbell in one or both hands. Shift your weight onto your supporting leg (e.g., your right leg) and lift your non-supporting foot slightly off the floor. The Hinge: Keeping your back flat and core engaged, hinge at your hips, pushing your glutes backward. As your torso lowers, extend your non-supporting leg straight…"], ["Assisted chin-ups", "biceps_brachii latissimus_dorsi", "brachialis trapezius rhomboids teres_major", "r", "10-15", 0, "", "CC-BY-SA 4", "Chin-ups with machine assistance (counterweights)"], ["Neutral-grip pull-ups or TRX rows", "latissimus_dorsi forearm_flexors", "biceps_brachii rhomboids teres_major", "r", "10-15", 0, "54str", "CC-BY-SA 4", "Pull-Up: Vertical Pull — Focuses more on the Lats (back width). TRX Row: Horizontal Pull — Focuses more on the Rhomboids/Traps (mid-back thickness and posture)."], ["Shrimp Squad", "gluteus_maximus quads", "hamstrings gastrocnemius", "r", "10-15", 0, "Happy", "CC-BY-SA 4", "Single leg squad where one leg is behind you."], ["Single Leg Glute Bridge", "gluteus_maximus", "gluteus_medius", "r", "10-15", 1, "Happy", "CC-BY-SA 4", "A glute bridge, where you use just one leg at a time."], ["L-Sit Pull-ups", "latissimus_dorsi", "biceps_brachii brachialis rectus_abdominis rhomboids teres_major", "t", "30-60", 0, "Happy", "CC-BY-SA 4", "L-Sit Pull-ups train both upper body and core muscles."], ["Windshield Wipers", "obliques rectus_abdominis", "", "r", "10-15", 0, "Happy", "CC-BY-SA 4", "Hang from a pull-up bar, raise your legs to the ceiling. Move lower body from left to right with straight legs like a windshield wiper"], ["Machine Side Lateral Raises", "deltoid_lateral", "deltoid_anterior", "w", "8-12", 0, "Tierrasverdes", "CC-BY-SA 4", "Machine side lateral raises are an isolation exercise for the side (lateral) deltoids, performed on a machine for stability, targeting the outer shoulder by lifting pads or handles out to the sides to shoulder height, then lowering slowly, keeping elbows slightly bent and traps down to focus on the delts. This exercise helps build shoulder width by preventing swinging and providing constant…"], ["Cable Front Raise with a small bar", "deltoid_anterior", "", "w", "8-12", 0, "Tierrasverdes", "CC-BY-SA 4", "The Cable Front Raise with a small bar isolates your anterior deltoids (front shoulders) by providing constant tension, requiring you to stand facing away from a low pulley, grab the bar with an overhand grip, and lift it in front of you to shoulder height with slightly bent arms, avoiding swinging and keeping your core tight for controlled movement up and down. Use a light-to-moderate weight,…"], ["Smith machine squat", "gluteus_maximus quads", "adductors", "w", "8-12", 0, "Tierrasverdes", "CC-BY-SA 4", "Technique and Execution The Smith machine squat is a variation of the traditional barbell squat that uses a guided, fixed-path barbell. Here's a detailed breakdown of the proper technique: Starting Position Foot Placement: Position feet slightly forward of the bar, about shoulder-width apart Bar Position: Rest the bar on your upper trapezius/shoulders, similar to a traditional back squat Stance:…"], ["Machine Hip Abduction", "gluteus_medius gluteus_minimus", "tfl gluteus_maximus", "w", "8-12", 0, "Tierrasverdes", "CC-BY-SA 4", "Technique and Execution Starting Position Seated Positioning: Sit in the machine with back against the pad Leg Placement: Inner thighs against the machine's padded resistance points Adjust Machine: Set seat position to align your hip joint with the machine's pivot point Movement Technique Start with legs together or slightly pressed against the inner pads Slowly push legs outward, spreading them…"], ["Cable pull through", "gluteus_maximus", "hamstrings gastrocnemius quads soleus", "w", "8-12", 0, "manuher89", "CC-BY-SA 4", "The Cable Pull Through is a lower-body exercise that targets the glutes and hamstrings using a \"hip hinge\" motion. To perform it, attach a rope to the lowest pulley setting, face away from the machine with the rope between your legs, and step forward to create tension. Keeping your back flat and knees slightly soft, push your hips backward as if trying to close a door behind you until you feel a…"], ["Side lateral raise - Front (Cable)", "deltoid_lateral", "deltoid_anterior", "w", "8-12", 0, "", "CC-BY-SA 4", "in a cablerack do a side lateral raise with cable in front of you, with focus in tension on the back of your shoulder."], ["Side lateral raise - Back (Cable)", "deltoid_lateral", "deltoid_anterior", "w", "8-12", 0, "", "CC-BY-SA 4", "on a cable rack do a side lateral raise with the cable behind you. focus on tension in the front of the shoulder."], ["45° lateral raises", "deltoid_lateral", "deltoid_anterior", "w", "8-12", 0, "", "CC-BY-SA 4", "dumbbell raise in the space between front and side raises"], ["Plank Reach", "rectus_abdominis", "deltoid_anterior obliques", "t", "30-60", 0, "", "CC-BY-SA 4", "Position your body in plank position, keeping your eyes on the ground. Raise one arm in front of you and return it. Repeat with the other arm. Raise and return slowly while keeping your body as still as possible."], ["Wrist curl, cable", "forearm_flexors", "biceps_brachii", "w", "8-12", 0, "eufvksruh", "CC-BY-SA 4", "Extend your arm down, then slightly lift your forearm Extend your wrist in a supinated form (palm up) Adjust cable height so that the cable handle is in your supinated hand Perform the movement by curling your palms and wrists upwards (optional/variable) Pause at the top Slowly return to the starting position"], ["Reverse crunch", "rectus_abdominis", "", "r", "10-15", 0, "eufvksruh", "CC-BY-SA 4", "Lay down Place your hands near your butt (often slightly in front or under or both) Raise your legs, but about 70% of the way you should be able to also raise your pelvis (optional/variable) Hold 1/2 seconds at the top Go back to starting position"], ["Legend Incline Bench Press", "pectoralis_major", "deltoid_anterior triceps_brachii", "w", "8-12", 0, "", "CC-BY-SA 4", "incline bench press on LeverEdge machine."], ["Chair dips", "triceps_brachii", "deltoid_anterior pectoralis_major", "r", "10-15", 0, "tinman", "CC-BY-SA 4", "Starting position: Sit down on the front edge of a chair, back straight, hands holding the front edge. Still holding the edge of the chair, arms extended, lift your butt and walk forward slightly so that it is a few inches from the chair. Steps: Slowly lower your body, keeping the back straight, until your arms are at a right angle. Raise your body again to the initial position, arms extended. Repeat."], ["Pec deck rear delt fly", "deltoid_posterior", "rhomboids trapezius", "w", "8-12", 0, "eufvksruh", "CC-BY-SA 4", "Seated rear delt fly on pec deck machine (facing the machine and extending arms backwards, the hands should be at the height of the shoulders)"], ["Suitcase Carry", "obliques", "rectus_abdominis trapezius", "w", "8-12", 0, "aboksz", "CC-BY-SA 4", "Walk forward and backward with holding dumbbell on one side without leaning to counter the weight."], ["Deficit Push ups", "pectoralis_major", "triceps_brachii", "r", "10-15", 0, "Rottekongen", "CC-BY-SA 4", "Pushup on blocks or grips, so you can dip lower than the hands in the decent."], ["Supino inclinado", "pectoralis_major", "deltoid_anterior triceps_brachii", "w", "8-12", 0, "", "CC-BY-SA 4", "Inclinado 90 graus e movimentos leves e precisos"], ["Landmine Rotation", "obliques", "deltoid_anterior rectus_abdominis", "w", "8-12", 0, "aboksz", "CC-BY-SA 4", "Start with landmine barbell straight up by using your shoulders to push it up above you. Then, from that position, bring it your side to target your abdominals and return to starting position."], ["unilateral cross body cable pull down", "latissimus_dorsi", "deltoid_anterior rhomboids teres_major", "w", "8-12", 1, "", "CC-BY-SA 4", "on a cable rack place cable high, and with a straight arm pull that cable across you from high to low. focus on tension in back shoulder."], ["Barbell Full Squat", "hamstrings gluteus_maximus quads", "gastrocnemius rectus_abdominis adductors", "w", "8-12", 0, "fabrice", "CC-BY-SA 4", "The barbell full squat is a compound exercise that targets multiple muscle groups in the lower body, including the quadriceps, hamstrings, and glutes. Proper form is crucial for maximizing results and preventing injuries during the barbell full squat. This includes maintaining a shoulder-width stance, creating whole body tension, controlling your descent, and maintaining proper depth and knee…"], ["Trap Bar Squat", "quads", "hamstrings adductors", "w", "8-12", 0, "kmcalderwood", "CC-BY-SA 4", "A combination of squat and deadlift principles with the use of a hex/trap bar, easing stress on the lower back by better centering the weight."], ["ankle dorsiflexion rocks", "gastrocnemius soleus", "", "r", "10-15", 0, "Davidgj32", "CC-BY-SA 4", "Move your knee forward, keeping your heel on the ground. Hold the position for a couple of seconds and return to the starting position."], ["Behind the Back Cable Lateral Raise", "deltoid_lateral", "trapezius deltoid_anterior", "w", "8-12", 0, "LEBRERO", "CC-BY-SA 4", "Lateral raises have long been a staple for building capped delts, and lifters use everything from dumbbells and bands to machines and single-arm variations to make them grow."], ["Parallel Bar Hold", "deltoid_anterior pectoralis_major triceps_brachii", "latissimus_dorsi obliques rectus_abdominis", "t", "30-60", 0, "Croak6728", "CC-BY-SA 4", "Stand between a set of parallel bars. Place your hands, knuckles outwards, on the bars. Push down on your hands to lift yourself off the floor. Hold yourself in this position with your arms straight for the required time."], ["Reverse Hyperextension", "hamstrings gluteus_maximus erector_spinae", "", "r", "10-15", 0, "Croak6728", "CC-BY-SA 4", "Lie face-down on a bench with your legs hanging off the edge. Bend your hips so your thighs are vertical, bending your knees at the same time so your shins stay horizontal. Straighten out your legs so they are not bent and your toes are pointing backwards horizontally. Return to the original position, and repeat."], ["Sphinx", "rectus_abdominis", "", "r", "10-15", 0, "Joculari", "CC-BY-SA 4", "Lie on your stomach flat, legs extended and the backs of your feet on the ground. Bring your forearms under your shoulders, elbows directly underneath. Then press your hands into the floor to lift your chest. Draw your shoulder blades together, open your collarbones, and direct your gaze forward, while keeping the lower back relaxed."], ["Clamshell", "gluteus_medius gluteus_minimus rectus_abdominis", "tfl gluteus_maximus", "r", "10-15", 0, "teus_ergaster", "CC-BY-SA 4", "Position Side plank with the elbow and the forearm on the ground and the legs slightly bent. Execution Lift your upper knee while keeping your feet close together, like a “shell opening,” then slowly return to the starting position. Keep your core stable and your hips aligned."], ["Dumbell Tate Press", "triceps_brachii", "deltoid_anterior pectoralis_major", "w", "8-12", 0, "beagle", "CC-BY-SA 4", "Set Up : Lie flat with a dumbbell in each hand. Extend your arms straight up over your chest as if you were at the top of a dumbbell bench press Starting Position : Position the dumbbells so they are touching or very close together with a pronated grip (palms facing your feet and thumbs facing each other) Lowering : Without moving your upper arms or shoulders, bend your elbows and flare them…"], ["Chest-Supported Rear Delt Raise", "deltoid_posterior", "trapezius rhomboids", "w", "8-12", 0, "beagle", "CC-BY-SA 4", "\"The Y\"Position: Set an incline bench to 30-45 degrees. Lie face-down with your chest supported, keeping your head neutral or looking slightly down to avoid neck strain.Grip: Hold light dumbbells with a neutral or thumbs-up grip (thumb pointing to the ceiling).Movement: With straight or slightly bent elbows, raise the dumbbells up and out in a \"Y\" shape. Focus on moving the shoulders and shoulder…"], ["Band pull-apart with external rotation", "deltoid_anterior", "", "w", "8-12", 0, "beagle", "CC-BY-SA 4", "Stand tall with your feet shoulder-width apart, chest out, and shoulders back. Hold the resistance band with both hands, palms facing up or facing each other, depending on the band type. Bend your elbows at a 90-degree angle and glue your upper arms to your sides. The band should have some tension in the starting position, with your hands closer together in front of your stomach. Rotate Outward:…"], ["Double-Leg Abdominal Press", "rectus_abdominis", "", "r", "10-15", 0, "beagle", "CC-BY-SA 4", "Lie on your back with knees and hips bent at 90 degrees (tabletop). Place your hands on your thighs just above your knees. Push your hands against your knees as hard as possible while using your abs to pull your knees toward your hands. Hold for 10 seconds of maximum effort. Your abs should be shaking."], ["Abdominal Draw-In", "rectus_abdominis", "", "r", "10-15", 0, "beagle", "CC-BY-SA 4", "Lie on your back with knees bent. Gently pull your belly button toward your spine without moving your hips or holding your breath."], ["Landmine Squat to Press", "deltoid_anterior gluteus_maximus quads", "hamstrings rectus_abdominis adductors", "w", "8-12", 0, "beagle", "CC-BY-SA 4", "Bar Position: Anchor one end of a barbell in a landmine attachment or a secure corner. Stance: Stand facing the barbell with feet slightly wider than shoulder-width. Turn your toes out 10–35 degrees to allow for better pelvic movement and depth. Grip: Cup the free end of the barbell with both hands (fingers interlaced or overlapping) and hold it at mid-chest level, just below the collarbone.…"], ["Barbell Step Back Lunge", "quads", "adductors", "w", "8-12", 0, "", "CC-BY-SA 4", "Step 1: Stand with your feet hip-width apart, holding a barbell on your upper back. Step 2: Keep your back straight, chest up, and core engaged. Step 3: Take a step back with one leg and lower your body by bending both knees. Ensure that your back knee nearly touches the ground. Step 4: Push off your back foot to return to the starting position. Step 5: Repeat the movement with the other leg.…"], ["Hammerstrength Decline Chest Press", "pectoralis_major", "deltoid_anterior triceps_brachii", "w", "8-12", 0, "", "CC-BY-SA 4", "Sit upright in a hammerstrength decline chest press machine while squeezing your shoulder blades together and placing your heels firmly on the ground underneath your knees. The back pad should be contact with your head, shoulders, and butt at all times. Grab ahold of the handles with an overhand grip just outside shoulder-width apart just below your chest. Keeping your core braced by breathing…"], ["Floor Glider Hamstring Curls", "hamstrings", "gastrocnemius gluteus_maximus", "w", "8-12", 0, "", "CC-BY-SA 4", "Lie on back with heels on floor gliders or towels. Lift hips into a bridge, then slide heels toward glutes while keeping hips elevated. Slowly return to the starting position while maintaining the hip bridge."], ["Trap-3 Raise", "trapezius", "", "r", "10-15", 0, "Croak6728", "CC-BY-SA 4", "Hinge forwards and bend your knees slightly. Depress and retract the shoulder you will use. Rest the other hand on your knee. Raise your hand about 15 degrees overhead, maintaining the position of your shoulder."], ["Banded Shoulder Drills", "deltoid_anterior pectoralis_major trapezius", "", "w", "8-12", 0, "Croak6728", "CC-BY-SA 4", "Attach a resistance band to something solid behind you. Stand away from it, holding it in your hand so it is taut. See the attached youtube video: https://www.youtube.com/watch?v=zdwEWchSjrI ."], ["Banded Clamshell", "gluteus_medius gluteus_minimus rectus_abdominis", "quads tfl gluteus_maximus", "w", "8-12", 0, "Croak6728", "CC-BY-SA 4", "Position Side plank with the elbow and the forearm on the ground and the legs slightly bent. Stretch a doubled-up resistance band between your thighs, just above the knee. Execution Lift your upper knee while keeping your feet close together, like a “shell opening,” then slowly return to the starting position. Keep your core stable and your hips aligned."], ["Seated Pancake Good Morning", "gluteus_maximus erector_spinae", "", "r", "10-15", 0, "Croak6728", "CC-BY-SA 4", "Sit with your legs completely straight (knees locked), spread wide in a straddle position. Place your hands on the back of your neck. Hinge your torso and head towards the floor."], ["Horse Stance (Side Splits)", "gluteus_maximus", "", "r", "10-15", 0, "Croak6728", "CC-BY-SA 4", "Stand as for a squat, with your feet wide and your toes pointed slightly outwards. Gently squat into a deep, wide squat - your hips should be below your knees. Hold for 3 to 5 seconds. Come up under control, and repeat as needed."], ["Straddle L-Sit", "rectus_abdominis", "latissimus_dorsi pectoralis_major quads serratus_anterior", "t", "30-60", 0, "Croak6728", "CC-BY-SA 4", "With your legs in a sitting saddle position, push your body upwards off the ground. Your legs should be horizontal and point straight outwards. Your arms should be between your legs. Hold isometrically as long as required."], ["L-sit", "latissimus_dorsi pectoralis_major rectus_abdominis", "quads triceps_brachii", "t", "30-60", 0, "Croak6728", "CC-BY-SA 4", "Sit on the ground with your legs together and your arms by your sides. Push your body off the ground using your hands, maintaining the same sitting position so that your legs are straight and your feet do not touch the floor. Hold for as long as required."], ["L-Sit (Foot Supported)", "latissimus_dorsi pectoralis_major rectus_abdominis serratus_anterior", "quads triceps_brachii", "t", "30-60", 0, "Croak6728", "CC-BY-SA 4", "As with an L-sit, but allow your feet to touch the floor to support the some of the weight of your legs."], ["Banded Scapular Retraction", "deltoid_anterior trapezius", "", "w", "8-12", 0, "hurr99", "CC-BY-SA 4", "Attach one end of resistance band to wall/upright/... at shoulder height. Insert arm into the loop, at the tricep. Step back until band is pulled straight. Pull back elbow and shoulder against the resistance of the band."], ["Incline DB Y-Raise", "deltoid_anterior", "trapezius", "w", "8-12", 0, "Deflation", "CC-BY-SA 4", "Set an incline bench to a 45-degree angle and sit facing the bench, chest against the pad, with a dumbbell in each hand, palms facing each other. Position your feet firmly on the ground for stability and let your arms hang down naturally with a slight bend in your elbows. Engage your core and keep your back straight throughout the movement. Raise your arms forward and out to form a Y shape,…"], ["High-Cable Lateral Raise", "deltoid_lateral", "latissimus_dorsi serratus_anterior deltoid_anterior", "w", "8-12", 0, "Deflation", "CC-BY-SA 4", "Stand next to a cable machine with the pulley set to waist height. Grab the opposite-side handle with the hand farthest from the pulley, keeping your palm facing in. Keep your core engaged, chest lifted, and shoulders relaxed. Maintain a slight bend in the elbow throughout the lift. Lift your arm out to the side until your elbow reaches shoulder height, keeping your wrist aligned with your elbow.…"], ["YTWL Exercise", "deltoid_anterior trapezius", "", "w", "8-12", 0, "teus_ergaster", "CC-BY-SA 4", "Purpose: Improves shoulder stability, posture, and scapular (shoulder blade) control. Often used in physical therapy and warm-ups. Starting Position: Stand with feet shoulder-width apart. Hinge forward at the hips (like a deadlift) keeping your back flat, or lie face down on an incline bench. Keep your thumbs pointing up throughout. Y (Arms up): Extend both arms straight forward and upward at a…"], ["Supine Hip Abduction", "gluteus_medius gluteus_minimus quads", "tfl gluteus_maximus", "w", "8-12", 0, "teus_ergaster", "CC-BY-SA 4", "Starting Position: Lie on your back (supine) on a mat, with your legs extended and relaxed. Arms can be placed alongside your body or out to the sides for stability. The Movement: Slightly lift one leg off the floor (keeping it straight or with a slight bend). Move it laterally outward, away from the other leg, as if stepping over a small obstacle. Range of Motion: Move the leg as far as…"], ["Decline Bench Leg Raise", "rectus_abdominis", "", "r", "10-15", 0, "nishant0712", "CC-BY-SA 4", "Setup : Lie on a decline bench with your head at the top and grip the handles. The Start : Extend legs fully, keeping them slightly elevated to engage your core. The Lift : Raise your legs toward the ceiling using your abs, not momentum. The Squeeze : Pause and contract your lower abdominals at the top. The Return : Lower your legs slowly to the starting position with control."], ["Overhead Barbell Press", "deltoid_anterior", "", "w", "8-12", 0, "nishant0712", "CC-BY-SA 4", "Setup: Stand with feet together and grip the bar slightly wider than shoulders. Position: Rest the bar on your upper chest. Press: Brace your core and push the bar straight up until your arms lock out. Finish: Control the bar back down to your chest. https://youtu.be/ZXpdJOLNoWw?si=u27cGyODoblXHBu1"], ["Tricep Rope Pushdowns", "triceps_brachii", "latissimus_dorsi", "w", "8-12", 0, "nishant0712", "CC-BY-SA 4", "Setup: Stand facing the cable, feet shoulder-width apart, with a slight forward lean. Grip: Hold the rope with palms facing each other and elbows tucked tight to your ribs. Execution: Push the rope down until arms are fully straight, pulling the ends apart at the bottom. Control: Keep upper arms still and return to the start with a slow, controlled motion."], ["Clean and Press", "deltoid_anterior", "quads", "w", "8-12", 0, "nishant0712", "CC-BY-SA 4", "The First Pull: Lift the bar from the floor to knee-height by driving with the legs, keeping the angle of your back constant. The \"Power\" Position: As the bar reaches mid-thigh, explosively shrug and extend your hips to create vertical momentum. The Quick Elbow Turnover: In the catch phase, rotate your elbows rapidly under the bar to create a \"shelf\" on your front deltoids. The Vertical Press:…"], ["Weighted push-ups", "pectoralis_major", "triceps_brachii", "r", "10-15", 0, "nishant0712", "CC-BY-SA 4", "Setup: Begin in a standard plank position with a weight plate balanced securely on your upper back. Alignment: Maintain a straight line from your head to your heels, engaging your core to prevent your back from sagging. Execution: Lower your body until your chest nearly touches the floor, keeping your elbows at a forty-five degrees . Ascent: Press through your palms to return to the starting…"], ["Pec Deck", "pectoralis_major", "", "w", "8-12", 0, "", "CC-BY-SA 4", "Pectoral issolation exercise - full range of motion is best with full contraction and slow negative"], ["Pullback", "biceps_brachii latissimus_dorsi", "brachialis", "w", "8-12", 0, "cybro", "CC-BY-SA 4", "Set weight and grip for the cables in the cage. Take a few steps away, bend over, pull and extend the back at the same time."], ["Hip Bridge", "gluteus_maximus rectus_abdominis", "obliques gluteus_medius", "r", "10-15", 0, "cybro", "CC-BY-SA 4", "Get into bridge position, balance yourself on heels and start extending legs unilaterally. Keep hip extended as much as possible."], ["Unilateral Lunges", "gluteus_maximus quads", "hamstrings adductors", "r", "10-15", 1, "cybro", "CC-BY-SA 4", "No stops during movement, hands on the hips."], ["Butterfly Superman", "trapezius erector_spinae", "", "r", "10-15", 0, "cybro", "CC-BY-SA 4", "Lie on stomach, intertwine fingers behind the head and start raising your head and raise elbows as far as they go."], ["Leg Wheel", "rectus_abdominis", "", "r", "10-15", 0, "cybro", "CC-BY-SA 4", "Lay on the back and lift legs in perpendicular fashion, keeping the knees together. Start making small circles in one direction with both of your knees with very small range of motion, focusing on abs and keeping your back in contact with the floor."], ["Kneeling Superman", "hamstrings trapezius erector_spinae", "rectus_abdominis", "r", "10-15", 0, "cybro", "CC-BY-SA 4", "Push one foot back until leg fully extended, concentrating on the having the foot high and pushed back as if pulled. Extend arm forward with focus having the shoulder high up. Unilateral and static hold."], ["Cat Plank", "quads rectus_abdominis", "deltoid_anterior", "t", "30-60", 0, "cybro", "CC-BY-SA 4", "On your fours and raise the knees of the floor ever so slightly. Curl your back out and push back from your shoulders as to resemble a cat making itself look large."], ["Core Rotation", "quads rectus_abdominis", "obliques serratus_anterior", "r", "10-15", 0, "cybro", "CC-BY-SA 4", "Sit back, raise feet above the ground with knees bent and start rotating left and right with hands touching the ground every move."], ["Unilateral Hip Thrust", "gluteus_maximus", "rectus_abdominis gluteus_medius", "r", "10-15", 1, "cybro", "CC-BY-SA 4", "Extend one leg while laying down and start raising your body with one leg touching the ground through the heel."], ["Isometria alle parallele", "pectoralis_major trapezius", "", "w", "8-12", 0, "", "CC-BY-SA 4", "The parallel bars isometric hold is a static upper-body exercise performed on dip bars (parallel bars). Instead of moving up and down like in a traditional dip, you hold a fixed position under tension."], ["Quadruped Hip Abduction", "gluteus_medius gluteus_minimus", "tfl gluteus_maximus", "w", "8-12", 0, "treder", "CC-BY-SA 4", "Distribute your body weight evenly on all knees and arms. Keep the torso stable, with the abdomen engaged and the lumbar spine straight without twisting the back (imagine: a glass on your lower back won't fall off). Raise one leg outwards without twisting it. Pay attention to the right angle at the hips and knees. Always train both sides of the body. To increase resistance, a resistance band can be used."], ["Tuck planche", "deltoid_anterior rectus_abdominis serratus_anterior", "obliques pectoralis_major triceps_brachii", "r", "10-15", 0, "ISSACS", "CC-BY-SA 4", "Basic calisthenics progression for the full planche"], ["Legend Chest Press", "pectoralis_major", "deltoid_anterior triceps_brachii", "w", "8-12", 0, "", "CC-BY-SA 4", "Plate-loaded chest press machine from Legend Fitness LeverEdge line."], ["Seated Cable chest fly", "pectoralis_major", "", "w", "8-12", 0, "shushu", "CC-BY-SA 4", "Place a bench between two cable pulleys and adjust the pulleys so they are at chest/shoulder height when you are seated. Grab the handles with a neutral grip and lean against the upright backrest. Bring your arms together in front of your chest in a controlled motion, focusing on squeezing your chest muscles. Keep your elbows slightly bent throughout the movement. Pause briefly at the top…"], ["3008 Abdominal Crunch", "rectus_abdominis", "", "r", "10-15", 0, "", "CC-BY-SA 4", "This is especially for the gym80 device 3008 Abdominal Crunch."], ["Barbell Silverback Shrug", "trapezius", "", "w", "8-12", 0, "", "CC-BY-SA 4", "Stand with your feet shoulder width apart holding the barbell with both hands in front just past shoulder width. Bend forward at the hips with a slight bend in your knees, keeping your back straight. Engage your shoulder blades, as if you are trying to touch them together. Release the shrug. Description taken from MuscleWiki"], ["Inverted Lat Pull Down", "latissimus_dorsi trapezius", "biceps_brachii brachialis obliques rectus_abdominis serratus_anterior rhomboids teres_major", "r", "10-15", 0, "amaesc", "CC-BY-SA 4", "The Inverted Lat Pull Down (most commonly known as the Reverse Grip Lat Pull Down ) is a variation of the standard exercise that uses an underhand (supinated) grip with hands at shoulder-width. This position shifts more emphasis to the lower lats and increases biceps involvement, often allowing for a greater range of motion and a deeper squeeze at the bottom of the movement."], ["Seated V-Grip Row", "latissimus_dorsi trapezius forearm_flexors", "deltoid_anterior biceps_brachii rectus_abdominis serratus_anterior rhomboids teres_major", "w", "8-12", 0, "amaesc", "CC-BY-SA 4", "The Seated V-Grip Row is a compound pulling exercise performed on a cable machine using a close-grip \"V\" handle. While seated with your feet braced, you pull the handle toward your midsection, focusing on back thickness and mid-back development."], ["Assisted Pull-Up", "latissimus_dorsi trapezius", "deltoid_anterior biceps_brachii rectus_abdominis serratus_anterior rhomboids teres_major", "w", "8-12", 0, "amaesc", "CC-BY-SA 4", "The Assisted Pull-Up is a compound vertical pulling exercise performed on a machine with a counterweight platform or by using resistance bands. It mimics the mechanics of a standard pull-up but reduces the total weight you have to lift, making it an excellent tool for building functional strength and perfecting your technique."], ["Dumbbell Curl", "biceps_brachii brachialis", "deltoid_anterior rectus_abdominis", "w", "8-12", 0, "amaesc", "CC-BY-SA 4", "The Dumbbell Curl is a classic isolation exercise for the arms. Unlike the Hammer Curl, it involves rotating your wrists (supination) as you lift the weights, which allows for a full contraction of the biceps."], ["Abdominal Crunch", "rectus_abdominis", "obliques serratus_anterior", "r", "10-15", 0, "amaesc", "CC-BY-SA 4", "The Abdominal Crunch is a classic core isolation exercise performed on the floor or a mat. Unlike a full sit-up, it involves a smaller range of motion where you only lift your shoulders and upper back off the ground, keeping your lower back pressed firmly against the floor."], ["Belt Squat", "gluteus_maximus quads", "hamstrings adductors", "w", "8-12", 0, "", "CC-BY-SA 4", "Belt Squat: a squat variation done with a belt attached to a loading machine or platform so the weight is supported at the hips instead of on the spine. It mainly trains the quads and glutes, with much less lower-back fatigue than a barbell squat. Use a full range of motion, keep the torso upright, and drive through the mid-foot."], ["dumbbell snatch", "hamstrings gluteus_maximus quads", "", "w", "8-12", 0, "Aleid", "CC-BY-SA 4", "Key Steps to Execute Correctly: Setup: Place the dumbbell between your feet, with your shoulders above your hips, chest up, and back flat. The Pull: Explosively extend your hips, knees, and ankles (triple extension) to drive the dumbbell upward, keeping your elbow high and the dumbbell close to your body. The Catch: Quickly flex your hips and knees to drop under the dumbbell and receive it…"], ["1 Leg Box Squat", "hamstrings quads", "adductors", "r", "10-15", 0, "jesusd", "CC-BY-SA 4", "This exercise requires a sturdy box or a chair. Simple stand ~6 inches in front of it and balance yourself on one leg. From here, begin squatting down in a smooth controlled motion while keeping your other leg straight out in front of you for balance. Slowly sit down on the box, pause for a 1 count and push back up with the working leg, while never letting your other leg touch the ground."], ["Fire Hydrant Circles", "gluteus_medius gluteus_minimus", "tfl gluteus_maximus", "w", "8-12", 0, "Pete-E automation", "CC-BY-SA 4", "Fire Hydrant Circles Part of: Limber 11 Source: Joe DeFranco Prescription: 10 forward / 10 backward Type: dynamic"], ["Step Jack", "quads", "deltoid_anterior gluteus_maximus obliques rectus_abdominis", "c", "20-30", 0, "Anon#2", "CC-BY-SA 4", "The Step Jack is a low-impact plyometric-style move that provides cardiovascular benefits without the joint stress of jumping. It works the entire body, specifically targeting the legs, core, and shoulders. This move is ideal for beginners, individuals with joint sensitivities, or as a dynamic warm-up to gradually elevate the heart rate. Notes (Instructions): ​Stand upright with your feet…"], ["Slow Squat", "quads", "hamstrings gluteus_maximus rectus_abdominis adductors", "r", "10-15", 0, "Anon#2", "CC-BY-SA 4", "​A tempo-based squat that uses controlled movement to increase muscle tension and improve lower-body stability. ​Lower: Descend slowly for 3 seconds. ​Pause: Hold at the bottom for 1 second. ​Stand: Return to the starting position at a normal pace. Form: Keep your chest up and weight in your heels."], ["Wide Push-Up", "pectoralis_major", "rectus_abdominis triceps_brachii", "r", "10-15", 0, "Anon#2", "CC-BY-SA 4", "​A push-up variation with a wider hand placement to increase the emphasis on the outer chest muscles and shoulders. ​Setup: Place hands wider than shoulder-width apart on the floor. Lower: Descend until your chest nearly touches the floor, keeping your core tight. ​Push: Drive through your palms to return to the start position. ​Form: Don't let your lower back sag; keep a straight line from head to heels."], ["Marching High Knees", "quads", "gastrocnemius gluteus_maximus rectus_abdominis", "r", "10-15", 0, "Anon#2", "CC-BY-SA 4", "A low-impact cardio and mobility exercise that strengthens the hip flexors and improves balance. ​Movement: Stand tall and lift one knee toward your chest as high as comfortable. ​Arms: Swing the opposite arm forward as you lift your knee, similar to a walking motion. ​Core: Keep your abs engaged to maintain an upright posture. ​Pace: Perform the movement with control, alternating legs rhythmically."], ["lento avanti seduto", "deltoid_anterior", "", "w", "8-12", 0, "Cf", "CC-BY-SA 4", "slow controlled seated forward exercise with dumbbells"], ["Single-arm dumbbell shoulder press", "deltoid_anterior", "rectus_abdominis serratus_anterior trapezius triceps_brachii", "w", "8-12", 1, "evtimovgeorg", "CC-BY-SA 4", "Press the dumbbell vertically overhead in a controlled motion until your arm is fully extended, without locking the elbow. Slowly lower the dumbbell back to the starting position at shoulder height."], ["Single-arm cable pushdown", "triceps_brachii", "rectus_abdominis", "w", "8-12", 1, "evtimovgeorg", "CC-BY-SA 4", "Single-arm cable pushdown is a unilateral isolation exercise that targets the triceps brachii. By working one arm at a time, it helps correct strength imbalances between sides while also engaging the core for stability. Starting position: Stand facing the cable machine with your feet shoulder-width apart. Attach a single handle to the high pulley. Grab the handle with one hand using an overhand…"], ["Kettlebell sumo high pull", "trapezius", "deltoid_anterior hamstrings gluteus_maximus quads", "w", "8-12", 0, "wgerpott", "CC-BY-SA 4", "A compound exercise combining elements of a sumo deadlift and a high pull. It targets the posterior chain, particularly the glutes, hamstrings, and upper back. The sumo stance increases hip engagement, while the high pull adds an explosive element, promoting power development. Stand upright overtop of a kettlebell with your feet wider than shoulder-width apart angled out slightly. Maintain a…"], ["Mentzer Pulldown", "biceps_brachii", "latissimus_dorsi rhomboids teres_major", "w", "8-12", 0, "Mike Mentzer", "CC-BY-SA 4", "Close grip front facing Pull down, while focusing on Biceps, Increases activation of biceps over the whole range, Avoid activating Lats."], ["Single-Arm Lat Pulldown", "latissimus_dorsi trapezius", "biceps_brachii brachialis rhomboids teres_major", "w", "8-12", 1, "evtimovgeorg", "CC-BY-SA 4", "Sit at the lat pulldown machine and grab the single handle with a neutral grip. Keep your torso stable, your chest lifted, and your shoulder blades slightly retracted. Start with your arm fully extended overhead, then pull the handle down toward your upper chest following a controlled, slightly diagonal path. Focus on engaging the latissimus dorsi while keeping the shoulder depressed and avoiding…"], ["Hip Airplane", "gluteus_maximus", "hamstrings gastrocnemius soleus", "w", "8-12", 0, "TobiasFalk", "CC-BY-SA 4", "Stand on one leg and lean your upper body slightly forward while keeping your back straight. Extend the free leg behind you so that your torso and leg form roughly one line. Slowly open your hip to the side by rotating your pelvis and upper body in a controlled way. Then close the hip again and return to the starting position. The movement should mainly come from the hip. Keep your standing foot…"], ["Reverse Clamshell", "gluteus_medius gluteus_minimus", "tfl gluteus_maximus", "r", "10-15", 0, "TobiasFalk", "CC-BY-SA 4", "Lie on your side with your hips and knees bent, keeping your knees stacked on top of each other. Keep your feet together at first, then keep your knees touching while lifting your top foot upward. Slowly lower the foot back down with control. Move only through the hip and avoid rolling your pelvis backward. The movement should be small, controlled, and focused on hip rotation."], ["Clamshell to Reverse Clamshell", "gluteus_medius gluteus_minimus", "tfl gluteus_maximus", "r", "10-15", 0, "TobiasFalk", "CC-BY-SA 4", "Lie on your side with your hips and knees bent, keeping your legs stacked. Lift your top knee into a clamshell position and keep the leg elevated throughout the movement. From there, alternate between opening the knee upward and lifting the foot upward, moving through hip external and internal rotation. Keep the movement slow and controlled. Do not let the top leg rest on the bottom leg between repetitions."], ["YTW Raises", "deltoid_anterior", "", "r", "10-15", 0, "probablyforging", "CC-BY-SA 4", "The YTW exercise for scapular retraction is designed to strengthen the inter-scapular muscles between your shoulder blades, to help retract or pull your shoulders back, helping to maintain proper upright posture."], ["Glute-Ham Raise", "hamstrings", "gluteus_maximus", "r", "10-15", 0, "personal use", "CC0", "Kneel on a glute-ham developer or have a partner hold your ankles. Keeping hips straight, lower your torso toward the floor under control, then curl back up by contracting the hamstrings and glutes."], ["Easy Continuous Swim (Freestyle)", "deltoid_anterior latissimus_dorsi pectoralis_major", "hamstrings gastrocnemius gluteus_maximus quads rectus_abdominis triceps_brachii", "c", "20-30", 0, "Imported from swim plan", "CC-BY-SA 4", "Swim freestyle at a relaxed, steady pace without stopping — think conversation pace, not racing. Focus on smooth, even strokes rather than speed or breathing technique; this is just to get your body moving and your heart rate up."], ["Kick with Board", "gluteus_maximus quads", "hamstrings gastrocnemius rectus_abdominis", "c", "20-30", 0, "Imported from swim plan", "CC-BY-SA 4", "Hold a kickboard with both hands, arms extended in front of you, face in the water (lift head forward to breathe when needed). Kick from your hips, not your knees, keeping your legs mostly straight with a slight bend and a steady, compact flutter kick. This builds leg endurance and keeps your body horizontal without needing to worry about your arms."], ["Bobbing Exhale Drill", "rectus_abdominis", "", "c", "20-30", 0, "Imported from swim plan", "CC-BY-SA 4", "Stand in chest-deep water. Take a breath, submerge your face fully, and exhale slowly and completely through your nose and/or mouth the whole time you're underwater — a gentle humming sound can help keep the exhale steady and controlled. Once you're empty of air, lift your head, take a fresh breath, and go back under. Repeat continuously. The goal is training your body that all your exhaling…"], ["Wall-Hold Rotation", "obliques", "rectus_abdominis", "c", "20-30", 0, "Imported from swim plan", "CC-BY-SA 4", "Hold the pool wall or edge with one hand, body horizontal at the surface, legs kicking gently behind you. Keep your face in the water, exhaling continuously, then rotate your head to the side — not lifting it up — so one goggle stays in the water while the other clears the surface. Take a quick breath, then rotate your face back down to neutral. This isolates the head-rotation motion without any…"], ["Stroke-and-Roll Drill", "deltoid_anterior obliques", "latissimus_dorsi rectus_abdominis", "c", "20-30", 0, "Imported from swim plan", "CC-BY-SA 4", "Push off, swim a few strokes, and every breath roll fully onto your back for 2-3 breaths, then roll back into freestyle. This teaches you to rotate your body as a unit rather than just turning your head, and helps remove the fear of not having your face in the water."], ["Recovery Bobbing", "rectus_abdominis", "", "c", "20-30", 0, "Imported from swim plan", "CC-BY-SA 4", "Same motion as the Bobbing Exhale Drill, but done in slightly deeper water (so you're not touching the bottom) and at a slower, more relaxed pace — think of it as a recovery/reset exercise rather than a hard drill. Use it between harder drills to reset your breathing rhythm and calm down if you're feeling rushed or out of sync."], ["Cool-Down Swim", "deltoid_anterior latissimus_dorsi pectoralis_major", "gluteus_maximus rectus_abdominis triceps_brachii", "c", "20-30", 0, "Imported from swim plan", "CC-BY-SA 4", "Swim at an easy, unhurried pace — freestyle, backstroke, or just floating/gliding — with zero focus on technique or drills. The only goal here is to let your heart rate come down gradually and your muscles relax before you get out of the pool."], ["Posterior Pelvic Tilt", "rectus_abdominis", "gluteus_maximus obliques", "r", "10-15", 0, "Raj", "CC-BY-SA 4", "Lie on your back with knees bent, feet flat on the floor. Flatten your lower back against the floor by tilting your pelvis posteriorly, engaging your abs and glutes. Hold 5 seconds, release. This retrains pelvic positioning to counter anterior pelvic tilt."], ["Band Terminal Knee extension", "quads", "", "w", "8-12", 0, "Rehab Hero", "CC-BY-SA 4", "This is an end range strengthening exercise for the knee extensors. Start by looping a band around the back of one knee and anchoring the other end to a stable surface in front of you. Stand in a split stance with the banded knee bent and placed as the front leg. Straighten the knee to pull against the bands resistance and maintain a contraction in your quadriceps for up to 5 seconds before releasing."], ["explosive push ups", "pectoralis_major", "deltoid_anterior triceps_brachii", "r", "10-15", 0, "ege", "CC-BY-SA 4", "Explosive Push-Ups Start in a standard push-up position, lower your chest, then explosively push off the ground so your hands leave the floor. Land softly and immediately repeat."], ["Russian Push Ups", "pectoralis_major", "deltoid_anterior rectus_abdominis triceps_brachii", "r", "10-15", 0, "ege", "CC-BY-SA 4", "Russian Push-Ups Start in a standard push-up position with your hands slightly wider than shoulder-width apart. Lower your chest toward the floor, then shift your body forward while keeping your chest close to the ground. Extend your arms to return to the starting position, then reverse the movement smoothly. Keep your core tight and maintain controlled movement throughout the exercise."], ["elbow lever", "rectus_abdominis", "deltoid_anterior triceps_brachii", "r", "10-15", 0, "ege", "CC-BY-SA 4", "​A calisthenics static balance skill where the entire body is held straight and parallel to the ground, supported by tucking the elbows firmly into the abdomen or pelvic bones."], ["Planche Lean Hold", "deltoid_anterior serratus_anterior", "biceps_brachii pectoralis_major rectus_abdominis", "t", "30-60", 0, "ege", "CC-BY-SA 4", "A straight-arm calisthenics static hold where you assume a plank position and lean the shoulders as far forward as possible past the wrists with protracted scapulae and a hollow body."], ["Leg Extension Isometric", "quads", "", "t", "30-60", 0, "HexoctusEngineering", "CC-BY-SA 4", "An isometric leg extension is a strengthening exercise where you contract your quadriceps muscles against an immovable resistance without changing the length of the muscle or moving your knee joint."], ["Bench Press Isometric", "deltoid_anterior pectoralis_major triceps_brachii", "obliques rectus_abdominis serratus_anterior", "t", "30-60", 0, "HexoctusEngineering", "CC-BY-SA 4", "A bench press isometric hold is a static strength exercise where you pause and hold a barbell or dumbbells either at your chest, mid-press, or at lockout without moving for a set time"], ["Overhead Press Isometric", "deltoid_anterior triceps_brachii", "", "t", "30-60", 0, "HexoctusEngineering", "CC-BY-SA 4", "An isometric overhead press involves holding a weight statically overhead or pushing against an immovable object at a specific point in the press without moving the joint."], ["Lateral Raise Isometric", "deltoid_lateral", "deltoid_anterior", "t", "30-60", 0, "HexoctusEngineering", "CC-BY-SA 4", "An isometric lateral raise is a shoulder exercise where you hold your arms out to the sides at waist height for a set amount of time instead of moving up and down"], ["Preacher Curl Isometric", "biceps_brachii", "", "t", "30-60", 0, "HexoctusEngineering", "CC-BY-SA 4", "An isometric preacher curl is a static strength exercise where you hold a fixed position on a preacher pad or and inclined bench under tension without moving the joint."], ["Lat Pulldown Isometric", "latissimus_dorsi", "rhomboids teres_major", "t", "30-60", 0, "HexoctusEngineering", "CC-BY-SA 4", "An isometric Lat pulldown is a strength-building exercise where you pull the bar down to your chest and hold the contracted position at the bottom without moving your limbs for a set number of seconds"], ["Triceps Pushdown Isometric", "triceps_brachii", "", "t", "30-60", 0, "HexoctusEngineering", "CC-BY-SA 4", "A single-arm isometric or isolated triceps pushdown is an isolation cable exercise where you pin your upper arm against your torso, hinge at the hips, and extend the elbow to achieve a peak contraction in the triceps muscle."], ["Boxing", "deltoid_anterior triceps_brachii", "biceps_brachii latissimus_dorsi", "c", "20-30", 0, "SAH", "CC-BY-SA 4", "Bag workout for boxing skill development and cardio improvement"], ["Retro Treadmill Walking", "", "", "c", "20-30", 0, "Personal routine", "CC-BY-SA 3", "Controlled treadmill walking performed backward. Begi function livePlan(){const a=A();let psets=0,dsets=0,pvol=0,dvol=0;const tp={},td={},P=new Set(),Sx=new Set();

  e.sets.forEach((s,k)=>{if(s.t==="W"||md==="c")return;psets++;const w=+(s.w||phFor(e,k,"w"))||0,r=+(s.r||phFor(e,k,"r"))||0;const mult=perSide(e.name)?2:1;
   if(md==="w")pvol+=w*r*mult;gP.forEach(g=>tp[g]=(tp[g]||0)+1);gS.forEach(g=>tp[g]=(tp[g]||0)+.5);

async function exportData(){status="Preparing backup…";paintStatus();
 for(let i=0;i<12;i++){const d=new Date(today()+"T12:00");d.setMonth(d.getMonth()-i);await ensureMonth(monthKey(d.toLocaleDateString("sv-SE")))}
 const data=JSON.stringify({app:"serena-body-kitchen",version:1,exported:today(),core:S.core,body:S.body,logs:S.logs,photos:photoCache});
 const blob=new Blob([data],{type:"application/json"});const name=`body-kitchen-backup-${today()}.json`;
 try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});status="Backup shared";paintStatus();return}}catch(e){if(e&&e.name==="AbortError"){status="Backup cancelled";paintStatus();return}}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);status="Backup downloaded";paintStatus()}
function importData(inp){const file=inp.files[0];if(!file)return;const rd=new FileReader();
 rd.onload=async ()=>{try{const o=JSON.parse(rd.result);if(o.app!=="serena-body-kitchen"||!o.core)throw 0;
  if(!await ask(`Replace everything with the backup from ${o.exported}?`))return;
  S.core=Object.assign(defaultCore(),o.core);S.body=o.body||{entries:[],photos:[]};S.logs=o.logs||{};
  if(o.photos)Object.entries(o.photos).forEach(([id,d])=>{photoCache[id]=d;idbPut(id,d).catch(()=>{})});
  S.body.photos=(S.body.photos||[]).filter(ph=>o.photos&&o.photos[ph.id]);seedRecipes();
  save("core");save("body");Object.keys(S.logs).forEach(k=>save(k));status="Backup restored";render()}catch(e){toast("That file isn't a backup from this app.")}};
 rd.readAsText(file)}
