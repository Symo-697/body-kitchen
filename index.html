<style>
:root{
  --bg:#F6F4F7;--card:#FFFFFF;--ink:#231B29;--muted:#6F6475;--line:#E2DAE5;
  --plum:#6B2D5C;--plum-soft:#F1E4EE;--apricot:#E0793A;--sage:#4F7A5A;--warn:#B3412F;
  --p:#6B2D5C;--c:#E0793A;--f:#4F7A5A;--mus0:#D6CCD9;--skin:#EEE8F0;--hair:#9C8FA3;--mline:rgba(70,40,70,.35);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17121A;--card:#221B26;--ink:#EFE8F1;--muted:#A89DAE;--line:#3A3040;
  --plum:#D08BBE;--plum-soft:#3A2536;--apricot:#F0A56E;--sage:#8DBB97;--warn:#F08A78;
  --p:#D08BBE;--c:#F0A56E;--f:#8DBB97;--mus0:#5A4C62;--skin:#3B3141;--hair:#6E6177;--mline:rgba(255,255,255,.2);}}
:root[data-theme="dark"]{
  --bg:#17121A;--card:#221B26;--ink:#EFE8F1;--muted:#A89DAE;--line:#3A3040;
  --plum:#D08BBE;--plum-soft:#3A2536;--apricot:#F0A56E;--sage:#8DBB97;--warn:#F08A78;
  --p:#D08BBE;--c:#F0A56E;--f:#8DBB97;--mus0:#5A4C62;--skin:#3B3141;--hair:#6E6177;--mline:rgba(255,255,255,.2);}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700;margin:1.6rem 0 .6rem}
h3{font-size:1.05rem;font-weight:700;margin:0 0 .4rem}
main{max-width:720px;margin:0 auto;padding:1rem 1rem 6.5rem}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin:.4rem 0 1rem}
.phase-pill{background:var(--plum);color:var(--bg);border-radius:999px;padding:.3rem .8rem;font-weight:600;font-size:.85rem;white-space:nowrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.8rem}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 140px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.2rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--plum);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:.55rem .9rem;background:var(--plum);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--plum);border:1px solid var(--line)}
button.small{padding:.3rem .6rem;font-size:.85rem}
button.x{background:transparent;color:var(--muted);padding:.2rem .45rem;font-size:1.1rem;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
/* hero calorie meter */
.meter{padding:1.1rem 1rem 1rem}
.left-num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:3.4rem;line-height:1;letter-spacing:-.03em}
.left-num.over{color:var(--warn)}
.bars{display:grid;gap:.55rem;margin-top:1rem}
.bar{display:grid;grid-template-columns:4.8rem 1fr 5.5rem;align-items:center;gap:.5rem;font-size:.9rem}
.track{height:10px;background:var(--plum-soft);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.num{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:.45rem .3rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.82rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.35rem .8rem;font-weight:500;font-size:.9rem}
.chip.on{background:var(--plum);color:var(--bg);border-color:var(--plum)}
.note{border-left:3px solid var(--apricot);padding:.5rem .75rem;background:var(--card);border-radius:0 10px 10px 0;margin:.5rem 0;font-size:.95rem}
.note.good{border-color:var(--sage)}
.note.warn{border-color:var(--warn)}
.glute{color:var(--apricot);font-weight:700}
.ex{border-top:1px solid var(--line);padding:.7rem 0}
.ex:first-child{border-top:0}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.4rem;margin-top:.4rem}
.set{display:flex;gap:.25rem;align-items:center}
.set input{padding:.4rem .4rem;text-align:center}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.5rem}
.photos figure{margin:0}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.photos figcaption{font-size:.8rem;color:var(--muted)}
.slot{font-size:.85rem}
.check{display:flex;gap:.5rem;align-items:center}
.check input{width:1.1rem;height:1.1rem}
.done{text-decoration:line-through;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:.35rem .25rem;padding-bottom:calc(.35rem + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{background:transparent;color:var(--muted);flex:1;padding:.35rem 0;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:.1rem}
nav.tabs button span{font-size:1.25rem;line-height:1}
nav.tabs button.on{color:var(--plum)}
.status{font-size:.78rem;color:var(--muted)}
.spark{width:100%;height:120px;display:block}
details summary{cursor:pointer;font-weight:600;color:var(--plum)}
.hscroll{display:flex;gap:.7rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.1rem .1rem .7rem;-webkit-overflow-scrolling:touch}
.mcard{all:unset;cursor:pointer;scroll-snap-align:start;flex:0 0 148px;min-height:128px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem;display:flex;flex-direction:column;gap:.35rem;box-sizing:border-box}
.mcard:focus-visible{outline:2px solid var(--plum)}
.calrow{display:grid;grid-template-columns:repeat(7,1fr) 2.2rem;align-items:center;text-align:center}
.calhead span{font-size:.8rem;color:var(--muted);padding:.2rem 0}
.calday{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.25rem 0;border-radius:10px}
.calday:disabled{cursor:default;opacity:.5}
.calday.sel{background:var(--plum-soft)}
.cnum{width:2rem;height:2rem;line-height:2rem;border-radius:50%;font-weight:600;font-variant-numeric:tabular-nums}
.calday.today .cnum{box-shadow:0 0 0 2px var(--plum)}
.ndot{width:6px;height:6px;border-radius:50%;display:inline-block}
.wkmark{font-size:.75rem;color:var(--sage);font-weight:700}
.dd{display:inline-block;min-width:1.6rem;padding:.05rem .35rem;border-radius:999px;color:#fff;font-weight:700;font-size:.8rem;text-align:center}
.livehead{display:flex;align-items:center;gap:.5rem;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4;padding:.4rem 0 .6rem}
.iconbtn{background:transparent;color:var(--ink);font-size:1.25rem;padding:.3rem .55rem;border-radius:10px}
.iconbtn.light{color:#fff;font-size:.95rem;font-weight:700}
.linkbtn{all:unset;cursor:pointer;color:var(--plum);font-weight:600;display:block;margin:.55rem 0 .4rem}
input.plain{border:0;background:transparent;padding:.2rem 0}
.setgrid{display:grid;gap:.35rem;align-items:center;margin-top:.4rem;border-radius:10px;padding:.15rem .1rem}
.setgrid.head span{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.setgrid.done{background:color-mix(in srgb,var(--sage) 18%,transparent)}
.setgrid input{text-align:center;padding:.45rem .2rem}
.setlab{all:unset;cursor:pointer;font-weight:800;color:var(--plum);text-align:center;font-size:1.05rem}
.chk{width:2.5rem;height:2.3rem;border-radius:10px;background:var(--line);color:var(--muted);padding:0;font-size:1.1rem}
.chk.on{background:var(--sage);color:#fff}
#restpill{position:fixed;left:.8rem;right:.8rem;bottom:calc(4.4rem + env(safe-area-inset-bottom,0px));z-index:6;max-width:600px;margin:0 auto}
.restbox{position:relative;overflow:hidden;background:var(--plum);color:#fff;border-radius:16px;padding:.55rem .7rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.restbar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18)}
.livebar{display:block;width:100%;margin:.2rem 0 .6rem;background:var(--plum-soft);color:var(--plum);font-weight:600;text-align:left}
.sheetbtn{display:flex;align-items:center;gap:.9rem;width:100%;background:transparent;color:var(--ink);font-size:1.05rem;font-weight:600;padding:.55rem .2rem;border-radius:12px;text-align:left}
.sheetbtn.sel{background:var(--plum-soft)}
.sheeticon{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--plum-soft);display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;flex:none}
.seg{display:flex;background:var(--plum-soft);border-radius:12px;padding:.25rem;gap:.25rem;margin-bottom:.8rem}
.seg button{flex:1;background:transparent;color:var(--ink)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.restgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.roundbtn{width:4.4rem;height:4.4rem;border-radius:50%;background:var(--line);color:var(--ink);font-weight:700;padding:0}
.roundbtn.go{background:var(--sage);color:#fff;width:5rem;height:5rem}
.statscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:.8rem;margin-top:.8rem;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.statscroll::-webkit-scrollbar{display:none}
.statcard{flex:0 0 100%;scroll-snap-align:center;border:1px solid var(--line);border-radius:16px;padding:1rem .7rem;box-sizing:border-box}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.sdot.on{background:var(--ink)}
.exname{all:unset;cursor:pointer;font-weight:700;text-decoration:underline dotted;text-underline-offset:3px}
.exname.glute{color:var(--apricot)}
.modal{position:fixed;inset:0;background:rgba(20,10,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:1.1rem 1rem calc(1.2rem + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
</style>

<script>
/* ---------- in-app dialogs (browser pop-ups are blocked inside claude.ai) ---------- */
function dlg(html){return new Promise(res=>{const ov=document.createElement("div");ov.className="modal";ov.style.zIndex=40;ov.style.alignItems="center";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
 ov.innerHTML=`<div class="sheet" style="border-radius:18px;max-width:420px;margin:1rem">${html}</div>`;document.body.appendChild(ov);
 const done=v=>{ov.remove();res(v)};ov.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const inp=ov.querySelector("input");done(b.dataset.v==="ok"?(inp?inp.value:true):(inp?null:false))});
 const inp=ov.querySelector("input");if(inp){inp.focus();inp.select&&inp.select();inp.onkeydown=e=>{if(e.key==="Enter")done(inp.value)}}else{const ok=ov.querySelector('[data-v="ok"]');ok&&ok.focus()}})}
function ask(msg){const danger=/delete|discard|remove|replace/i.test(msg);return dlg(`<p style="margin:0 0 1rem;white-space:pre-wrap">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="ghost" data-v="no">Cancel</button><button data-v="ok" style="${danger?"background:var(--warn)":""}">OK</button></div>`)}
function askText(msg,def){return dlg(`<p style="margin:0 0 .6rem">${esc(msg)}</p><input value="${esc(def??"")}"><div class="row" style="justify-content:flex-end;margin-top:.8rem"><button class="ghost" data-v="no">Cancel</button><button data-v="ok">OK</button></div>`)}
function toast(msg){dlg(`<p style="margin:0 0 1rem;white-space:pre-wrap">${esc(String(msg))}</p><div class="row" style="justify-content:flex-end"><button data-v="ok">OK</button></div>`)}

 return`<div style="margin-top:.5rem;border:1px solid var(--line);border-radius:10px;overflow:hidden">${offList.map((x,i)=>`<button onclick="offPick(${i})" style="all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:.5rem .7rem;border-bottom:1px solid var(--line)"><b>${esc(x.name)}</b>${x.brand?` <span class="muted">· ${esc(x.brand)}</span>`:""}${x.qty?` <span class="muted">· ${esc(x.qty)}</span>`:""}<br><span class="muted">per 100 g: ${r0(x.kcal)} kcal · P ${x.p} · C ${x.c} · F ${x.f}${x.fib!=null?` · fibre ${x.fib}`:""}</span></button>`).join("")}</div>`}
const offFail=e=>offPaint(`<p class="muted" style="margin:.5rem 0 0">Couldn't reach Open Food Facts. ${location.hostname.endsWith("claude.ai")||location.hostname.includes("claudeusercontent")?"This preview can't connect to outside sites; product search works in your GitHub app.":"Check your connection and try again."}</p>`);
async function offSearch(){const q=($("#offq")||{}).value;if(!q||!q.trim())return;offPaint(`<p class="muted" style="margin:.5rem 0 0">Searching…</p>`);
 try{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q.trim())}&search_simple=1&action=process&json=1&page_size=20&sort_by=unique_scans_n&tagtype_0=countries&tag_contains_0=contains&tag_0=france&fields=${OFF_FIELDS}`);
  const j=await r.json();offList=(j.products||[]).map(offParse).filter(Boolean).slice(0,12);offPaint(offListHTML())}catch(e){offFail(e)}}
async function offCode(code){code=String(code||($("#offc")||{}).value||"").replace(/\D/g,"");if(code.length<6){toast("Type the number under the barcode.");return}
 offPaint(`<p class="muted" style="margin:.5rem 0 0">Looking up ${code}…</p>`);
 try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}?fields=${OFF_FIELDS}`);const j=await r.json();const x=j&&j.product?offParse({...j.product,code}):null;
  offList=x?[x]:[];offPaint(x?offListHTML():`<p class="muted" style="margin:.5rem 0 0">Barcode ${code} isn't in Open Food Facts yet. You can add the product by hand in Kitchen › My ingredients.</p>`)}catch(e){offFail(e)}}
function offPick(i){const x=offList[i];if(!x)return;const id="off_"+x.code;
 const name=`${x.name}${x.brand?" – "+x.brand:""}`.replace(/[()]/g,"");
 if(!food(id))S.core.customFoods.push({id,name,kcal:x.kcal,p:x.p,c:x.c,f:x.f,fib:x.fib,price:0,aisle:x.aisle,pw:x.pw&&x.pw<1000?x.pw:0,src:"off"});
 save("core");offOpen=true;offResHTML=`<p class="muted" style="margin:.5rem 0 0">Added <b>${esc(name)}</b> to your ingredients. Enter the grams above and tap Add.${x.pw?` One serving is ${x.pw} g.`:""}</p>`;
 render();const lf=$("#lf"),lg=$("#lg");if(lf){lf.value=food(id).name}if(lg){lg.value=x.pw&&x.pw<1000?x.pw:"";lg.focus&&lg.focus()}}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const sc=document.createElement("script");sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
async function offScan(){offPaint(`<div style="margin-top:.5rem"><video id="offvideo" playsinline muted style="width:100%;max-height:260px;border-radius:10px;background:#000"></video><div class="row" style="margin-top:.4rem"><span class="muted grow">Point the camera at the barcode…</span><button class="small ghost" onclick="offStop()">Stop</button></div></div>`);
 try{await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
  const reader=new ZXing.BrowserMultiFormatReader();offStream=reader;
  await reader.decodeFromVideoDevice(undefined,"offvideo",(res)=>{if(res){const code=res.getText();offStop();const c=$("#offc");if(c)c.value=code;offCode(code)}})}
 catch(e){offStop();offPaint(`<p class="muted" style="margin:.5rem 0 0">The camera scanner isn't available here. Type the number printed under the barcode instead.</p>`)}}
function offStop(){try{offStream&&offStream.reset()}catch(e){}offStream=null;if(offResHTML.includes("offvideo"))offPaint("")}
function specKey(sp){return[sp.type,sp.ref,sp.qty,sp.sides?1:0].join("|")}
let curMeal=null;const MEALS=[["b","Breakfast"],["l","Lunch"],["d","Dinner"],["s","Snack"]];
function defaultMeal(){const d=new Date(),m=d.getHours()*60+d.getMinutes();return m<630?"b":m<870?"l":m<1050?"s":"d"}
const mealNow=()=>curMeal||defaultMeal();
function addEntry(sp,meal){let e;
 if(sp.type==="food"){const f=food(sp.ref);if(!f)return false;e={label:`${f.name.split(" (")[0]} · ${sp.qty} g`,...macrosFood(f,sp.qty)}}
 else{const r=S.core.recipes.find(x=>x.id===sp.ref);if(!r)return false;const m=portionWith(r,sp.sides&&hasSides(r));e={label:`${r.name} · ${sp.qty} portion${sp.qty>1?"s":""}${sp.sides&&hasSides(r)?" + sides":""}`};for(const k in m)e[k]=m[k]*sp.qty}
 e.veg=vegOf(sp);e.spec=sp;e.meal=meal||mealNow();dayLog(logDate).food.push(e);
 const k=specKey(sp);S.core.recent=[sp].concat((S.core.recent||[]).filter(x=>specKey(x)!==k)).slice(0,8);return true}
function commitLog(){save(monthKey(logDate));save("core");render()}
function quickAdd(list,i){if(addEntry(S.core[list][i]))commitLog()}
function toggleFav(i){const sp=dayLog(logDate).food[i].spec;if(!sp)return;const k=specKey(sp);S.core.favs=S.core.favs||[];
 if(S.core.favs.some(x=>specKey(x)===k))S.core.favs=S.core.favs.filter(x=>specKey(x)!==k);else S.core.favs.push(sp);save("core");render()}
function specLabel(sp){if(sp.type==="food"){const f=food(sp.ref);return f?`${f.name.split(" (")[0]} ${sp.qty} g`:null}const r=S.core.recipes.find(x=>x.id===sp.ref);return r?`${r.name.replace(/^(Breakfast|Snack) · /,"")}${sp.qty!==1?" ×"+sp.qty:""}${sp.sides&&hasSides(r)?" + sides":""}`:null}
async function logFood(){const f=foodByName($("#lf").value),g=+$("#lg").value;if(!f){toast("Pick an ingredient from the list, or add it in Kitchen › My ingredients.");return}if(!g)return;if(restrictedFoods()[f.id]&&!await ask(`${f.name.split(" (")[0]} is on your avoid list. Log it anyway?`))return;addEntry({type:"food",ref:f.id,qty:g});commitLog()}
function logRecipe(){const id=$("#lr").value,n=+$("#lp").value||1;const sd=$("#ls");addEntry({type:"recipe",ref:id,qty:n,sides:sd?sd.checked:false});commitLog()}
function plannedToday(){const idx=(new Date(logDate+"T12:00").getDay()+6)%7;if(S.core.plan.week!==mondayOf(logDate))return[];return SLOTS.map(s=>S.core.plan.slots[idx+"-"+s[0]]).filter(Boolean)}
function logPlanned(){const idx=(new Date(logDate+"T12:00").getDay()+6)%7;SLOTS.forEach(([k])=>{const id=S.core.plan.slots[idx+"-"+k];if(id)addEntry({type:"recipe",ref:id,qty:1,sides:true},k)});commitLog()}
function prevDay(d){const x=new Date(d+"T12:00");x.setDate(x.getDate()-1);return x.toLocaleDateString("sv-SE")}
function cloneEntry(x,meal){if(x.spec){const ok=addEntry(x.spec,meal||x.meal);if(ok)return}const c=JSON.parse(JSON.stringify(x));c.meal=meal||x.meal||mealNow();dayLog(logDate).food.push(c)}
async function copyYesterday(meal){const y=prevDay(logDate);await ensureMonth(monthKey(y));const Y=((S.logs[monthKey(y)]||{days:{}}).days||{})[y];if(!Y||!Y.food.length)return;
 Y.food.filter(x=>!meal||x.meal===meal).forEach(x=>cloneEntry(x));commitLog()}
async function saveMeal(meal){const items=dayLog(logDate).food.filter(x=>(x.meal||"o")===meal&&x.spec).map(x=>x.spec);if(!items.length){toast("Only foods and recipes logged in this version can be saved as a meal.");return}
 const lab=(MEALS.find(m=>m[0]===meal)||[0,"Meal"])[1];const name=await askText("Name this meal",`${lab} ${new Date(logDate+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}`);if(!name)return;
 S.core.meals=(S.core.meals||[]).concat([{id:uidGen(),name:name.trim(),items}]);save("core");render()}
function addSavedMeal(i){const m=(S.core.meals||[])[i];if(!m)return;m.items.forEach(sp=>addEntry(sp));commitLog()}
async function delSavedMeal(i){const m=S.core.meals[i];if(!await ask(`Delete the saved meal “${m.name}”?`))return;S.core.meals.splice(i,1);save("core");render()}
function rmLog(i){dayLog(logDate).food.splice(i,1);save(monthKey(logDate));render()}
function addWater(v){const L=dayLog(logDate);L.water=Math.max(0,(L.water||0)+v);save(monthKey(logDate));render()}
function setDay(k,v){dayLog(logDate)[k]=v;save(monthKey(logDate))}

function buildWeek(){const a=(S.core.setup||{}).answers||{meals:3,snacks:true,batch:true};const fit=BANK.filter(r=>bankFits(r,a)).map(r=>({r,...bankScore(r,a)})).sort((x,y)=>y.sc-x.sc);
 const pickFrom=(pred,n,avoid=[])=>{const out=[];for(const x of fit){if(out.length>=n)break;if(pred(x.r)&&!avoid.includes(x.r.id)&&!out.includes(x.r.id))out.push(x.r.id)}return out};
 const mains=r=>r.meal.includes("l")||r.meal.includes("d");
 let g1=pickFrom(r=>mains(r)&&r.keeps>=3&&r.portions>=3,2);let g2=pickFrom(r=>mains(r)&&r.keeps>=4&&r.portions>=3,2,g1);
 if(g2.length<2)g2=g2.concat(pickFrom(r=>mains(r)&&r.portions>=3,2-g2.length,g1.concat(g2)));
 if(!a.batch){const all=pickFrom(mains,6);g1=all.slice(0,3);g2=all.slice(3)}
 const bf=pickFrom(r=>r.meal.includes("b"),2),sn=pickFrom(r=>r.meal.includes("s"),2,bf);
 const slotsWanted={2:["l","d"],3:["b","l","d"],4:["b","l","d","s"]}[+a.meals||3].slice();if(a.snacks&&!slotsWanted.includes("s"))slotsWanted.push("s");
 const slots={};for(let d=0;d<7;d++){const grp=d<3?g1:g2;const pool=grp.length?grp:g1.concat(g2);
  if(slotsWanted.includes("b")&&bf.length)slots[d+"-b"]=bf[d%bf.length];
  if(slotsWanted.includes("l")&&pool.length)slots[d+"-l"]=pool[d%pool.length];

  if(slotsWanted.includes("s")&&sn.length)slots[d+"-s"]=sn[d%sn.length]}

 for(const id in counts){const r=BANK.find(x=>x.id===id)||S.core.recipes.find(x=>x.id===id);if(r)cost+=recipeCost(r,true)*counts[id]}

  let nf=0,nr=0,skip=0;(o.foods||[]).forEach(f=>{if(f&&f.id&&!food(f.id)){S.core.customFoods.push(f);nf++}});
  o.recipes.forEach(r=>{if(!r||!r.id||!Array.isArray(r.items))return;if(S.core.recipes.some(x=>x.id===r.id)){skip++;return}
   const miss=r.items.concat(r.sides||[]).filter(it=>!food(it.food));if(miss.length){skip++;return}

  save("core");kView="mine";render();toast(`Imported ${nr} recipe${nr===1?"":"s"}${o.name?" from "+o.name:""} and ${nf} new ingredient${nf===1?"":"s"}.${skip?` ${skip} skipped (already there or missing ingredients).`:""}`)}
 catch(e){toast("That file isn't a recipe file from this app.")}};rd.readAsText(file)}

 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return true}

nch Dumbbell Pullovers", "latissimus_dorsi pectoralis_major serratus_anterior", "", "w", "8-12", 0, "powerade69", "CC-BY-SA 3", "Grasp a moderately weighted dumbbell so your palms are flat against the underside of the top plates and your thumbs are around the bar. Lie on your back across a flat bench so only your upper back and shoulders are in contact with the bench. Your feet should be set about shoulder-width apart and your head should hang slightly downward. With the dumbbell supported at arm's length directly about…"], ["Ball crunches", "rectus_abdominis", "obliques", "r", "10-15", 0, "Konsumopfer", "CC-BY-SA 4", ""], ["Crunches", "rectus_abdominis", "serratus_anterior", "r", "10-15", 0, "wger.de", "CC-BY-SA 3", "Lay down on your back a soft surface, the feet are on the floor. Ask a partner or use some other help (barbell, etc.) to keep them fixed, your hands are behind your head. From this position move your upper body up till your head or elbows touch your knees. Do this movement by rolling up your back."], ["Incline Crunches", "rectus_abdominis", "", "r", "10-15", 0, "wger.de", "CC-BY-SA 3", "Lay down on your back on a inclined bench, feet are on one end of the bench. Ask a partner or use some other help (barbell, etc.) to keep them fixed, your hands are behind your head. From this position move your upper body up till your head or elbows touch your knees. Do this movement by rolling up your back."], ["Crunches on Machine", "rectus_abdominis", "", "r", "10-15", 0, "wger.de", "CC-BY-SA 3", "The procedure is very similar as for regular crunches, only with the additional weight of the machine. Sit on the machine, put both feet firmly on the ground. Grab the to the weights, cables, etc. and do a rolling motion forwards (the spine should ideally lose touch vertebra by vertebra). Slowly return to the starting position."], ["Crunches With Cable", "rectus_abdominis", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Take the cable on your hands and hold it next to your temples. Knee down and hold your upper body straight and bend forward. Go down with a fast movement, rolling your back in (your ellbows point to your knees). Once down, go slowly back to the initial position."], ["Crunches With Legs Up", "rectus_abdominis", "obliques", "r", "10-15", 0, "krisbbb", "CC-BY-SA 4", "On your back, legs extended straight up, reach toward your toes with your hands and lift your shoulder blades off the ground and back."], ["Cycling", "obliques trapezius", "hamstrings brachialis gluteus_maximus latissimus_dorsi quads", "c", "20-30", 0, "BFad07", "CC0", "Cycling, also called bicycling or biking, is the use of bicycles for transport, recreation, exercise or sport. People engaged in cycling are referred to as cyclists, bicyclists, or bikers. Apart from two-wheeled bicycles, cycling also includes the riding of unicycles, tricycles, quadracycles, recumbent and similar human-powered vehicles."], ["Deadbug", "rectus_abdominis", "obliques", "w", "8-12", 0, "Metin", "CC-BY-SA 4", "Lie on your back, with your hips and knees bent to 90°. Raise both arms toward the ceiling. Pull your lower back to the floor to eliminate the gap. Start by pressing one leg out, and tapping the heel to the floor. \"As you extend one leg, exhale as much as you can, keeping your lower back glued to the floor,\" Dunham says. When you can’t exhale any more, pull your knee back to the starting…"], ["Deadlifts", "latissimus_dorsi", "gluteus_maximus erector_spinae", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Stand firmly, with your feet slightly more than shoulder wide apart. Stand directly behind the bar where it should barely touch your shin, your feet pointing a bit out. Bend down with a straight back, the knees also pointing somewhat out. Grab the bar with a shoulder wide grip, one overhand, one underhand (mixed grip). Pull the weight up. At the highest point make a slight hollow back and pull…"], ["Decline Bench Press Barbell", "pectoralis_major", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Lay down on a decline bench, the bar should be directly above your eyes, the knees are somewhat angled and the feet are firmly on the floor. Concentrate, breath deeply and grab the bar more than shoulder wide. Bring it slowly down till it briefly touches your chest at the height of your nipples. Push the bar up."], ["Decline Bench Press Dumbbell", "pectoralis_major", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Take two dumbbells and sit on a decline bench, the feet are firmly on the floor, the head is resting the bench. Hold the weights next to the chest, at the height of your nipples and press them up till the arms are stretched. Let the weight slowly and controlled down."], ["Dips", "pectoralis_major triceps_brachii", "", "r", "10-15", 0, "BFad07", "CC0", "A dip is an upper-body strength exercise. Narrow, shoulder-width dips primarily train the triceps, with major synergists being the anterior deltoid, the pectoralis muscles (sternal, clavicular, and minor), and the rhomboid muscles of the back (in that order).[1] Wide arm training places additional emphasis on the pectoral muscles, similar in respect to the way a wide grip bench press would focus…"], ["Dips Between Two Benches", "triceps_brachii", "", "r", "10-15", 0, "wger.de", "CC-BY-SA 3", "Put two benches so far appart, that you can hold onto one with your hands and are just able to reach the other with your feet. The legs stay during the exercise completely stretched. With your elbows facing back, bend them as much as you can. Push yourself up, but don't stretch out the arms."], ["Dumbbell Concentration Curl", "brachialis", "biceps_brachii", "w", "8-12", 0, "http://www.exrx.net/WeightExercises/Brac", "CC-BY-SA 3", "Sit on bench. Grasp dumbbell between feet. Place back of upper arm to inner thigh. Lean into leg to raise elbow slightly."], ["Dumbbell Goblet Squat", "quads", "adductors", "w", "8-12", 0, "ataraxie67", "CC-BY-SA 4", "Grasp dumbbell with both hands at the sides of the upper plates. Hold dumbbell in front of chest, close to torso. Place feet about shoulderwide apart, keep knees slightly bent. Squat down until thighs are parallel to floor. Keep back straight, bend and move hips backward to keep knees above feet. Return, keep knees slightly flexed. Repeat. Keep bodyweight on heels and look ahead or slightly above…"], ["Dumbbell Incline Curl", "biceps_brachii", "brachialis", "w", "8-12", 0, "ExRx", "CC-BY-SA 4", "Setup: Set an adjustable bench to an incline of approximately 45 to 60 degrees . Starting Position: Sit back against the bench with a dumbbell in each hand. Let your arms hang straight down toward the floor with your palms facing forward (supinated grip). The Curl: Keeping your upper arms stationary and shoulders pinned back against the bench, exhale and curl the weights upward toward your…"], ["Dumbbell Lunges Standing", "quads", "gluteus_maximus adductors", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "."], ["Dumbbell Lunges Walking", "quads", "gluteus_maximus adductors", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Starting Position: Stand with feet hip-width apart and hands either on your hips or holding dumbbells at your sides. The Stride: Take a wide step forward with your right leg. The Descent: Lower your hips until both knees are bent at approximately 90-degree angles . The Transition: Drive through your front heel to stand up, bringing your back foot forward to step directly into the next lunge."], ["Dumbbells on Scott Machine", "biceps_brachii", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Dumbbell Triceps Extension", "triceps_brachii", "deltoid_anterior pectoralis_major", "w", "8-12", 0, "tuninx", "CC-BY-SA 3", "Position one dumbbell over head with both hands under inner plate (heart shaped grip). With elbows over head, lower forearm behind upper arm by flexing elbows. Flex wrists at bottom to avoid hitting dumbbell on back of neck. Raise dumbbell over head by extending elbows while hyperextending wrists. Return and repeat."], ["Facepull", "trapezius", "", "w", "8-12", 0, "abeworld", "CC-BY-SA 4", "Attach a rope to a pulley station set at about chest level. Step back so you're supporting the weight with arms completely outstretched and assume a staggered (one foot forward) stance. Bend the knees slightly for a stable base. Retract the scapulae (squeeze your partner's finger with your shoulder blades) and pull the center of the rope slightly up towards the face. A good cue is to think about…"], ["Flutter Kicks", "obliques rectus_abdominis", "", "w", "8-12", 0, "nate303303", "CC-BY-SA 4", "-Laying on the back, lift your straightened legs from the ground at a 45 degree angle. -As your Left foot travels downward and nearly touches the floor, your Right foot should seek to reach a 90 degree angle, or as close to one as possible. -Bring your R foot down until it nearly touches the floor, and bring your L foot upwards. Maintain leg rigidity throughout the exercise. Your head should stay…"], ["Fly With Cable", "pectoralis_major", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "cable machine, two steps forward, straight back"], ["Fly With Dumbbells", "pectoralis_major", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Take two dumbbells and lay on a bench, make sure the feet are firmly on the ground and your back is not arched, but has good contact with the bench. The arms are stretched in front of you, about shoulder wide. Bend now the arms a bit and let them down with a half-circle movement to the side. Without changing the angle of the elbow bring them in a fluid movement back up."], ["Fly With Dumbbells, Decline Bench", "pectoralis_major", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "The exercise is the same as with a regular bench: Take two dumbbells and lay on a bench, make sure the feet are firmly on the ground and your back is not arched, but has good contact with the bench. The arms are stretched in front of you, about shoulder wide. Bend now the arms a bit and let them down with a half-circle movement to the side. Without changing the angle of the elbow bring them in a…"], ["Skullcrusher Dumbbells", "triceps_brachii", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Hold the dumbbells and lay down on a flat bench in such a way that around 1/4 of your head is over the edge. Stretch arms straight up and then lean dumbbells away from your toes to a 10-20 degree angle. Keep upper arm at this angle throughout exercise. Dumbbell shall not be amed at your head, but away over your head. This will maximise gain from exercise with load on triceps all the time. Pay…"], ["Skullcrusher SZ-bar", "triceps_brachii", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Hold the SZ-bar and lay down on a flat bench in such a way that around 1/4 of your head is over the edge. Stretch your arms with the bar and bend them so that the bar is lowered. Just before it touches your forehead, push it up. Pay attention to your elbows and arms: only the triceps are doing the work, the rest of the arms should not move."], ["Front Raises with Plates", "deltoid_anterior trapezius", "", "w", "8-12", 0, "Marius", "CC-BY-SA 3", "The plate front raise is a variation of the dumbbell front raise where the lifter holds a weight plate between two hands, rather than using a dumbbell, barbell, or other weight. It can provide variety in a shoulder-focused muscle-building workout, or as part of an upper body or full-body circuit. While standing straight, hold a barbell plate in both hands at the 3 and 9 o'clock positions. Your…"], ["Front Raises", "deltoid_anterior", "", "w", "8-12", 0, "Manu, wikipedia", "CC-BY-SA 3", "To execute the exercise, the lifter stands with their feet shoulder width apart and weights or resistance handles held by their side with a pronated (overhand) grip. The movement is to bring the arms up in front of the body to eye level and with only a slight bend in the elbow. This isolates the anterior deltoid muscle (front of the shoulder) and uses the anterior deltoid to lift the weight. When…"], ["Front Squats", "gluteus_maximus", "rectus_abdominis adductors", "w", "8-12", 0, "sistab2", "CC-BY-SA 3", "This variation of the squat trains the hamstrings and gluteus maximus. It also works the back extensors and abductors."], ["Front pull wide", "latissimus_dorsi", "deltoid_anterior biceps_brachii brachialis", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Front Pull narrow", "latissimus_dorsi", "biceps_brachii brachialis", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Full Sit Outs", "gluteus_maximus obliques rectus_abdominis", "", "r", "10-15", 0, "http://www.realsimple.com/health/fitness", "CC-BY-SA 4", "(A) Get in high plank position on your hands and toes.(B) Shift your weight to your left hand as you turn your body to the right; bend your right leg behind you and extend your right arm up. Return to the center and repeat on the opposite side. Continue, alternating sides. Make it easier: Don’t raise your arm after you bend your leg behind you. Make it harder: Balance with your arm and leg extended for two counts."], ["Glute Bridge", "gluteus_maximus", "hamstrings gluteus_medius", "w", "8-12", 0, "tdprice12", "CC-BY-SA 4", "Lie on you back with your hips and knees flexed, feet on the ground. From this position, raise your butt off of the ground to a height where your body makes a straight line from your knees to your shoulders. To make the exercise more intense, you can add weight by letting a barbell rest on your hips as you complete the motion, or you can put your feet on a slightly higher surface such as a step or a bench."], ["Hammer Curls", "biceps_brachii forearm_extensors", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Start: Hold dumbbells at your sides with palms facing your torso. Curl: Lift the weights toward your shoulders while maintaining the neutral grip (like holding a hammer). Squeeze: Contract the biceps at the top without moving your elbows forward. Lower: Slowly return to the starting position with full control."], ["Hammercurls on Cable", "biceps_brachii forearm_extensors", "brachialis", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Take a cable in your hands (palms parallel, point to each other), the body is straight. Bend the arms and bring the weight up with a fast movement. Without any pause bring it back down with a slow, controlled movement, but don't stretch completely your arms. Don't swing your body during the exercise, the biceps should do all the work here. The elbows are at your side and don't move."], ["Hand Grip", "forearm_flexors", "", "w", "8-12", 0, "vince63", "CC-BY-SA 4", "chrome Hand Flex Grip to build up forearms muscles"], ["Handstand Pushup", "deltoid_anterior triceps_brachii", "trapezius", "r", "10-15", 0, "BFad07", "CC0", "The handstand push-up (press-up) - also called the vertical push-up (press-up) or the inverted push-up (press-up) also called commandos- is a type of push-up exercise where the body is positioned in a handstand. For a true handstand, the exercise is performed free-standing, held in the air. To prepare the strength until one has built adequate balance, the feet are often placed against a wall,…"], ["Hanging Leg Raises", "rectus_abdominis", "", "r", "10-15", 0, "robhoyt", "CC-BY-SA 3", "Hanging from bar or straps, bring legs up with knees extended or flexed"], ["Hercules Pillars", "biceps_brachii brachialis triceps_brachii", "deltoid_anterior", "w", "8-12", 0, "GrosseHund", "CC-BY-SA 3", "Grab two cables stand in the middle so both have tension and hold"], ["High Knee Jumps", "hamstrings gastrocnemius quads soleus", "obliques rectus_abdominis serratus_anterior", "c", "20-30", 0, "nate303303", "CC-BY-SA 4", "Start with legs slightly wider than shoulder width Drop into a bodyweight squat As you hit the bottom of the squat, explode upwards into a jump while simultaneously tucking your knees into your chest midflight. Remain tucked until the apex of your jump. Land on both feet, making sure your knees are not locked so as to avoid excessive strain upon your joints. Collect yourself into the next rep as…"], ["High Pull", "deltoid_anterior", "gluteus_maximus", "w", "8-12", 0, "Mahoney", "CC-BY-SA 3", "Use a light barbell, perform explosive lift up starting from underneath knee cap level. Lift/raise explosively using hips, at shoulder level. Tempo: 2111"], ["Hindu Squats", "quads", "gluteus_maximus adductors", "w", "8-12", 0, "Vilhelmo", "CC-BY-SA 4", "Start with your feet shoulder width apart and arms slightly behind your back. As you descend towards the floor, raise your heels off the ground, while keeping your back as vertical as possible. Upon attaining the bottom position, touch the hands to the heels. Then stand up ending with the heels on the ground, arms extended in front of the chest then rowing into the start position."], ["Hip Raise, Lying", "gluteus_maximus", "hamstrings", "r", "10-15", 0, "James Mackay", "CC-BY-SA 4", "Lying down on your back, with your feet flat on the floor. Raise your hips up evenly as high as you can and hold for as long as you can."], ["Hip Thrust", "gluteus_maximus", "gluteus_medius", "w", "8-12", 0, "Bret Contreras", "CC-BY-SA 4", "The bar should go directly on your upper thigh, directly below your crotch. Your feet should be directly under your knees. Push your hips up so that you form a straight line from your knees to your shoulders. Use a pad for comfort."], ["Hollow Hold", "obliques rectus_abdominis", "", "t", "30-60", 0, "Behrooz", "CC0", "Get on a mat and lie on your back. Contract your abs, stretch your arms and legs and raise them (your head and shoulders are also be raised). Make sure your lower back remains in contact with the mat."], ["Hyperextensions", "trapezius erector_spinae", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Lie on the hyperextension pillow with your navel at the front edge, allowing your upper body to hang freely. Tighten all your back muscles and raise your torso until you're horizontal, but no higher. Lower yourself slowly, maintaining a steady flow of muscles."], ["Incline Dumbbell Fly", "pectoralis_major", "", "w", "8-12", 0, "tuckerm", "CC-BY-SA 3", "Use inclined bench. Hold dumbbells straight out to your sides, elbows slightly bent. Bring arms together above you, keeping angle of elbows fixed."], ["Incline Plank With Alternate Floor Touch", "rectus_abdominis", "obliques", "t", "30-60", 0, "Mahoney", "CC-BY-SA 3", "Perform the plank with legs elevated, feet on a gymball. Once stabilised, slowly move one foot sideways off the ball, then make it touch the floor, then come back to starting position. Alternate with the other foot. This is a core exercise."], ["Isometric Wipers", "pectoralis_major", "rectus_abdominis", "t", "30-60", 0, "cal.zabel", "CC-BY-SA 4", "Assume push-up position, with hands slightly wider than shoulder width. Shift body weight as far as possible to one side, allowing the elbow on that side to flex. Reverse the motion, moving completely over to the other side. Return to the starting position, and repeat for the desired number of repetitions."], ["Jogging", "", "", "c", "20-30", 0, "Papazit", "CC-BY-SA 4", "Get your shoes on, go outside and start running at a moderate pace."], ["Jumping Jacks", "quads", "", "r", "10-15", 0, "student1234", "CC-BY-SA 4", "A jumping jack or star jump, also called side-straddle hop in the US military, is a physical jumping exercise performed by jumping to a position with the legs spread wide and the hands going overhead, sometimes in a clap, and then returning to a position with the feet together and the arms at the sides"], ["Cable Cross-over", "pectoralis_major", "deltoid_anterior", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Begin with cables at about shoulder height, one in each hand. Take a step forward so that one foot is in front of the other, for stability, and so that there is tension on the cables. Bring hands together in front of you. Try to make your hands overlap (so that the cables cross) a few inches."], ["Kettlebell Swings", "gluteus_maximus", "hamstrings", "w", "8-12", 0, "J120290,cerin", "CC-BY-SA 3", "Hold the kettlebell securely in both hands. Keep your back flat throughout the move, avoiding any rounding of the spine.Keeping your knees \"soft\", hinge your hips backwards, letting the kettlebell swing between your knees. You want to bend from the hips as far as you can without letting your back round forwards . Then, snap your hips forwards quickly and standing up straight, locking your body in…"], ["Squats on Multipress", "quads", "gluteus_maximus adductors", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Landmine press", "deltoid_anterior", "pectoralis_major triceps_brachii", "w", "8-12", 0, "Torsten Linnecke", "CC-BY-SA 4", ""], ["Lateral Raises", "deltoid_lateral", "deltoid_anterior", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "This exercise works the deltoid muscle of the shoulder. The movement starts with the arms straight, and the hands holding weights at the sides or in front of the body. Body is in a slight forward-leaning position with hips and knees bent a little. Arms are kept straight or slightly bent, and raised through an arc of movement in the coronal plane that terminates when the hands are at approximately…"], ["Lateral Rows on Cable, One Armed", "deltoid_anterior", "", "w", "8-12", 1, "wger.de", "CC-BY-SA 3", "Set cable at waist height, start with arm across your belly and move han over and out too other side, one arm at the time."], ["Lateral-to-Front Raises", "deltoid_anterior trapezius", "", "w", "8-12", 0, "nate303303", "CC-BY-SA 4", "-(1) Perform a lateral raise, pausing at the top of the lift (2). -Instead of lowering the weight, bring it to the front of your body so that you appear to be at the top position of a front raise. You will do this by using a Pec Fly motion, maintaining straight arms. (3) -Now lower the weight to your quadriceps, or, in other words, lower the dumbbells as though you are completing a Front Raise…"], ["Lat Pull Down (Leaning Back)", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "drthurlow", "CC-BY-SA 3", "Lean Back, Pull into chest"], ["Lat Pull Down (Straight Back)", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "drthurlow", "CC-BY-SA 3", "The lat pull down is an exercise used to build the muscles of the back. While the exercise will primarily target the lats, you will also notice a fair amount of bicep and middle back activation."], ["Leg Curl", "hamstrings gluteus_maximus", "", "w", "8-12", 0, "BFad07", "CC0", "The leg curl, also known as the hamstring curl, is an isolation exercise that targets the hamstring muscles. The exercise involves flexing the lower leg against resistance towards the buttocks. Other exercises that can be used to strengthen the hamstrings are the glute-ham raise and the deadlift."], ["Leg Curls (laying)", "hamstrings", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Lay on a bench and put your calves behind the leg holder (better if they are hold on around the lower calves). Hold a grip on the bars to make sure the body is firmly in place. Bend your legs bringing the weight up, go slowly back. During the exercise the body should not move, all work is done by the legs."], ["Leg Curls (sitting)", "hamstrings", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Leg Curls (standing)", "hamstrings", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Leg Extension", "quads", "", "w", "8-12", 0, "BFad07", "CC0", "The leg extension is a resistance weight training exercise that targets the quadriceps muscle in the legs. The exercise is done using a machine called the Leg Extension Machine. There are various manufacturers of these machines and each one is slightly different. Most gym and weight rooms will have the machine in their facility. The leg extension is an isolated exercise targeting one specific…"], ["Leg Press", "hamstrings gastrocnemius gluteus_maximus quads", "adductors", "w", "8-12", 0, "BFad07", "CC0", "The leg press is a weight training exercise in which the individual pushes a weight or resistance away from them using their legs."], ["Leg Presses (narrow)", "quads", "gluteus_maximus adductors", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "The exercise is very similar to the wide leg press: Sit on the machine and put your feet on the platform so far apart that you could just put another foot in between them. The feet are parallel and point up. Lower the weight so much, that the knees form a right angle. Push immediately the platform up again, without any pause. When in the lower position, the knees point a bit outwards and the…"], ["Leg Presses (wide)", "quads", "gluteus_maximus adductors", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Sit on the machine and put your feet on the platform, a bit more than shoulder wide. The feet are turned outwards by a few degrees. Lower the weight so much, that the knees form a right angle. Push immediately the platform up again, without any pause. When in the lower position, the knees point a bit outwards and the movement should be always fluid."], ["Leg Press on Hackenschmidt Machine", "quads", "adductors", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Leg Raise", "obliques rectus_abdominis", "", "r", "10-15", 0, "BFad07", "CC0", "The leg raise is a strength training exercise which targets the iliopsoas (the anterior hip flexors). Because the abdominal muscles are used isometrically to stabilize the body during the motion, leg raises are also often used to strengthen the rectus abdominis muscle and the internal and external oblique muscles."], ["Leg Raises, Lying", "rectus_abdominis", "serratus_anterior", "r", "10-15", 0, "wger.de", "CC-BY-SA 3", "Lay down on a bench and hold onto the recliner with your hands to keep you stable. Hold your legs straight and lift them till they make an angle of about 45°. Make a short pause of 1 sec. and go slowly down to the initial position. To increase the intensity you can make a longer pause of 7 sec. every 5th time."], ["Leg Raises, Standing", "rectus_abdominis", "serratus_anterior", "r", "10-15", 0, "wger.de", "CC-BY-SA 3", "Put your forearms on the pads on the leg raise machine, the body is hanging freely. Lift now your legs with a fast movement as high as you can, make a short pause of 1sec at the top, and bring them down again. Make sure that during the exercise your body does not swing, only the legs should move."], ["Leverage Machine Chest Press", "pectoralis_major", "", "w", "8-12", 0, "tuckerm", "CC-BY-SA 3", "Be sure to adjust seat height so that the handles are towards the bottom of your pectorals."], ["Leverage Machine Iso Row", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "tuckerm", "CC-BY-SA 3", "Adjust seat height so that the handles are at the bottom of your pectorals or just below."], ["Diamond push ups", "pectoralis_major", "triceps_brachii", "r", "10-15", 0, "notdefine", "CC-BY-SA 4", "Start: Get into a plank. Place hands close together under your chest so thumbs and index fingers form a diamond shape. Lower: Bend your elbows to lower your chest toward your hands. Keep your body straight. Push: Push back up until arms are fully extended. New note Keep elbows close to your body and core tight."], ["Long-Pulley (low Row)", "latissimus_dorsi", "biceps_brachii brachialis rhomboids teres_major", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Sit down, put your feet on the supporting points and grab the bar with a wide grip. Pull the weight with a rapid movement towards your belly button, not upper. Keep your arms and elbows during the movement close to your body. Your shoulders are pulled together. Let the weight slowly down till your arms are completely stretched."], ["Long-Pulley, Narrow", "latissimus_dorsi", "biceps_brachii brachialis", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "The exercise is the same as the regular long pulley, but with a narrow grip: Sit down, put your feet on the supporting points and grab the bar with a wide grip. Pull the weight with a rapid movement towards your belly button, not upper. Keep your arms and elbows during the movement close to your body. Your shoulders are pulled together. Let the weight slowly down till your arms are completely stretched."], ["Low Box Squat - Wide Stance", "gluteus_maximus quads", "adductors", "w", "8-12", 0, "taylorbarbell", "CC-BY-SA 4", "Unrack the bar and set your stance wide, beyond your hips. Push your hips back and sit down to a box that takes you below parallel. Sit completely down, do not touch and go. Then explosively stand up. Stay tight in your upper back and torso throughout the movement."], ["Military Press mit SZ-Bar", "deltoid_anterior", "trapezius triceps_brachii", "w", "8-12", 0, "mbozi1", "CC-BY-SA 3", "On an SZ-bar grip your hands on the outside of each bend and stand with your arms straight down, palms facing your legs. Pull the bar (bending your arms at the elbow) to your chest, and the push the bar above your head (arms as straight as possible). Return the bar to your chest by dropping your arms at the elbows. Return the bar to it's origional position (stand with your arms straight down, palms facing your legs.)"], ["Muscle up", "biceps_brachii latissimus_dorsi", "deltoid_anterior triceps_brachii", "r", "10-15", 0, "arson", "CC-BY-SA 4", "The body is then explosively pulled up by the arms in a radial pull-up, with greater speed than a regular pull-up. When the bar approaches the upper chest, the wrists are swiftly flexed to bring the forearms above the bar. The body is leaned forward, and the elbows are straightened by activating the triceps. The routine is considered complete when the bar is at the level of the waist and the arms…"], ["Negative Crunches", "rectus_abdominis", "", "r", "10-15", 0, "wger.de", "CC-BY-SA 3", "Sit yourself on the decline bench and fix your legs. Cross your arms over the chest and bring with a rolling movement your upper body up, go now without a pause and with a slow movement down again. Don't let your head move during the exercise."], ["Overhand Cable Curl", "biceps_brachii", "", "w", "8-12", 0, "ThisGirl0819", "CC-BY-SA 3", "Hands at shoulder height, curl arms in toward head, then back out."], ["Overhead Squat", "gluteus_maximus quads", "deltoid_anterior hamstrings trapezius adductors", "w", "8-12", 0, "geraldbaeck", "CC-BY-SA 4", "The barbell is held overhead in a wide-arm snatch grip; however, it is also possible to use a closer grip if balance allows."], ["Pause Bench", "pectoralis_major", "triceps_brachii", "w", "8-12", 0, "Mens Fitness", "CC0", "Lower the bar to your chest and pause (but do not rest) there for 2 seconds. Press back up. use the same weight you would on bench press, but perform only single reps. Total the number of reps you did in one set of bench press (if you did 3 sets of 8 do 8 sinlge pause bench reps."], ["Pendelay Rows", "latissimus_dorsi trapezius", "biceps_brachii triceps_brachii", "w", "8-12", 0, "Nallitnas", "CC-BY-SA 3", "Back excercise with a barbell with a starting position which is in a bent over position with the back paralell to the ground. The barbell is on the ground at chest level.For the movement grab the barbell at shoulder width grip and pull towards your chest without losing the bent over position and without moving anything but your arms"], ["Pike Push Ups", "pectoralis_major", "triceps_brachii", "r", "10-15", 0, "Nash", "CC-BY-SA 4", "Push Up performed from a pike position (optional to have feet elevated)."], ["Pistol Squat", "hamstrings gluteus_maximus", "deltoid_anterior biceps_brachii brachialis adductors", "w", "8-12", 0, "minifigmaster125", "CC-BY-SA 3", "Stand with feet hip-width apart, toes pointed forward, and chest tall. Extend your leg straight out; extend both arms in front of you, at shoulder level. Brace your core and look straight ahead. Slowly squat down. (optional) pause at the bottom. Keep your (free) leg and arms extended for the whole duration."], ["Plank", "obliques rectus_abdominis", "biceps_brachii quads triceps_brachii", "t", "30-60", 0, "YYCfit / BFad07", "CC-BY-SA 3", "Get into a position on the floor supporting your weight on your forearms and toes. Arms are bent and directly below the shoulder. Keep your body straight at all times and hold this position as long as possible. To increase difficulty an arm or leg can be raised while performing this exercise."], ["Preacher Curls", "brachialis", "", "w", "8-12", 0, "cgoob883", "CC-BY-SA 3", "Place the EZ curl bar on the rest handles in front of the preacher bench. Lean over the bench and grab the EZ curl bar with palms up. Sit down on the preacher bench seat so your upper arms rest on top of the pad and your chest is pressed against the pad. Lower the weight until your elbows are extended and arms are straight. Bring the weights back up to the starting point by contracting biceps. Repeat"], ["Prone Scapular Retraction - Arms at Side", "trapezius", "", "w", "8-12", 0, "donaddon", "CC-BY-SA 4", "Lying on stomach with head on towel. Stretch arms straight out to your sides. Slowly lift your arms, pulling your shoulderblades together, hold for 3 seconds."], ["Pull-ups", "latissimus_dorsi", "deltoid_anterior biceps_brachii trapezius rhomboids teres_major", "r", "10-15", 0, "wger.de", "CC-BY-SA 3", "Grab the pull up bar with a wide grip, the body is hanging freely. Keep your chest out and pull yourself up till your chin reaches the bar or it touches your neck, if you want to pull behind you. Go with a slow and controlled movement down, always keeping the chest out."], ["Pull Ups on Machine", "latissimus_dorsi", "deltoid_anterior biceps_brachii trapezius rhomboids teres_major", "r", "10-15", 0, "wger.de", "CC-BY-SA 3", ""], ["Push Press", "trapezius", "gluteus_maximus", "w", "8-12", 0, "sistab2", "CC-BY-SA 3", "Clean your dumbbells onto your shoulders, palms facing in. Take a breath and brace your core. (picture 1)Dip at the knees and use your legs to help (picture 2) press your dumbbells overhead. Lower under control with a slow tempo to your shoulders and repeat."], ["Rack Deadlift", "gluteus_maximus", "biceps_brachii erector_spinae", "w", "8-12", 0, "Mahoney", "CC-BY-SA 3", "Deadlift to be done using a Smith machine or a free rack. Bar or barbell hould be just right under the knee cap level. Lift using the glutes and through the heels, then come back to starting postion with a control movement of 2 seconds. This exercise targets mainly the lower back and glutes."], ["Rear Delt Raises", "deltoid_posterior", "rhomboids trapezius", "w", "8-12", 0, "YYCfit", "CC-BY-SA 3", "Seated on a bench with the dumbbells on the floor bend over at 45 Degrees and then slowly raise each dumbbell to shoulder height and hold for a couple seconds before lowering to the starting position."], ["Renegade Row", "latissimus_dorsi trapezius", "rhomboids teres_major", "w", "8-12", 0, "fletchgraham", "CC0", "Get into pushup position gripping some dumbbells. Perform one pushup, then drive your left elbo up, bringing the dumbell up to your body. Return the dumbell to starting position. Perform another pushup and then row with the other arm to complete one rep."], ["Reverse Bar Curl", "biceps_brachii forearm_extensors", "", "w", "8-12", 0, "tuckerm", "CC-BY-SA 3", "Hold bar with reverse (or \"overhand\") grip, palms facing the floor."], ["Reverse Curl", "biceps_brachii brachialis forearm_extensors", "", "w", "8-12", 0, "BFad07", "CC0", "The reverse-grip barbell curl is a variation on the biceps curl where the palms face downward. The switch from an underhand to an overhand grip brings the forearm and brachialis muscles more into the exercise."], ["Reverse Grip Bench Press", "pectoralis_major triceps_brachii forearm_flexors", "deltoid_anterior", "w", "8-12", 0, "bl0sh", "CC-BY-SA 4", "Upper chest focuses exercise that also works triceps"], ["Ring Dips", "triceps_brachii", "", "r", "10-15", 0, "Nash", "CC-BY-SA 4", "Dips peformed on gymnastic rings."], ["Roman Chair Crunch", "rectus_abdominis", "obliques", "r", "10-15", 0, "MaddieBeasley", "CC-BY-SA 3", "Crunches on roman chair. Keep your torso straight, abs tight, and don't come up all the way vertical or lie flat to keep constant tension on your abs."], ["Romanian Deadlift", "hamstrings gluteus_maximus", "trapezius erector_spinae", "w", "8-12", 0, "pjwirth", "CC-BY-SA 4", "DL from top to pos 2: https://www.youtube.com/watch?v=WtWtjViRsKo"], ["Row", "latissimus_dorsi trapezius", "quads rhomboids teres_major", "w", "8-12", 0, "BFad07", "CC0", "In strength training, rowing (or a row, usually preceded by a qualifying adjective — for instance a seated row) is an exercise where the purpose is to strengthen the muscles that draw the rower's arms toward the body (latissimus dorsi) as well as those that retract the scapulae (trapezius and rhomboids) and those that support the spine (erector spinae). When done on a rowing machine, rowing also…"], ["Rowing, Lying on Bench", "latissimus_dorsi", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Rowing seated, narrow grip", "latissimus_dorsi forearm_flexors", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Tighten muscles Controlled movement Slow movement Keep upper body upright Do not lean back Pull toward chest"], ["Rowing, T-bar", "latissimus_dorsi", "deltoid_anterior biceps_brachii brachialis", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "The execution of this exercise is very similar to the regular bent over rowing, only that the bar is fixed here. Grab the barbell with a wide grip (slightly more than shoulder wide) and lean forward. Your upper body is not quite parallel to the floor, but forms a slight angle. The chest's out during the whole exercise. Pull now the barbell with a fast movement towards your belly button, not…"], ["Run", "", "", "c", "20-30", 0, "BeLikeWater", "CC-BY-SA 4", "Running or jogging outside in a park, on the tracks,..."], ["Run - Interval Training", "", "", "c", "20-30", 0, "BeLikeWater", "CC-BY-SA 4", "Run and do some interval trainings such as hill repat, fartlek,.."], ["Run - Treadmill", "", "", "c", "20-30", 0, "foguinho.peruca", "CC-BY-SA 3", "Run on a treadmill"], ["Incline Bench Press - Dumbbell", "pectoralis_major", "deltoid_anterior triceps_brachii", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "This is a variation of the flat bench press designed to emphasize the clavicular head of the pectoralis major (the upper portion). By tilting the torso, the angle of the push changes, shifting more tension to the upper chest and shoulders, which helps achieve a more aesthetic, balanced, and three-dimensional development of the torso. Bench Adjustment and Preparation: Set the bench to an incline…"], ["Incline Bench Press - Barbell", "pectoralis_major", "deltoid_anterior triceps_brachii", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "To do slowly, tempo is 4010"], ["Incline Bench Press - MP", "pectoralis_major", "deltoid_anterior triceps_brachii", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Shoulder Press, on Machine", "deltoid_anterior", "triceps_brachii", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Scissors", "rectus_abdominis", "", "w", "8-12", 0, "vkylamba", "CC-BY-SA 4", "Scissors is an abdominal exercise that strengthens the transverse abdominals, helping flatten your belly and strengthen your entire core. Scissors is not only a core strength move, but it is also a great stretch for your hamstrings and your lower back. Everyone is looking for new ways to work the core, to flatten the belly and to improve flexibility. If you learn how to do Scissors you will get…"], ["Seated Triceps Press", "triceps_brachii", "", "w", "8-12", 0, "richmr2174@gmail.com", "CC-BY-SA 4", "Sit down on a back (better with back support). Take a dumbbell firmly with both hands and hold it with extended arms over your head. With your palms facing upward and holding the weight of the dumbbell, slowly lower the weight behind your head."], ["Side Bends on Machine", "obliques", "rectus_abdominis", "w", "8-12", 0, "klabautermann", "CC-BY-SA 3", ""], ["Shotgun Row", "latissimus_dorsi", "rhomboids teres_major", "w", "8-12", 0, "cal.zabel", "CC-BY-SA 4", "Attach a single handle to a low cable. After selecting the correct weight, stand a couple feet back with a wide-split stance. Your arm should be extended and your shoulder forward. This will be your starting position. Perform the movement by retracting the shoulder and flexing the elbow. As you pull, supinate the wrist, turning the palm upward as you go. After a brief pause, return to the starting position."], ["Shoulder Press, Barbell", "deltoid_anterior", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Sit on a bench, the back rest should be almost vertical. Take a barbell with a shoulder wide grip and bring it up to chest height. Press the weight up, but don't stretch the arms completely. Go slowly down and repeat."], ["Shoulder Press, Dumbbells", "deltoid_anterior", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Sit on a bench, the back rest should be almost vertical. Take two dumbbells and bring them up to shoulder height, the palms and the elbows point during the whole exercise to the front. Press the weights up, at the highest point they come very near but don't touch. Go slowly down and repeat."], ["Shoulder Press, on Multi Press", "deltoid_anterior", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "The exercise is basically the same as with a free barbell: Sit on a bench, the back rest should be almost vertical. Take a bar with a shoulder wide grip and bring it down to chest height. Press the weight up, but don't stretch the arms completely. Go slowly down and repeat."], ["Shoulder Shrug", "trapezius", "", "r", "10-15", 0, "BFad07", "CC0", "The shoulder shrug (usually called simply the shrug) is an exercise in weight training used to develop the upper trapezius muscle. The lifter stands erect, hands about shoulder width apart, and raises the shoulders as high as possible, and then lowers them, while not bending the elbows, or moving the body at all. The lifter may not have as large a range of motion as in a normal shrug done for…"], ["Shrugs, Barbells", "deltoid_anterior", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Take a barbell and stand with a straight body, the arms are hanging freely in front of you. Lift from this position the shoulders as high as you can, but don't bend the arms during the movement. On the highest point, make a short pause of 1 or 2 seconds before returning slowly to the initial position. When training with a higher weight, make sure that you still do the whole movement!"], ["Shrugs, Dumbbells", "deltoid_anterior", "", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Stand with straight body, the hands are hanging freely on the side and hold each a dumbbell. Lift from this position the shoulders as high as you can, but don't bend the arms during the movement. On the highest point, make a short pause of 1 or 2 seconds before returning slowly to the initial position. When training with a higher weight, make sure that you still do the whole movement!"], ["Shrugs on Multipress", "deltoid_anterior", "triceps_brachii", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", ""], ["Side Crunch", "obliques", "rectus_abdominis", "r", "10-15", 0, "kwrindy", "CC-BY-SA 3", "Hold weight in one hand. Bend side ways to the knee. Pull upo to upright position using your obliquus."], ["Side Dumbbell Trunk Flexion", "obliques", "rectus_abdominis", "w", "8-12", 0, "GiglioRosso", "CC-BY-SA 3", "AKA dumbbell side bends. Stand in line with the hips with slightly bent knees, maintain the natural curvature of the spine, hand stretched by the body, grip the barbell with one hand. Make slow and controlled torso side flexions till you reach the angle of approximately 45°."], ["Side Plank", "rectus_abdominis", "obliques", "t", "30-60", 0, "http://www.bodybuilding.com/", "CC-BY-SA 4", "Works your obliques and helps stabilize your spine. Lie on your side and support your body between your forearm and knee to your feet."], ["Side to Side Push Ups", "deltoid_anterior obliques pectoralis_major triceps_brachii", "", "r", "10-15", 0, "nate303303", "CC-BY-SA 4", "-start in push up position -lean the body weight to the right side, and complete a push up with the chest over the right hand -come back to the centered position -on rep 2, lean to the left side"], ["Single-arm Preacher Curl", "biceps_brachii", "", "w", "8-12", 1, "tuckerm", "CC-BY-SA 3", "Sit on the preacher curl bench and perform a bicep curl with a dumbbell in one hand. Your other hand can be at rest, or beneath your curling arm's elbow."], ["Sitting Calf Raises", "soleus", "gastrocnemius", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Sit on a bench for calf raises and check that the feet are half free and that you can completely stretch the calf muscles down. Pull your calves up, going as far (up) as you can. Make at the highest point a short pause of 1 or 2 seconds and go down."], ["Sit-ups", "rectus_abdominis", "", "r", "10-15", 0, "wger.de", "CC-BY-SA 3", "Sit on a mat, your calves are resting on a bench, the knees make a right angle. Hold your hands behind your neck. Go now up with a rolling movement of your back, you should feel how the individual vertebrae lose contact with the mat. At the highest point, contract your abs as much as you can and hold there for 2 sec. Go now down, unrolling your back."], ["Skipping - Standard", "gastrocnemius", "", "c", "20-30", 0, "Cerin", "CC-BY-SA 4", "Do a single, double footed jump for each swing of the rope. Work on a smooth, rhythmical movement, bouncing lightly on the balls of your feet."], ["Smith Machine Close-grip Bench Press", "triceps_brachii forearm_flexors", "pectoralis_major", "w", "8-12", 0, "tuckerm", "CC-BY-SA 3", "Perform a standard bench press on the smith machine, but have your hands on the bar about shoulder width apart, and keep your elbows close to your body."], ["Snatch", "deltoid_anterior", "", "w", "8-12", 0, "Mens Fitness", "CC0", "Stand with your feet at hip width and your shins against the bar. Grasp the bar at double shoulder width and, keeping your lower back flat, drive your heels into the floor to begin lifting the bar. When it's above your knees, explosively extend your hips and shrug your shoulders. Let the momentum carry the weight overhead."], ["Speed Deadlift", "hamstrings gluteus_maximus", "quads trapezius erector_spinae", "w", "8-12", 0, "MrSteele", "CC-BY-SA 4", "Deadlift with short (less than one 1min) rest between sets."], ["Splinter Sit-ups", "obliques", "", "r", "10-15", 0, "djblitzd", "CC-BY-SA 3", "Lie on your back with your legs straight and arms at your sides, keeping your elbows bent at 90 degrees. As you sit up, twist your upper body to the right and bring your left knee toward your right elbow while you swing your left arm back. Lower your body to the starting position, and repeat to your right. That's 1 rep."], ["Squat Jumps", "quads", "adductors", "w", "8-12", 0, "OGhTebfCxhexZXuf35mUxV9C--A", "CC-BY-SA 3", "Jump wide, then close"], ["Squats", "quads", "gluteus_maximus adductors", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Place a barbell in a rack just below shoulder-height. Dip under the bar to put it behind the neck across the top of the back, and grip the bar with the hands wider than shoulder-width apart. Lift the chest up and squeeze the shoulder blades together to keep the straight back throughout the entire movement. Stand up to bring the bar off the rack and step backwards, then place the feet so that they…"], ["Squat Thrust", "gluteus_maximus quads rectus_abdominis soleus", "adductors", "r", "10-15", 0, "BFad07", "CC0", "The burpee, or squat thrust, is a full body exercise used in strength training and as an aerobic exercise. The basic movement is performed in four steps and known as a four-count burpee: Begin in a standing position. Move into a squat position with your hands on the ground. (count 1) Kick your feet back into a plank position, while keeping your arms extended. (count 2) Immediately return your…"], ["Standing Bicep Curl", "biceps_brachii brachialis", "", "w", "8-12", 0, "BFad07", "CC0", "Stand holding dumbbells at shoulder width apart. Face forearm upward and keep upper arm still while raising each dumbbell up to your shoulder."], ["Standing Calf Raises", "gastrocnemius", "soleus", "w", "8-12", 0, "wger.de", "CC-BY-SA 3", "Get onto the calf raises machine, you should able to completely push your calves down. Stand straight, don't make a hollow back and don't bend your legs. Pull yourself up as high as you can. Make a small pause of 1 - 2 seconds and go slowly down."], ["Stationary Bike", "", "", "c", "20-30", 0, "intelman", "CC-BY-SA 4", "Ride a Stationary Bike with various tensions."], ["Stiff-legged Deadlifts", "hamstrings", "gluteus_maximus erector_spinae", "w", "8-12", 0, "tuckerm", "CC-BY-SA 3", "Keep legs straight Keep back straight"], ["Straight-arm Pull Down (bar Attachment)", "latissimus_dorsi", "triceps_brachii rhomboids teres_major", "w", "8-12", 0, "tuckerm", "CC-BY-SA 3", "Use the straight bar attachment on a high pulley. Grasp the two ends of the bar with your palms facing downward and your arms straight out in front of you. Pull your hands down towards your hips, while keeping your arms straight, then raise them back up to the starting position."], ["Straight-arm Pull Down (rope Attachment)", "latissimus_dorsi", "triceps_brachii rhomboids teres_major", "w", "8-12", 0, "tuckerm", "CC-BY-SA 3", "Use the rope attachment on a high pulley. Grasp the two ends of the rope with your arms straight out in front of you. Pull your hands down towards your hips, while keeping your arms straight, then raise them back up to the starting position."], ["Sumo Deadlift", "hamstrings gluteus_maximus quads", "trapezius erector_spinae", "w", "8-12", 0, "magdy", "CC-BY-SA 4", "Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be
