/* B&K Prep v3 · Serena's UI design system. One phone column, bottom tab bar, colour codes the four bowl parts.
   Tokens: OKLCH colours (plum palette), concentric radii (inner = outer − padding), semi-transparent borders,
   one light-only shadow scale (dark = lighter surfaces), motion tokens. Text = Figtree; Bricolage only for big numbers.
   Same token names and colours as Body & Kitchen 0.83a: --danger (red) only for delete buttons, --warn = soft amber ("a bit over"), --over = calm violet ("over"). */
:root{
  color-scheme:light;
  --s0:oklch(97% .004 315);--s1:oklch(100% 0 0);--s2:oklch(96.6% .007 315);--s3:oklch(94% .012 320);--sheet:var(--s1);--seg-on:var(--s1);
  --ink:oklch(23.8% .029 310);--muted:oklch(51.9% .029 314);
  --line:oklch(25% .03 315 / 13%);--line-strong:oklch(25% .03 315 / 22%);
  --plum:oklch(40.1% .108 338);--plum-soft:oklch(93.2% .019 334);--on-plum:oklch(99% .004 338);
  --apricot:oklch(70% .14 52);--amber-ink:oklch(55% .13 55);--amber-soft:oklch(94.5% .03 70);
  --sage:oklch(54% .075 152);--on-sage:oklch(99% .005 152);
  --p:var(--plum);--c:oklch(68% .15 49);--f:var(--sage);--v:oklch(55% .077 203);
  --v-soft:oklch(94.4% .018 197);--c-soft:oklch(94.8% .026 55);--f-soft:oklch(94.2% .018 152);
  --warn:oklch(64% .13 68);--over:oklch(52% .085 295);--danger:oklch(53.1% .152 31.5);
  --scrim:oklch(18% .03 320 / 45%);
  --shadow-1:0 1px 2px oklch(24% .03 310 / 6%),0 1px 1px oklch(24% .03 310 / 4%);
  --shadow-2:0 10px 30px oklch(24% .03 310 / 14%),0 2px 6px oklch(24% .03 310 / 6%);
  --font-text:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"Bricolage Grotesque",Figtree,system-ui,sans-serif;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;
  --r-card:22px;--pad-card:14px;--r-in:calc(var(--r-card) - var(--pad-card));
  --r-sheet:26px;--pad-sheet:16px;--r-sheet-in:calc(var(--r-sheet) - var(--pad-sheet) - 2px);
  --r-seg:14px;--pad-seg:4px;--r-seg-in:calc(var(--r-seg) - var(--pad-seg));
  --r-ctl:12px;
  --ease:cubic-bezier(.2,.7,.2,1);--dur:180ms;--dur-slow:300ms;
  /* old names kept so nothing in the views breaks */
  --bg:var(--s0);--card:var(--s1);
}

  --ink:oklch(93.9% .014 319);--muted:oklch(71.1% .027 314);

  --warn:oklch(80% .11 72);--over:oklch(76% .075 295);--danger:oklch(73.9% .128 31);--scrim:oklch(8% .01 313 / 62%);
  --shadow-1:none;--shadow-2:none}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --s0:oklch(19.2% .018 313);--s1:oklch(23.5% .023 313);--s2:oklch(27.5% .027 313);--s3:oklch(31.5% .03 315);--sheet:var(--s2);--seg-on:oklch(37% .032 316);

  --shadow-1:none;--shadow-2:none}

*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--s0);color:var(--ink);font:16px/1.5 var(--font-text);min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-text);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:700;margin:var(--sp-5) 0 .6rem}
h3{font-size:1.02rem;font-weight:700}
main{max-width:720px;margin:0 auto;padding-block:var(--sp-4) 6.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-4);margin:.4rem 0 var(--sp-4);flex-wrap:wrap}
.eyebrow{font-size:.78rem;font-weight:600;color:var(--muted)}
.eyebrow a{color:inherit;text-underline-offset:2px}
.pill{background:var(--plum);color:var(--on-plum);border-radius:999px;padding:.35rem .85rem;font-weight:600;font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums;transition:transform var(--dur) var(--ease)}
.pill:active{transform:scale(.97)}
.pill.ex{background:var(--amber-soft);color:var(--amber-ink)}
.box{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--pad-card);margin-bottom:var(--sp-3);box-shadow:var(--shadow-1)}
.muted{color:var(--muted);font-size:.9rem}
.small{font-size:.86rem}
.row{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1 1 140px}
label{display:block;font-size:.84rem;font-weight:500;color:var(--muted);margin-bottom:.25rem}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:var(--r-in);padding:.6rem .7rem;width:100%;min-width:0;min-height:44px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--plum);box-shadow:0 0 0 3px color-mix(in oklch,var(--plum) 22%,transparent)}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:var(--r-ctl);padding:.6rem 1rem;min-height:44px;background:var(--plum);color:var(--on-plum);cursor:pointer;transition:transform var(--dur) var(--ease),background-color var(--dur) var(--ease),opacity var(--dur) var(--ease)}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
button.ghost{background:transparent;color:var(--plum);border:1px solid var(--line-strong)}
button.sm{padding:.35rem .7rem;font-size:.86rem;min-height:36px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--sp-3)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--s1);color:var(--ink);border-radius:999px;padding:.4rem .85rem;min-height:36px;font-weight:500;font-size:.92rem;display:inline-flex;align-items:center;gap:.35rem}
.chip.on{background:var(--plum);color:var(--on-plum);border-color:transparent}
.chip .n{font-size:.75rem;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.cat-p .chip.on{background:var(--p);color:var(--on-plum)}
.cat-c .chip.on{background:var(--c);color:var(--on-plum)}
.cat-f .chip.on{background:var(--f);color:var(--on-sage)}
.cat-v .chip.on{background:var(--v);color:var(--on-sage)}
.cat-s .chip.on{background:var(--ink);color:var(--s0)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:.82rem;padding:.1rem .55rem;border-radius:999px;background:var(--plum-soft);color:var(--plum);white-space:nowrap}
.count.full{background:var(--sage);color:var(--on-sage)}
.note{border-left:3px solid var(--apricot);padding:.55rem .75rem;background:var(--s2);border-radius:0 var(--r-in) var(--r-in) 0;margin:var(--sp-2) 0;font-size:.94rem}
.note.good{border-color:var(--sage)}
.note.over{border-color:var(--over)}
.wkbar2{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--s3);gap:2px}
.wkbar2 span{display:block;height:100%;border-radius:999px;transition:width var(--dur-slow) var(--ease)}
.wklegend{display:flex;flex-wrap:wrap;gap:.35rem .9rem;margin-top:.5rem;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wklegend i{display:inline-block;width:.6rem;height:.6rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
.ti{display:inline}.ti .tib{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;min-height:0;padding:0;margin-left:2px;border-radius:999px;background:transparent;color:var(--muted);font-size:.85rem;font-weight:500;vertical-align:-2px}.ti .tib:hover{background:var(--s3)}.ti .tib[aria-expanded=true]{color:var(--plum)}.ti .tip[hidden]{display:none}.ti .tip{display:block;margin:.35rem 0 .2rem;padding:.5rem .65rem;background:var(--s2);border-radius:var(--r-in);font-size:.86rem;color:var(--muted);font-weight:400;line-height:1.45}
.ptrack{height:6px;background:var(--s3);border-radius:99px;overflow:hidden;margin-top:.3rem}.ptrack span{display:block;height:100%;background:var(--p);border-radius:99px}
.rs{font-size:.75rem;font-weight:600;color:var(--sage);white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--s3);border-radius:var(--r-seg);padding:var(--pad-seg);gap:var(--pad-seg);margin-bottom:var(--sp-3)}
.seg button{flex:1;background:transparent;color:var(--muted);padding:.4rem .3rem;min-height:38px;font-size:.9rem;border-radius:var(--r-seg-in)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow-1)}
/* target strip */
.tgt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.tgt div{background:var(--s2);border-radius:var(--r-in);padding:.5rem .2rem}
.tgt b{display:block;font-family:var(--font-num);font-weight:700;font-size:1.5rem;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tgt span{font-size:.78rem;color:var(--muted)}
.big{font-family:var(--font-num);font-weight:700;font-size:2rem;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* bowl card */
.bowl{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--pad-card);margin-bottom:var(--sp-3);box-shadow:var(--shadow-1)}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-3)}
.bhead h3{flex:1;min-width:0}
.cost{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:.9rem;white-space:nowrap}
.sauce{font-size:.88rem;color:var(--muted);margin:.15rem 0 .5rem}
.ing{display:grid;grid-template-columns:.6rem minmax(0,1fr) auto;gap:.2rem .6rem;align-items:baseline;padding:.45rem 0;border-top:1px solid var(--line)}
.ing:first-of-type{border-top:0}
.dot{width:.6rem;height:.6rem;border-radius:50%;align-self:center}
.dot.p{background:var(--p)}.dot.c{background:var(--c)}.dot.f{background:var(--f)}.dot.v{background:var(--v)}.dot.s{background:var(--muted)}
.ing .nm{min-width:0}
.ing .g{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ing .sub{grid-column:2/4;font-size:.8rem;color:var(--muted);margin-top:-.15rem}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-2);margin-top:var(--sp-3)}
.mac{font-size:.78rem;color:var(--muted)}
.mac b{display:block;font-size:.95rem;color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--s3);border-radius:99px;overflow:hidden;margin-top:.25rem}
.fill{height:100%;border-radius:99px}
.off{color:var(--amber-ink)!important}
/* plan */
.day{display:grid;grid-template-columns:4.9rem minmax(0,1fr);gap:var(--sp-3);padding:.65rem 0;border-top:1px solid var(--line);align-items:start}
.day:first-child{border-top:0}
.dlab{font-weight:700;line-height:1.2}
.dlab span{display:block;font-weight:500;font-size:.8rem;color:var(--muted)}
.dlab.today{color:var(--plum)}
.meals{display:grid;gap:6px;min-width:0}
.meal{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:var(--sp-2);background:var(--s2);border-radius:var(--r-in);padding:.5rem .65rem;min-height:44px;min-width:0;transition:background-color var(--dur) var(--ease)}
.meal:hover{background:var(--s3)}
.meal:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.meal .slot{font-size:.75rem;font-weight:600;color:var(--muted);width:4.4rem;flex:none}
.meal .mn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.92rem}
.meal.empty{background:transparent;border:1px dashed var(--line-strong)}.meal.empty .mn{font-weight:500;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:5.2rem repeat(7,minmax(0,1fr));gap:5px;align-items:center}
.hgrid .hd{text-align:center;font-size:.78rem;font-weight:600;color:var(--muted)}
.hgrid .hl{font-size:.86rem;font-weight:600}
.hcell{height:2.5rem;min-height:0;padding:0;border-radius:var(--r-in);background:var(--s2);border:1px solid var(--line);color:var(--on-sage);font-weight:800}
.hcell.on{background:var(--sage);border-color:transparent;animation:swap-in var(--dur-slow) var(--ease)}
.minetag{font:700 .7rem/1.4 var(--font-text);background:var(--amber-soft);color:var(--amber-ink);border-radius:999px;padding:.05rem .5rem;vertical-align:middle}
.catlab.x{background:var(--s3);color:var(--muted)}
.mine-row{display:flex;align-items:center;gap:var(--sp-3);padding:.6rem 0;border-top:1px solid var(--line)}
.mine-row:first-child{border-top:0}.mine-row .nm{flex:1;min-width:0}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 4.2rem 4.6rem 2.75rem;gap:6px;align-items:center;margin-bottom:6px}
.status-line{border-radius:var(--r-in);padding:.55rem .75rem;font-size:.92rem;margin:var(--sp-3) 0}
.status-line.dup{background:var(--c-soft)}.status-line.new{background:var(--f-soft)}
.dlab span.prepbadge{display:inline-block;font-size:.7rem;font-weight:700;color:var(--on-sage)}
.prepbadge{display:inline-block;white-space:nowrap;margin-top:.3rem;font-size:.72rem;font-weight:700;color:var(--on-sage);background:var(--sage);border-radius:999px;padding:.05rem .5rem}
.tl{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:.2rem .8rem;margin-top:var(--sp-3)}
.tl .t{font-weight:700;font-variant-numeric:tabular-nums;color:var(--plum);font-size:.92rem}
.tl .blk{padding-bottom:.85rem;border-left:2px solid var(--line-strong);padding-left:.8rem;margin-left:-.9rem;min-width:0}
.tl .blk h3{font-size:.98rem;margin-bottom:.2rem}
.tl ul{margin:.2rem 0 0;padding-left:1.1rem}
.tl li{margin:.2rem 0}
.rcp summary{cursor:pointer;list-style:none}.rcp summary::-webkit-details-marker{display:none}.rcp[open] summary{margin-bottom:.2rem}.rcp>span{display:block}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:var(--sp-2) 0 .2rem;gap:2px}
/* shop */
.shoprow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:var(--sp-3);width:100%;min-height:52px;padding:.55rem 0;border-bottom:1px solid var(--line)}
.shoprow:last-child{border-bottom:0}
.shoprow:focus-visible{outline:2px solid var(--plum);outline-offset:2px;border-radius:var(--r-in)}
.shoprow .nm{flex:1;min-width:0}
.shoprow .q{font-size:.85rem;color:var(--muted)}
.shoprow.got{opacity:.55}.shoprow.got b{text-decoration:line-through;text-decoration-thickness:1.5px}
.box3{width:1.6rem;height:1.6rem;border:2px solid var(--line-strong);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--on-sage);flex:none;font-size:.9rem;transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.got .box3{background:var(--sage);border-color:transparent;animation:swap-in var(--dur-slow) var(--ease)}
.eur{all:unset;box-sizing:border-box;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600;color:var(--plum);padding:.35rem .5rem;min-height:36px;display:inline-flex;align-items:center;border-radius:var(--r-in);white-space:nowrap}
.eur:hover{background:var(--plum-soft)}
.eur:focus-visible{outline:2px solid var(--plum)}
.catlab{display:inline-block;font-size:.8rem;font-weight:700;padding:.2rem .6rem;border-radius:7px;margin:var(--sp-3) 0 .2rem}
.catlab.p{background:var(--plum-soft);color:var(--p)}.catlab.c{background:var(--c-soft);color:var(--amber-ink)}.catlab.f{background:var(--f-soft);color:var(--f)}.catlab.v{background:var(--v-soft);color:var(--v)}
details.base summary{cursor:pointer;list-style:none;min-height:28px}details.base summary::-webkit-details-marker{display:none}
.base10{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.25rem 1rem;font-size:.88rem}
.base10 div{min-width:0}
@media (max-width:520px){.base10{grid-template-columns:minmax(0,1fr)}.grid4,.tgt{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* nav + sheet */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--s1);background:color-mix(in oklch,var(--s1) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));z-index:5}

/* ---------- weekly budget (Mon → Sun, same rules as Body & Kitchen 0.81a) ---------- */
function mondayOf(d){const x=new Date(d+"T12:00");x.setDate(x.getDate()-(x.getDay()+6)%7);return x.toLocaleDateString("sv-SE")}
// linked to B&K: follow its Settings › Nutrition › Track calories. Otherwise Prep's own switch (default: by week)
function byWeek(){if(B.mode==="bk"&&B.bk)return B.bk.kcalBy!=="day";return B.kcalBy!=="day"}
const loggedOn=d=>(B.mode==="bk"&&B.bk&&B.bk.days||{})[d]||null;
let _wk={};
// where the Mon → Sun week containing d stands today: what's left, and the share for each remaining day
function wkBudget(d){const T=dayTargets(),mon=mondayOf(d),td=today(),key=mon+td+T.kcal+JSON.stringify(B.bk&&[B.bk.days,B.bk.week]);if(_wk[mon]&&_wk[mon].key===key)return _wk[mon];
 const days=Array.from({length:7},(_,i)=>dPlus(mon,i)),idx=Math.max(0,days.indexOf(td)),cur=days.includes(td);
 const per=days.map(x=>{const L=loggedOn(x);return{date:x,L,past:x<td,used:x<td?(L?L.kcal:T.kcal):0}});
 const before=per.slice(0,idx).reduce((a,x)=>a+x.used,0),daysLeft=cur?7-idx:7,week=7*T.kcal;
 let raw=cur?(week-before)/daysLeft:T.kcal,ratio=Math.min(1.3,Math.max(.7,raw/T.kcal));
 let status=raw<.7*T.kcal?"over":raw>1.3*T.kcal?"under":"ok",finish=before+ratio*T.kcal*daysLeft-week;
 const K=B.mode==="bk"&&B.bk&&B.bk.week;let before2=before;if(cur&&K&&K.mon===mon&&B.bk.weekDay===td&&+K.ratio){ratio=+K.ratio;status=K.status||status;finish=+K.finish;before2=+K.before;raw=status==="ok"?ratio*T.kcal:raw}
 const W={key,mon,days,idx,cur,per,week,before:before2,daysLeft,raw,ratio,status,finish,T,unlogged:per.slice(0,idx).filter(x=>!x.L).length,todayK:(loggedOn(td)||{}).kcal||0};
 return(_wk[mon]=W)}
// how big each meal on day d should be, compared with a normal day (1 = normal). Protein never moves.
function dayRatio(d){if(!byWeek()||d<today())return 1;const W=wkBudget(d);return W.cur?Math.round(W.ratio*20)/20:1}
const scaleT=(T,r)=>r===1?T:{kcal:T.kcal*r,p:T.p,c:T.c*r,f:T.f*r};
let _sc={};
function scaleMeal(b,slot,r){if(r===1||!b||b.recipe)return b; // recipes keep their portion, so their protein never drops
const k=b.key+"@"+slot+"@"+r;if(_sc[k])return _sc[k];
 const R=bowls(),T=scaleT(slot==="b"?R.TB:slot==="s"?R.TS:R.T,r);let n=null;
 if(b.key.startsWith("c|")){const cu=(B.custom||[]).find(c=>c.id===b.id);n=cu?customBowl(cu,T,slot):null}
 else{n=makeBowl(b.p,b.c,b.f,b.v,b.sid?SAUCE[b.sid]:null,T,b.bf,b.tex);n.key=b.key;n.name=b.name}
 if(!n)return b;n.key=b.key;n.scaled=r;return(_sc[k]=n)}

 h+=`<h2>How big is each meal?</h2><div class="box"><div class="eyebrow" style="margin-bottom:.4rem">Lunch &amp; dinner bowls</div><div class="chips">${[.25,.3,.35,.4,.5].map(s=>`<button class="chip${Math.abs(B.share-s)<.001?" on":""}" onclick="B.share=${s};save();render()">${s*100}%</button>`).join("")}</div>
 ${B.slots.s?`<div class="eyebrow" style="margin:.9rem 0 .4rem">Snack</div><div class="chips">${[.1,.12,.15,.2].map(s=>`<button class="chip${Math.abs(B.shareS-s)<.001?" on":""}" onclick="B.shareS=${s};save();render()">${Math.round(s*100)}%</button>`).join("")}</div>`:""}
 ${B.slots.b?`<div class="eyebrow" style="margin:.9rem 0 .4rem">Breakfast</div><div class="chips">${[.15,.2,.25,.3].map(s=>`<button class="chip${Math.abs(B.shareB-s)<.001?" on":""}" onclick="B.shareB=${s};save();render()">${s*100}%</button>`).join("")}</div>`:""}
 <p class="muted small" style="margin:.7rem 0 0">Bowl <b>${r0(T.kcal)}</b>${B.slots.b?` · Breakfast <b>${r0(bfTarget().kcal)}</b>`:""}${B.slots.s?` · Snack <b>${r0(snTarget().kcal)}</b>`:""} kcal${(()=>{const left=D.kcal-T.kcal*mainSlots().length-(B.slots.b?bfTarget().kcal:0)-(B.slots.s?snTarget().kcal:0);return left>=0?"":`<br><span class="off">That's ${r0(-left)} kcal more than your day. Lower a share.</span>`})()}</p></div>`;
 h+=`<h2>Meals I eat at home</h2><div class="box">${homeGrid()}</div>`;
 h+=`<h2>Prep days</h2><div class="box"><div class="chips">${DNL.map((d,i)=>`<button class="chip${B.prepDays.includes(i)?" on":""}" onclick="togglePrep(${i})">${d}</button>`).join("")}</div><p class="muted small" style="margin:.7rem 0 0">2 prep days keep food fresh</p></div>`;
 h+=`<p class="status" id="status">${status}</p>`;
 return h
}
function setQ(k,v){B.quick[k]=v;if(B.mode!=="quick")B.mode="quick";save();render()}
function setM(k,v){B.manual[k]=v;save();render()}
function togglePrep(i){const s=B.prepDays,j=s.indexOf(i);if(j>=0){if(s.length===1){toast("Keep at least one prep day.");return}s.splice(j,1)}else s.push(i);save();render()}
const ON_PAGES=/github\.io$/.test(location.hostname);
const BK_URL=ON_PAGES?"../":"https://claude.ai/code/artifact/40cbce96-3b8f-42de-88a7-b64aadfe5191";
// turns Body & Kitchen data (a backup file or the app's own storage) into targets, prices and budget
function bkFrom(o){if(!o||!o.core||!o.core.profile)return{err:"notbk"};
 const core=o.core,p=core.profile,ent=((o.body||{}).entries||[]).filter(e=>e.weight).sort((a,b)=>a.date.localeCompare(b.date));
 const w=ent.length?+ent[ent.length-1].weight:+p.weight||0,ad=adaptiveFromBackup(o.body,o.logs),t=calcTargets(p,w,core.phase,ad,core.prefs||{});
 if(!t)return{err:"profile"};
 const pf=core.prefs||{},days={},lg=o.logs||{};
 // only the last two Mon → Sun weeks: what was eaten this week decides how much is left
 for(let x=dPlus(mondayOf(today()),-7);x<=today();x=dPlus(x,1)){const L=((lg["log-"+x.slice(0,7)]||{}).days||{})[x];if(L&&L.food&&L.food.length){const d={kcal:0,p:0,c:0,f:0,n:L.food.length};L.food.forEach(e=>{d.kcal+=e.kcal||0;d.p+=e.p||0;d.c+=e.c||0;d.f+=e.f||0});days[x]=d}}
 const sp=core.shopPrices||{},shops=core.shops&&core.shops.length?core.shops:[((core.setup||{}).answers||{}).shop||"Intermarché"],fs=core.foodShop||{},prices={};
 Object.keys(FOODS).forEach(id=>{const sh=fs[id]||shops[0];let v=null;if(sp[sh]&&sp[sh][id]!=null)v=sp[sh][id];else if(core.prices&&core.prices[id]!=null)v=core.prices[id];else for(const k in sp)if(sp[k][id]!=null){v=sp[k][id];break}if(v!=null&&+v>0)prices[id]=+v});
 return{bk:{at:today(),t:{kcal:t.kcal,p:t.p,c:t.c,f:t.f},phase:t.manual?"Custom targets":(PHASES[(core.phase||{}).name]||PHASES.cut).label,weight:w||null,adaptive:t.adaptive&&!t.manual,prices,budget:+core.budget||null,shop:shops[0],kcalBy:pf.kcalBy==="day"?"day":"week",days},t}}
// on GitHub Pages both apps live on the same site, so Prep can read Body & Kitchen's data on this phone directly
let bkLive=false;
function linkLocalBK(){if(!ON_PAGES)return;let o=null;try{const r=localStorage.getItem("serena-fit-v1");if(r)o=JSON.parse(r)}catch(e){}
 if(!o)return;const res=bkFrom(o);if(!res.bk)return;
 // B&K 0.82e writes its exact targets and this week's numbers here on every save
 try{const k=JSON.parse(localStorage.getItem("bk-targets-v1")||"null");if(k&&k.t&&+k.t.kcal){res.bk.t={kcal:+k.t.kcal,p:+k.t.p,c:+k.t.c,f:+k.t.f};res.bk.kcalBy=k.kcalBy==="day"?"day":"week";res.bk.exact=true;
  const day=new Date(+k.at||0).toLocaleDateString("sv-SE");res.bk.week=k.week&&day===today()?k.week:null;res.bk.weekDay=day}}catch(e){}const changed=["t","prices","kcalBy","days","week"].some(k=>JSON.stringify((B.bk||{})[k])!==JSON.stringify(res.bk[k]));
 B.bk=res.bk;bkLive=true;if(B.mode==="example")B.mode="bk";if(changed)save()}
function importBK(input){const file=input.files&&input.files[0];if(!file)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||o.app!=="serena-body-kitchen"){toast("That isn't a Body & Kitchen backup. Use Me → Backup → Download backup.");return}
  const res=bkFrom(o);if(res.err){toast(res.err==="profile"?"Your Body & Kitchen profile needs age, height and weight first.":"That isn't a Body & Kitchen backup.");return}
  B.bk=res.bk;B.mode="bk";save();render();toast(`Imported: ${r0(res.t.kcal)} kcal, ${r0(res.t.p)} g protein a day.`)}catch(e){toast("Couldn't read that file. Download a fresh backup and try again.")}};
 rd.readAsText(file);input.value=""}
