<style>
/* Layout: one phone column with a bottom tab bar, same system as Body & Kitchen; colour codes the four bowl parts */
:root{
  --bg:#F6F4F7;--card:#FFFFFF;--ink:#231B29;--muted:#6F6475;--line:#E2DAE5;
  --plum:#6B2D5C;--plum-soft:#F1E4EE;--apricot:#E0793A;--sage:#4F7A5A;--warn:#B3412F;
  --p:#6B2D5C;--c:#E0793A;--f:#4F7A5A;--v:#2F7F86;--v-soft:#E1F0F0;--c-soft:#FBEADF;--f-soft:#E5EFE7;
  --display:"Bricolage Grotesque",Figtree,system-ui,sans-serif;--body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17121A;--card:#221B26;--ink:#EFE8F1;--muted:#A89DAE;--line:#3A3040;
  --plum:#D08BBE;--plum-soft:#3A2536;--apricot:#F0A56E;--sage:#8DBB97;--warn:#F08A78;
  --p:#D08BBE;--c:#F0A56E;--f:#8DBB97;--v:#7CC4C9;--v-soft:#1E3334;--c-soft:#3A2A1E;--f-soft:#223326;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121A;--card:#221B26;--ink:#EFE8F1;--muted:#A89DAE;--line:#3A3040;
  --plum:#D08BBE;--plum-soft:#3A2536;--apricot:#F0A56E;--sage:#8DBB97;--warn:#F08A78;
  --p:#D08BBE;--c:#F0A56E;--f:#8DBB97;--v:#7CC4C9;--v-soft:#1E3334;--c-soft:#3A2A1E;--f-soft:#223326;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);min-height:100%}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700;margin:1.6rem 0 .6rem}
h3{font-size:1.05rem;font-weight:700}
main{max-width:720px;margin:0 auto;padding-block:1rem 6.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin:.4rem 0 1rem;flex-wrap:wrap}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow a{color:inherit}
.pill{background:var(--plum);color:var(--bg);border-radius:999px;padding:.3rem .8rem;font-weight:600;font-size:.85rem;white-space:nowrap}
.pill.ex{background:var(--apricot)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.8rem}
.muted{color:var(--muted);font-size:.9rem}
.small{font-size:.85rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1 1 140px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.2rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--plum);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:.55rem .9rem;background:var(--plum);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--plum);border:1px solid var(--line)}
button.sm{padding:.3rem .6rem;font-size:.85rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.4rem .8rem;font-weight:500;font-size:.92rem;display:inline-flex;align-items:center;gap:.35rem}
.chip.on{background:var(--plum);color:var(--bg);border-color:var(--plum)}
.chip .n{font-size:.72rem;font-weight:700;opacity:.8}
.cat-p .chip.on{background:var(--p);border-color:var(--p)}
.cat-c .chip.on{background:var(--c);border-color:var(--c);color:#fff}
.cat-f .chip.on{background:var(--f);border-color:var(--f);color:#fff}
.cat-v .chip.on{background:var(--v);border-color:var(--v);color:#fff}
.cat-s .chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.6rem}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;padding:.1rem .5rem;border-radius:999px;background:var(--plum-soft);color:var(--plum)}
.count.full{background:var(--sage);color:#fff}
.note{border-left:3px solid var(--apricot);padding:.5rem .75rem;background:var(--card);border-radius:0 10px 10px 0;margin:.5rem 0;font-size:.95rem}
.note.good{border-color:var(--sage)}
.seg{display:flex;background:var(--plum-soft);border-radius:12px;padding:.25rem;gap:.25rem;margin-bottom:.8rem}
.seg button{flex:1;background:transparent;color:var(--ink);padding:.45rem .3rem;font-size:.9rem}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* target strip */
.tgt{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;text-align:center}
.tgt div{background:var(--bg);border-radius:10px;padding:.45rem .2rem}
.tgt b{display:block;font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.tgt span{font-size:.75rem;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* bowl card */
.bowl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;margin-bottom:.8rem}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.bhead h3{flex:1;min-width:0}
.cost{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:.9rem;white-space:nowrap}
.sauce{font-size:.88rem;color:var(--muted);margin:.15rem 0 .5rem}
.ing{display:grid;grid-template-columns:.6rem 1fr auto;gap:.2rem .55rem;align-items:baseline;padding:.4rem 0;border-top:1px solid var(--line)}
.ing:first-of-type{border-top:0}
.dot{width:.6rem;height:.6rem;border-radius:50%;align-self:center}
.dot.p{background:var(--p)}.dot.c{background:var(--c)}.dot.f{background:var(--f)}.dot.v{background:var(--v)}.dot.s{background:var(--muted)}
.ing .nm{min-width:0}
.ing .g{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ing .sub{grid-column:2/4;font-size:.8rem;color:var(--muted);margin-top:-.15rem}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.6rem}
.mac{font-size:.78rem;color:var(--muted)}
.mac b{display:block;font-size:.95rem;color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--plum-soft);border-radius:99px;overflow:hidden;margin-top:.2rem}
.fill{height:100%;border-radius:99px}
.off{color:var(--apricot)!important}
/* plan */
.day{display:grid;grid-template-columns:4.1rem minmax(0,1fr);gap:.6rem;padding:.6rem 0;border-top:1px solid var(--line);align-items:start}
.day:first-child{border-top:0}
.dlab{font-weight:700;line-height:1.2}
.dlab span{display:block;font-weight:500;font-size:.8rem;color:var(--muted)}
.dlab.today{color:var(--plum)}
.meals{display:grid;gap:.35rem;min-width:0}
.meal{all:unset;cursor:pointer;display:flex;align-items:center;gap:.5rem;background:var(--bg);border-radius:10px;padding:.45rem .6rem;min-width:0}
.meal:focus-visible{outline:2px solid var(--plum)}
.meal .slot{font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);width:4.6rem;flex:none}
.meal .mn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.92rem}
.meal.empty{background:transparent;border:1px dashed var(--line)}.meal.empty .mn{font-weight:500;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:5.2rem repeat(7,minmax(0,1fr));gap:.3rem;align-items:center}
.hgrid .hd{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted)}
.hgrid .hl{font-size:.85rem;font-weight:600}
.hcell{height:2.3rem;padding:0;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:#fff;font-weight:800}
.hcell.on{background:var(--sage);border-color:var(--sage)}
.minetag{font:700 .68rem/1.4 var(--body);background:var(--apricot);color:#fff;border-radius:999px;padding:.05rem .45rem;vertical-align:middle;letter-spacing:.02em}
.catlab.x{background:var(--plum-soft);color:var(--muted)}
.mine-row{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-top:1px solid var(--line)}
.mine-row:first-child{border-top:0}.mine-row .nm{flex:1;min-width:0}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 4.2rem 4.6rem 2rem;gap:.4rem;align-items:center;margin-bottom:.4rem}
.status-line{border-radius:10px;padding:.55rem .75rem;font-size:.92rem;margin:.6rem 0}
.status-line.dup{background:var(--c-soft)}.status-line.new{background:var(--f-soft)}
.dlab .prepbadge{display:inline-block;color:#fff;font-weight:700;font-size:.66rem}
.prepbadge{display:inline-block;white-space:nowrap;margin-top:.25rem;font-size:.66rem;font-weight:700;color:#fff;background:var(--sage);border-radius:999px;padding:.05rem .45rem}
.tl{display:grid;grid-template-columns:3.4rem 1fr;gap:.2rem .8rem;margin-top:.6rem}
.tl .t{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--plum)}
.tl .blk{padding-bottom:.8rem;border-left:2px solid var(--line);padding-left:.8rem;margin-left:-.9rem;min-width:0}
.tl .blk h3{font-size:.98rem;margin-bottom:.2rem}
.tl ul{margin:.2rem 0 0;padding-left:1.1rem}
.tl li{margin:.15rem 0}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:.5rem 0 .2rem}
/* shop */
.shoprow{all:unset;cursor:pointer;display:flex;align-items:center;gap:.75rem;width:100%;padding:.6rem 0;border-bottom:1px solid var(--line);box-sizing:border-box}
.shoprow:last-child{border-bottom:0}
.shoprow .nm{flex:1;min-width:0}
.shoprow .q{font-size:.85rem;color:var(--muted)}
.shoprow.got{opacity:.5}.shoprow.got b{text-decoration:line-through}
.box3{width:1.6rem;height:1.6rem;border:2px solid var(--plum);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;font-size:.9rem}
.got .box3{background:var(--sage);border-color:var(--sage)}
.eur{all:unset;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600;color:var(--plum);padding:.2rem .4rem;border-radius:8px;white-space:nowrap}
.eur:focus-visible{outline:2px solid var(--plum)}
.catlab{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .6rem;border-radius:6px;margin:.6rem 0 .2rem}
.catlab.p{background:var(--plum-soft);color:var(--p)}.catlab.c{background:var(--c-soft);color:var(--c)}.catlab.f{background:var(--f-soft);color:var(--f)}.catlab.v{background:var(--v-soft);color:var(--v)}
.base10{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1rem;font-size:.88rem;counter-reset:b}
.base10 div{min-width:0}
@media (max-width:520px){.base10{grid-template-columns:1fr}.grid4,.tgt{grid-template-columns:repeat(2,1fr)}}
/* nav + sheet */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:.35rem max(.25rem,env(safe-area-inset-right,0px)) calc(.35rem + env(safe-area-inset-bottom,0px)) max(.25rem,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{background:transparent;color:var(--muted);flex:1;padding:.35rem 0;font-size:.68rem;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.1rem}
nav.tabs button span{font-size:1.25rem;line-height:1}
nav.tabs button.on{color:var(--plum)}
.modal{position:fixed;inset:0;background:rgba(20,10,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:1.1rem max(1rem,env(safe-area-inset-right,0px)) calc(1.2rem + env(safe-area-inset-bottom,0px)) max(1rem,env(safe-area-inset-left,0px))}
.pick{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:.6rem .5rem;border-radius:10px}
.pick.sel{background:var(--plum-soft)}
.pick b{display:block}
.pick span{font-size:.82rem;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4.8rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:10px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.file{display:inline-block;border-radius:10px;padding:.55rem .9rem;background:var(--plum);color:var(--bg);font-weight:600;cursor:pointer;margin:0}
.file input{display:none}
.status{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s}}
</style>
</head>

function calcTargets(p,w,phase,adEst){
 const h=+p.height,a=+p.age;if(!w||!h||!a)return null;
 const bmr=10*w+6.25*h-5*a+(p.sex==="m"?5:-161);
 const tdeeF=bmr*(+p.activity||1.55);let tdee=tdeeF;
 if(adEst&&p.adaptive!==false){const lo=Math.max(bmr,tdeeF*.7),hi=tdeeF*1.35;tdee=Math.min(hi,Math.max(lo,adEst))}
 if(p.manual&&+p.manual.kcal){const k=+p.manual.kcal,pr=+p.manual.p||w*1.6,fa=+p.manual.f||k*.3/9;return{kcal:k,p:pr,f:fa,c:+p.manual.c||Math.max(0,(k-pr*4-fa*9)/4),manual:true}}
 phase=phase||{name:"cut"};const ph=PHASES[phase.name]||PHASES.cut;
 let kf=ph.kf;if(phase.name==="build"&&phase.miniCut)kf=.85;
 const gentle=phase.pace==="gentle";if(gentle&&phase.name==="cut")kf=.9;if(gentle&&phase.name==="build"&&!phase.miniCut)kf=1.04;
 if(phase.name==="gain")kf=(gentle||a<18)?1.08:1.12;
 const under=w/((h/100)**2)<18.5,safe=!!p.noDeficit||under;if(safe&&kf<1)kf=1;
 let kcal=tdee*kf+(safe?Math.max(0,+phase.kcalAdjust||0):(+phase.kcalAdjust||0));
 kcal=Math.max(kcal,Math.max(bmr,p.sex==="m"?1500:1200));
 const isGain=phase.name==="gain",basis=isGain?w:Math.min(w,25*(h/100)**2);
 const conds=p.conditions||[];
 const prot=basis*((["cut","minicut"].includes(phase.name)||phase.miniCut?2.1:ph.prot)+(conds.some(c=>["pcos","insulin","menopause","glp1"].includes(c))?.1:0));
 const fat=Math.max(.8*basis,kcal*(isGain?.3:.25)/9);
 return{kcal,p:prot,f:fat,c:Math.max(0,(kcal-prot*4-fat*9)/4),adaptive:!!adEst}
}
function adaptiveFromBackup(body,logs){
 const t=today(),daysAgo=n=>dPlus(t,-n);let kc=0,n=0;
 for(let i=1;i<=28;i++){const d=daysAgo(i);const L=(((logs||{})["log-"+d.slice(0,7)]||{}).days||{})[d];if(L&&L.food&&L.food.length){const k=L.food.reduce((a,x)=>a+(x.kcal||0),0);if(k>600){kc+=k;n++}}}
 const start=new Date(daysAgo(28)+"T12:00");
 const pts=((body||{}).entries||[]).filter(e=>e.weight&&e.date>=daysAgo(28)&&e.date<t).map(e=>({x:(new Date(e.date+"T12:00")-start)/864e5,y:+e.weight}));
 if(n<14||pts.length<6)return null;
 const mx=pts.reduce((a,p)=>a+p.x,0)/pts.length,my=pts.reduce((a,p)=>a+p.y,0)/pts.length;let num=0,den=0;
 pts.forEach(p=>{num+=(p.x-mx)*(p.y-my);den+=(p.x-mx)**2});
 return kc/n-(den?num/den:0)*7700;
}

function solve(P,C,Fa,V,S,T){

  for(let b=C.min;b<=C.max+1e-6;b+=C.step){const pb=pa+C.p*b/100,cb=ca+C.c*b/100,fb=fa+C.f*b/100,kb=ka+C.kcal*b/100;
   for(let c=Fa.min;c<=Fa.max+1e-6;c+=Fa.step){const p=pb+Fa.p*c/100,cc=cb+Fa.c*c/100,f=fb+Fa.f*c/100,k=kb+Fa.kcal*c/100;
    const e=2*((p-tp)/tp)**2+((cc-tc)/tc)**2+((f-tf)/tf)**2+2*((k-tk)/tk)**2;
    if(!best||e<best.e)best={e,gp:a,gc:b,gf:c,p,c:cc,f,kcal:k}}}}

}

  ["b","l","d","s"].forEach(s=>{const k=i+s,bf=s==="b",kd=s==="b"?"b":s==="s"?"s":"m",o=ov[k],cell={day:i,date,slot:s,lab:SLOTLAB[s],k,past,custom:!!o};

 h+=`<h2>Where your targets come from</h2><div class="seg"><button class="${B.mode==="bk"||B.mode==="example"?"on":""}" onclick="B.mode=B.bk?'bk':'example';save();render()">Body &amp; Kitchen</button><button class="${B.mode==="quick"?"on":""}" onclick="B.mode='quick';save();render()">Quick profile</button><button class="${B.mode==="manual"?"on":""}" onclick="B.mode='manual';save();render()">My numbers</button></div>`;
 if(B.mode==="bk"||B.mode==="example"){
  if(bkLive)h+=`<div class="box"><p style="margin:0 0 .4rem"><b>Linked to Body &amp; Kitchen on this phone</b> · ${esc(B.bk.phase||"")}${B.bk.weight?` · ${B.bk.weight} kg`:""}${B.bk.adaptive?" · adaptive maintenance":""}</p><p class="muted small" style="margin:0">Your goal, weight, prices and budget update by themselves each time you open B&amp;K Prep.</p></div>`;
  else h+=`<div class="box">${B.bk?`<p style="margin:0 0 .4rem"><b>Imported ${fmt(B.bk.at,{day:"numeric",month:"long"})}</b> · ${esc(B.bk.phase||"")}${B.bk.weight?` · ${B.bk.weight} kg`:""}${B.bk.adaptive?" · adaptive maintenance":""}</p><p class="muted small" style="margin:0 0 .8rem">Same formula as the app, plus your prices, shop and weekly budget. Import again when your weight or phase changes.</p>`:`<p style="margin:0 0 .4rem">Bring in your profile, goal phase, prices and budget.</p>`}
  <ol class="small" style="margin:0 0 .8rem;padding-left:1.2rem"><li>In Body &amp; Kitchen, open <b>Me → Backup → Download backup</b>.</li><li>Choose that file here. Only your goal, weight, prices and budget are kept.</li></ol>
  <label class="file">${B.bk?"Import a newer backup":"Choose backup file"}<input type="file" accept=".json,application/json" onchange="importBK(this)"></label></div>`}
 if(B.mode==="quick"){const q=B.quick;
  h+=`<div class="box"><div class="grid2"><div><label for="qsex">Sex</label><select id="qsex" onchange="setQ('sex',this.value)"><option value="f" ${q.sex==="f"?"selected":""}>Female</option><option value="m" ${q.sex==="m"?"selected":""}>Male</option></select></div>
  <div><label for="qage">Age</label><input id="qage" type="number" inputmode="numeric" value="${esc(q.age)}" onchange="setQ('age',this.value)"></div>
  <div><label for="qh">Height (cm)</label><input id="qh" type="number" inputmode="numeric" value="${esc(q.height)}" onchange="setQ('height',this.value)"></div>
  <div><label for="qw">Weight (kg)</label><input id="qw" type="number" inputmode="decimal" value="${esc(q.weight)}" onchange="setQ('weight',this.value)"></div>
  <div><label for="qa">Activity</label><select id="qa" onchange="setQ('activity',this.value)">${[["1.2","Mostly sitting"],["1.375","Light (1–3 workouts)"],["1.55","Moderate (3–5 workouts)"],["1.725","Very active (6+)"]].map(([v,l])=>`<option value="${v}" ${String(q.activity)===v?"selected":""}>${l}</option>`).join("")}</select></div>
  <div><label for="qp">Goal</label><select id="qp" onchange="setQ('phase',this.value)">${Object.entries(PHASES).map(([k,v])=>`<option value="${k}" ${q.phase===k?"selected":""}>${v.label}</option>`).join("")}</select></div></div>
  ${D.example?`<p class="note" style="margin-bottom:0">Fill in age, height and weight to calculate your targets.</p>`:""}</div>`}
 if(B.mode==="manual"){const m=B.manual;
  h+=`<div class="box"><div class="grid2">${[["kcal","Calories"],["p","Protein (g)"],["c","Carbs (g)"],["f","Fat (g)"]].map(([k,l])=>`<div><label for="m${k}">${l}</label><input id="m${k}" type="number" inputmode="numeric" value="${esc(m[k])}" onchange="setM('${k}',this.value)"></div>`).join("")}</div><p class="muted small" style="margin:.6rem 0 0">Calories and protein are enough; carbs and fat fill in if left empty.</p></div>`}
 h+=`<h2>How big is each meal?</h2><div class="box"><div class="eyebrow" style="margin-bottom:.4rem">Lunch &amp; dinner bowls</div><div class="chips">${[.25,.3,.35,.4,.5].map(s=>`<button class="chip${Math.abs(B.share-s)<.001?" on":""}" onclick="B.share=${s};save();render()">${s*100}%</button>`).join("")}</div>
 ${B.slots.s?`<div class="eyebrow" style="margin:.9rem 0 .4rem">Snack</div><div class="chips">${[.1,.12,.15,.2].map(s=>`<button class="chip${Math.abs(B.shareS-s)<.001?" on":""}" onclick="B.shareS=${s};save();render()">${Math.round(s*100)}%</button>`).join("")}</div>`:""}
 ${B.slots.b?`<div class="eyebrow" style="margin:.9rem 0 .4rem">Breakfast</div><div class="chips">${[.15,.2,.25,.3].map(s=>`<button class="chip${Math.abs(B.shareB-s)<.001?" on":""}" onclick="B.shareB=${s};save();render()">${s*100}%</button>`).join("")}</div>`:""}
 <p class="muted small" style="margin:.7rem 0 0">Each lunch or dinner bowl ≈ <b>${r0(T.kcal)} kcal</b>${B.slots.b?`, each breakfast ≈ <b>${r0(bfTarget().kcal)} kcal</b>`:""}${B.slots.s?`, each snack ≈ <b>${r0(snTarget().kcal)} kcal</b> with ${r0(snTarget().p)} g protein`:""}. ${(()=>{const left=D.kcal-T.kcal*mainSlots().length-(B.slots.b?bfTarget().kcal:0)-(B.slots.s?snTarget().kcal:0);return left>=0?`On a day with every meal at home, ${r0(left)} kcal are left for ${B.slots.b?"anything else":"breakfast and anything else"}.`:`<span class="off">That's ${r0(-left)} kcal more than your day. Lower a share.</span>`})()}</p></div>`;
 h+=`<h2>Meals I eat at home</h2><div class="box">${homeGrid()}<p class="muted small" style="margin:.7rem 0 0">Only ticked meals are planned, prepped and bought.</p></div>`;
 h+=`<h2>Prep days</h2><div class="box"><div class="chips">${DNL.map((d,i)=>`<button class="chip${B.prepDays.includes(i)?" on":""}" onclick="togglePrep(${i})">${d}</button>`).join("")}</div><p class="muted small" style="margin:.7rem 0 0">Each prep day cooks for the days until the next one. Two a week keeps everything fresh.</p></div>`;
 h+=`<p class="status" id="status">${status}</p>`;
 return h
}
function setQ(k,v){B.quick[k]=v;if(B.mode!=="quick")B.mode="quick";save();render()}
function setM(k,v){B.manual[k]=v;save();render()}
function togglePrep(i){const s=B.prepDays,j=s.indexOf(i);if(j>=0){if(s.length===1){toast("Keep at least one prep day.");return}s.splice(j,1)}else s.push(i);save();render()}
const ON_PAGES=/github\.io$/.test(location.hostname);
const BK_URL=ON_PAGES?"../":"https://claude.ai/code/artifact/40cbce96-3b8f-42de-88a7-b64aadfe5191";
// turns Body & Kitchen data (a backup file or the app's own storage) into targets, prices and budget
function bkFrom(o){if(!o||!o.core||!o.core.profile)return{err:"notbk"};
 const core=o.core,p=core.profile,ent=((o.body||{}).entries||[]).filter(e=>e.weight).sort((a,b)=>a.date.localeCompare(b.date));
 const w=ent.length?+ent[ent.length-1].weight:+p.weight||0,ad=adaptiveFromBackup(o.body,o.logs),t=calcTargets(p,w,core.phase,ad);
 if(!t)return{err:"profile"};
 const sp=core.shopPrices||{},shops=core.shops&&core.shops.length?core.shops:[((core.setup||{}).answers||{}).shop||"Intermarché"],fs=core.foodShop||{},prices={};
 Object.keys(FOODS).forEach(id=>{const sh=fs[id]||shops[0];let v=null;if(sp[sh]&&sp[sh][id]!=null)v=sp[sh][id];else if(core.prices&&core.prices[id]!=null)v=core.prices[id];else for(const k in sp)if(sp[k][id]!=null){v=sp[k][id];break}if(v!=null&&+v>0)prices[id]=+v});
 return{bk:{at:today(),t:{kcal:t.kcal,p:t.p,c:t.c,f:t.f},phase:t.manual?"Custom targets":(PHASES[(core.phase||{}).name]||PHASES.cut).label,weight:w||null,adaptive:t.adaptive&&!t.manual,prices,budget:+core.budget||null,shop:shops[0]},t}}
// on GitHub Pages both apps live on the same site, so Prep can read Body & Kitchen's data on this phone directly
let bkLive=false;
function linkLocalBK(){if(!ON_PAGES)return;let o=null;try{const r=localStorage.getItem("serena-fit-v1");if(r)o=JSON.parse(r)}catch(e){}
 if(!o)return;const res=bkFrom(o);if(!res.bk)return;const changed=JSON.stringify((B.bk||{}).t)!==JSON.stringify(res.bk.t)||JSON.stringify((B.bk||{}).prices)!==JSON.stringify(res.bk.prices);
 B.bk=res.bk;bkLive=true;if(B.mode==="example")B.mode="bk";if(changed)save()}
function importBK(input){const file=input.files&&input.files[0];if(!file)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||o.app!=="serena-body-kitchen"){toast("That isn't a Body & Kitchen backup. Use Me → Backup → Download backup.");return}
  const res=bkFrom(o);if(res.err){toast(res.err==="profile"?"Your Body & Kitchen profile needs age, height and weight first.":"That isn't a Body & Kitchen backup.");return}
  B.bk=res.bk;B.mode="bk";save();render();toast(`Imported: ${r0(res.t.kcal)} kcal, ${r0(res.t.p)} g protein a day.`)}catch(e){toast("Couldn't read that file. Download a fresh backup and try again.")}};
 rd.readAsText(file);input.value=""}

/* ---------- shell ---------- */
const TABS=[["build","🥣","Build"],["bowls","⚖️","Bowls"],["plan","📅","Plan"],["shop","🛒","Shop"],["goals","🎯","Goals"]];
function go(t){tab=t;closeSheet();render();window.scrollTo(0,0)}
function render(){
 document.getElementById("app").innerHTML=({build:vBuild,bowls:vBowls,plan:vPlan,shop:vShop,goals:vGoals}[tab]||vBuild)();
 document.getElementById("nav").innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')" aria-current="${tab===k?"page":"false"}"><span aria-hidden="true">${i}</span>${l}</button>`).join("");
}
load();linkLocalBK();render();connect();
addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&ON_PAGES){linkLocalBK();render()}});
</script>
